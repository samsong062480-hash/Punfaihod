<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>ปั่นไฟหนีล่า</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Mitr:wght@400;600&family=Sarabun:wght@400;600&family=Chakra+Petch:wght@600;700&display=swap">
<style>
/* Layout: top bar (brand + wallet), then one page at a time. Game page = fogged board on the left, seat panel + log on the right. Dark industrial, amber = power, red = killer. */
:root{
  color-scheme:dark;
  --bg:#0b100d; --surface:#131a16; --raised:#1b2520; --line:#2a3731;
  --fg:#e5eee8; --muted:#8fa197;
  --amber:#f0b429; --amber-ink:#1a1405; --danger:#ee4b55; --good:#5fd6a0;
  --s0:#58b2ff; --s1:#5fd6a0; --s2:#ff9ecb; --s3:#b79cff;
  --scrim:rgba(6,9,7,.86);
  --f-display:'Mitr','Noto Sans Thai',system-ui,sans-serif;
  --f-body:'Sarabun','Noto Sans Thai',system-ui,sans-serif;
  --f-num:'Chakra Petch','Sarabun',ui-monospace,monospace;
}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{margin:0;color:var(--fg);font:15px/1.5 var(--f-body);padding-block:12px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button,input,select{font:inherit;color:inherit}
[hidden]{display:none!important}
.app{max-width:1180px;margin:0 auto;display:grid;gap:14px}
.bar{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.brand{font:600 24px/1.1 var(--f-display);display:flex;align-items:center;gap:10px;cursor:pointer;background:none;border:0;padding:0}
.brand i{width:12px;height:12px;border-radius:50%;background:var(--amber);box-shadow:0 0 14px 2px rgba(240,180,41,.55)}
.wallet{font:700 14px var(--f-num);color:var(--amber);border:1px solid var(--line);padding:5px 10px;background:var(--surface);display:flex;gap:6px;align-items:center}
.btn{background:var(--raised);border:1px solid var(--line);padding:9px 14px;min-height:44px;font-weight:600;font-size:14px;cursor:pointer;border-radius:6px}
.btn:hover{border-color:var(--muted)}
.btn.pri{background:var(--amber);border-color:var(--amber);color:var(--amber-ink)}
.btn.dng{border-color:var(--danger);color:var(--danger)}
.btn:disabled{opacity:.4;cursor:default}
.btn.sm{min-height:36px;padding:5px 10px;font-size:13px}
.btn:focus-visible,.card:focus-visible,.pick:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
.pg{display:grid;gap:16px}
h1,h2,h3{font-family:var(--f-display);font-weight:600;margin:0;text-wrap:balance}
h1{font-size:30px;line-height:1.2}
h2{font-size:21px}
h3{font-size:16px}
p{margin:0}
.muted{color:var(--muted)}
.note{font-size:13px;color:var(--muted)}
.hero{display:grid;gap:8px;padding:6px 0 4px}
.menu{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.mcard{background:var(--surface);border:1px solid var(--line);padding:16px;text-align:left;cursor:pointer;display:grid;gap:6px;border-radius:6px;min-width:0}
.mcard:hover{border-color:var(--amber)}
.mcard b{font:600 18px var(--f-display)}
.mcard span{color:var(--muted);font-size:13.5px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.card{background:var(--surface);border:1px solid var(--line);padding:12px;display:grid;gap:6px;border-radius:6px;min-width:0;align-content:start}
.pick{cursor:pointer;text-align:left}
.pick[aria-pressed="true"]{border-color:var(--amber);background:var(--raised)}
.pick:disabled{opacity:.5;cursor:default}
.card b{font:600 16px var(--f-display)}
.card small{color:var(--muted);font-size:13px;line-height:1.35}
.tag{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:50%;background:var(--col,var(--amber));color:#0b0f0d;font:700 15px var(--f-num)}
.tag.k{border-radius:5px;background:var(--danger);color:#fff}
.price{font:700 13px var(--f-num);color:var(--amber)}
.own{font:600 12px var(--f-num);color:var(--good)}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.field{display:grid;gap:4px;max-width:320px}
.field input{background:var(--surface);border:1px solid var(--line);padding:9px 12px;min-height:44px;border-radius:6px;font-size:16px}
.chk{display:flex;gap:8px;align-items:center}
.chk input{width:20px;height:20px}
.err{color:var(--danger);font-size:14px}
.code{font:700 34px var(--f-num);letter-spacing:.2em;color:var(--amber)}
.seats{display:grid;gap:8px}
.seat{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--line);padding:10px 12px;border-radius:6px}
.seat.mine{border-color:var(--amber)}
.seat select{background:var(--bg);border:1px solid var(--line);padding:6px;border-radius:6px;max-width:100%}
.seat small{display:block;color:var(--muted)}
/* game */
.gwrap{display:grid;gap:14px;grid-template-columns:minmax(0,1fr)}
@media(min-width:1000px){.gwrap{grid-template-columns:minmax(0,1fr) 340px;align-items:start}}
.gmain,.gside{display:grid;gap:10px;min-width:0;align-content:start;grid-template-columns:minmax(0,1fr)}
.hud{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;font:600 13px var(--f-num);color:var(--muted);letter-spacing:.03em}
.hud b{color:var(--fg)}
.pips{display:flex;gap:4px}
.pip{width:34px;height:8px;background:var(--surface);border:1px solid var(--line);position:relative}
.pip i{position:absolute;inset:0 auto 0 0;background:var(--amber)}
.pip.d{border-color:var(--good)}.pip.d i{background:var(--good)}
.phase{padding:2px 8px;border:1px solid var(--line)}
.phase.k{color:#fff;background:var(--danger);border-color:var(--danger)}
.boardbox{overflow:auto;border:1px solid var(--line);background:#0b100d;max-height:min(76vh,860px);touch-action:pan-x pan-y;overscroll-behavior:contain}
canvas{display:block}
.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.legend{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12px;color:var(--muted)}
.panel{background:var(--surface);border:1px solid var(--line);padding:12px;display:grid;gap:10px;border-radius:6px}
.who{display:flex;align-items:center;gap:10px}
.who b{display:block;font:600 17px/1.2 var(--f-display)}
.who small{color:var(--muted);font-size:12.5px;line-height:1.3;display:block}
.st{margin-left:auto;font:600 12px var(--f-num);padding:3px 8px;border:1px solid var(--line);white-space:nowrap}
.st.bad{color:var(--danger);border-color:var(--danger)}
.st.hook{color:#fff;background:var(--danger);border-color:var(--danger)}
.dicebox{display:flex;align-items:center;gap:12px;min-height:46px}
.dice{display:flex;gap:6px}
.die{display:inline-grid;place-items:center;width:42px;height:42px;border-radius:8px;background:var(--fg);color:var(--bg);font:700 23px var(--f-num)}
.die.lo{opacity:.45}
.mv{font:600 12px var(--f-num);color:var(--muted);letter-spacing:.03em}
.mv b{display:block;font:700 26px/1 var(--f-num);color:var(--amber);letter-spacing:0}
.actions{display:flex;flex-wrap:wrap;gap:8px}
.bar2{height:8px;background:var(--bg);border:1px solid var(--line)}
.bar2 i{display:block;height:100%;background:var(--danger)}
.roster{display:grid;gap:6px;font-size:13px}
.rr{display:flex;align-items:center;gap:8px}
.rr .tag{width:22px;height:22px;font-size:12px}
.rr span:last-child{margin-left:auto;font:600 12px var(--f-num);color:var(--muted)}
#log{list-style:none;margin:0;padding:0;display:grid;gap:3px;font-size:13px;color:var(--muted)}
#log li:first-child{color:var(--fg)}
#log li.h{font:600 11px var(--f-num);letter-spacing:.06em;color:var(--amber);padding-top:4px}
.help{display:grid;gap:12px;max-width:760px}
.help ul{margin:6px 0 0;padding-left:20px;display:grid;gap:3px;color:var(--muted)}
.help b{color:var(--fg)}
.modal{position:fixed;inset:0;background:var(--scrim);display:grid;place-items:center;z-index:20;padding:16px}
.mbox{background:var(--surface);border:1px solid var(--amber);max-width:420px;width:100%;padding:20px;display:grid;gap:12px;border-radius:8px}
.mbox h2{font-size:26px}
.tbl{display:grid;gap:4px;font-size:14px}
.tbl div{display:flex;justify-content:space-between;gap:10px}
.tbl .t{border-top:1px solid var(--line);padding-top:6px;font:700 16px var(--f-num);color:var(--amber)}

.btn{min-height:48px;font-size:15px}
.btn.sm{min-height:40px}
.btn.big{min-height:56px;font-size:17px;padding:12px 20px}
.spr{width:36px;height:42px;image-rendering:pixelated;flex:none}
.spr.l{width:48px;height:56px}
.hero{padding:10px 0 4px}
.hero h1{font-size:34px}
.menu .mcard{grid-template-columns:auto 1fr;align-items:center;gap:4px 12px}
.menu .mcard .spr{grid-row:1/3}
.thumb{width:100%;max-width:150px;aspect-ratio:1;image-rendering:pixelated;border:1px solid var(--line);background:#0b100d}
.mp{display:grid;gap:6px}
.hint{display:flex;align-items:center;gap:10px;background:var(--raised);border:1px solid var(--amber);padding:10px 12px;border-radius:8px;font-weight:600;font-size:15px;min-height:52px}
.hint.wait{border-color:var(--line);color:var(--muted);font-weight:400}
.hint.warn{border-color:var(--danger);color:#ffd7da}
.steps{display:flex;gap:6px;flex-wrap:wrap}
.step{font:700 12px var(--f-num);padding:3px 9px;border:1px solid var(--line);color:var(--muted);border-radius:99px}
.step.on{background:var(--amber);border-color:var(--amber);color:var(--amber-ink)}
.step.done{color:var(--good);border-color:var(--good)}
.bw{position:relative;min-width:0;max-width:100%}
.zoomctl{position:absolute;right:8px;top:8px;display:grid;gap:6px;z-index:3}
.zoomctl .btn{width:44px;min-height:44px;padding:0;font-size:20px;background:rgba(19,26,22,.92)}
.zoomctl .btn.t{font-size:12px;font-family:var(--f-num)}
.tools .btn.sm{min-height:44px}
.acts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.acts .btn{text-align:left;display:flex;gap:8px;align-items:center}
.acts .btn.pri{grid-column:1/-1;justify-content:center;min-height:56px;font-size:17px}
.mini{font-size:12px;color:var(--muted)}
body.ingame{padding-bottom:40px}
@media(max-width:999px){
  body.ingame{padding-bottom:calc(46vh + 16px)}
  #panel{position:fixed;left:0;right:0;bottom:0;z-index:15;max-height:46vh;overflow:auto;border-radius:14px 14px 0 0;border-width:1px 0 0;padding:12px max(16px,env(safe-area-inset-left,0px)) calc(12px + env(safe-area-inset-bottom,0px));box-shadow:0 -8px 24px rgba(0,0,0,.5)}
}
@media(prefers-reduced-motion:no-preference){.hint:not(.wait){animation:glow 1.8s ease-in-out infinite}@keyframes glow{50%{box-shadow:0 0 0 3px rgba(240,180,41,.18)}}}
.team{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}.tm .nm{min-width:0}.tm .nm small,.tm .nm b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.tm{display:flex;align-items:center;gap:7px;background:rgba(8,12,10,.82);border:1px solid rgba(255,255,255,.1);border-left:4px solid var(--c,#58b2ff);border-radius:8px;padding:4px 8px 4px 5px;min-width:0}
.tm.me{background:rgba(26,34,28,.92);box-shadow:0 0 0 1px rgba(255,255,255,.35) inset}
.tm .spr{width:26px;height:30px;flex:none}
.tm.gone{opacity:.55;filter:grayscale(.8)}
.tm .nm{display:grid;line-height:1.15;min-width:0}
.tm .nm b{font-size:12px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tm .nm small{font-size:11px;color:#9fb0a6}
.tm .ic{margin-left:auto;display:flex;align-items:center;gap:3px;flex:none}
.tm svg{width:20px;height:20px}
.hb{position:relative;display:flex;align-items:center;gap:2px;margin-right:4px;padding:2px 3px;border:1px solid #555;border-radius:6px;background:#0c1012}.hb.on{border-color:#e8a33d}.hb span{display:flex;gap:1px}.hb i{width:4px;height:8px;background:#333;border-radius:1px}.hb .hp1 i.on{background:#e8a33d}.hb .hp2 i.on{background:#ee4b55}.hb u{width:2px;height:12px;background:#aaa;margin:0 1px}.hb em{position:absolute;left:calc(100% - 14px);top:-5px;width:2px;height:5px;background:#ee4b55}.tm .en{font:700 10px 'Chakra Petch',monospace;color:#5fd6a0;border:1px solid #5fd6a0;border-radius:4px;padding:0 3px;margin-right:4px}.tm.unk .qk{display:inline-flex;align-items:center;justify-content:center;width:28px;height:32px;font:700 20px 'Chakra Petch',monospace;color:#888;background:#111;border-radius:6px}
.tm .pips{display:flex;gap:2px}.tm .pips i{width:6px;height:6px;border-radius:50%;background:#555}.tm .pips i.on{background:#ee4b55}
@media(max-width:720px){.tm{padding:3px 5px 3px 4px;gap:4px}.tm .nm small{display:none}.tm .nm b{font-size:11px}.tm .spr{width:20px;height:24px}.tm svg{width:16px;height:16px}.tm .pips{display:none}}
.tabs{grid-template-columns:repeat(3,1fr)}.chips{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
.chip{display:flex;align-items:center;gap:6px;background:var(--panel,#141c17);border:1px solid var(--line);border-radius:10px;padding:4px 10px 4px 6px;color:inherit;font:inherit;cursor:pointer}
.chip[aria-pressed=true]{border-color:#f0b429;box-shadow:0 0 0 1px #f0b429 inset}.chip .spr{width:28px;height:32px}
.card.on{border-color:#f0b429}.spr.l{width:56px;height:64px}
</style>

const GLOB=['ประตูหนีทั้ง','ตกรอบ','หนีออก','จบเกม','หมดเวลาเกม','ตำแหน่งสุ่ม'];
function lg(t,v){
  let p=null;
  if(v!=='h'&&v!=='k'&&!GLOB.some(w=>t.indexOf(w)>=0)){
    if(t.startsWith('ผู้ล่า'))p={x:G.K.x,y:G.K.y};
    else{const s=G.S.find(s=>t.startsWith(SCH[s.key].n));if(s)p={x:s.x,y:s.y};}
  }
  LOG.push({t,h:v==='h'?1:0,k:v==='k'?1:0,p,id:++LOGID});if(LOG.length>40)LOG.shift();LOGV++;
}
async function SLH(ms){const gid=G&&G.gid;HOOK();await SL(ms);if(!G||G.gid!==gid)throw new Error('stale');}
const nm=s=>SCH[s.key].n;
const palSt=(x,y)=>G.pal[pI[key(x,y)]];
const isDr=t=>t==='D'||t==='B';
const brkNeed=t=>t==='B'?3:2;
const drSt=(x,y)=>G.dr[dI[key(x,y)]];

/* ---------- เส้นทาง ---------- */
function hpush(h,it){h.push(it);let i=h.length-1;while(i>0){const p=(i-1)>>1;if(h[p][0]<=h[i][0])break;[h[p],h[i]]=[h[i],h[p]];i=p;}}
function hpop(h){const top=h[0],last=h.pop();if(h.length){h[0]=last;let i=0;for(;;){const l=2*i+1,r=l+1;let m=i;if(l<h.length&&h[l][0]<h[m][0])m=l;if(r<h.length&&h[r][0]<h[m][0])m=r;if(m===i)break;[h[m],h[i]]=[h[i],h[m]];i=m;}}return top;}
function dijk(sx,sy,cost,limit,occ,term){
  const dist=new Map([[key(sx,sy),0]]),prev=new Map(),h=[[0,sx,sy]];
  while(h.length){
    const [d,x,y]=hpop(h);
    if(d>dist.get(key(x,y)))continue;
    if(term&&d>0&&term(x,y))continue;
    for(const [dx,dy] of D4){
      const nx=x+dx,ny=y+dy;
      if(nx<0||ny<0||nx>=W||ny>=H)continue;
      const k=key(nx,ny);
      if(occ.has(k))continue;
      const c=cost(nx,ny);
      if(c===Infinity)continue;
      const nd=d+c;
      if(nd>limit)continue;
      if(!dist.has(k)||nd<dist.get(k)){dist.set(k,nd);prev.set(k,key(x,y));hpush(h,[nd,nx,ny]);}
    }
  }
  return {dist,prev};
}
function pathKeys(prev,k){const p=[];while(prev.has(k)){p.unshift(k);k=prev.get(k);}return p;}
function occSet(exS,exK){
  const o=new Set();
  if(!exK)o.add(key(G.K.x,G.K.y));
  for(const s of G.S)if(s.i!==exS&&alive(s)&&s.hp!=='carry'&&s.hp!=='hook')o.add(key(s.x,s.y));
  return o;
}
function trapAt(x,y){return !!(G&&G.traps&&G.traps.some(t=>t.x===x&&t.y===y));}
function sCost(s,x,y){
  const t=tile(x,y);
  if(isB(t))return Infinity;
  if(s.ctl==='a'&&trapAt(x,y))return Infinity;
  if(isDr(t))return drSt(x,y)==='c'?Infinity:1;
  if(t==='E')return G.xo[exSide(x,y)]?1:Infinity;
  if(t==='W')return 0;
  return 1;
}
function sPlan(s,x,y){return sCost(s,x,y);}
function kCost(x,y){
  const t=tile(x,y);
  if(isB(t)||t==='E')return Infinity;
  if(t==='P')return palSt(x,y)==='d'?Infinity:1;
  if(isDr(t))return drSt(x,y)==='c'?Infinity:1;
  if(t==='W')return K_WIN;
  return 1;
}
function kPlan(x,y){
  const t=tile(x,y);
  if(t==='P'&&palSt(x,y)==='d')return 3;
  if(isDr(t)&&drSt(x,y)==='c')return brkNeed(t)+1;
  return kCost(x,y);
}
function nearList(s,pred){
  const r=[];
  for(const [dx,dy] of [[0,0],...D4]){const x=s.x+dx,y=s.y+dy;if(x>=0&&y>=0&&x<W&&y<H&&pred(x,y))r.push({x,y});}
  return r;
}

/* ---------- การมองเห็น ---------- */
function killerSees(s){
  if(s.hid>=0)return false;
  if(s.rev>0)return true;
  if(s.hp==='carry')return true;
  const r=KCH[G.K.key].vis;
  return d2(s,G.K)<=r*r;
}
function seesK(s){return G.K.carry>=0&&d2(s,G.K)<=(R_S+2)*(R_S+2)||d2(s,G.K)<=R_S*R_S;}

/* ---------- เริ่มเกม / รอบ ---------- */
function pickSpawns(){
  const cand=[];
  for(let y=0;y<H;y++)for(let x=0;x<W;x++){const c=MAP[y][x];if(c==='.'||c==='i')cand.push([x,y]);}
  const dd=(a,b)=>Math.abs(a[0]-b[0])+Math.abs(a[1]-b[1]);
  for(const [ds,dk] of [[18,22],[14,18],[8,10],[0,0]]){
    for(let a=0;a<120;a++){
      const pool=cand.slice().sort(()=>Math.random()-.5),S=[];
      for(const p of pool){if(S.every(q=>dd(q,p)>=ds)){S.push(p);if(S.length===4)break;}}
      if(S.length<4)continue;
      const K=pool.find(p=>S.every(q=>dd(q,p)>=dk));
      if(K)return {S,K};
    }
  }
  return {S:cand.slice(0,4),K:cand[4]};
}
function newGame(cfg){
  loadMap(cfg.map|0);
  LOG=[];LOGV=0;
  const sp=pickSpawns();
  G={gid:Math.random().toString(36).slice(2,8),rd:1,ph:'S',gate:false,xs:(()=>{const a=[0,1,2,3].sort(()=>Math.random()-.5);return a.slice(0,2).sort();})(),xp:[0,0,0,0],xo:[0,0,0,0],
    gp:GENS.map(()=>0),sh:GENS.map(()=>0),al:[],pal:PALS.map(()=>'u'),ch:CHESTS.map(()=>0),hk:HOOKS.map(()=>-1),lk:LOCKERS.map(()=>-1),dr:DOORS.map(()=>'c'),map:MAPID,
    S:cfg.schars.map((k,i)=>({i,key:k,x:sp.S[i][0],y:sp.S[i][1],hid:-1,hidRd:0,rev:0,hp:'ok',hooks:0,hl:0,hph:1,kn:0,en:0,item:null,heal:0,acc:(cfg.sacc&&cfg.sacc[i])||'',acted:false,rolled:false,pts:0,rv:0,sp:false,str:0,rep:0,res:0,ctl:cfg.ctl[i+1]})),
    K:{key:cfg.kchar,acc:cfg.kacc||'',x:sp.K[0],y:sp.K[1],chk:[],dmg:0,stun:false,warp:0,scd:0,carry:-1,pts:0,rolled:false,rv:[0,0],hits:0,hangs:0,mem:null,pat:-1,ctl:cfg.ctl[0]},
    traps:[],noise:null,roll:null,rid:0,over:null,dl:0,timer:!!cfg.timer,pl:cfg.pl||[null,null,null,null,null],nk:cfg.nk||[]};
  lg('ทุกคนเริ่มเกมที่ตำแหน่งสุ่ม แยกกันคนละทาง','h');
  startRound();
  return G;
}
function stamp(){if(G.timer)G.dl=Date.now()+SECS*1000;}
function startRound(){
  G.ph='S';
  lg('— รอบที่ '+G.rd+' —','h');
  for(const s of G.S){s.acted=!playable(s);s.rolled=false;s.pts=0;s.rv=0;}
  stamp();
  if(G.S.every(s=>s.acted))startKillerPhase();
}
function freeHook(s){const j=G.hk.indexOf(s.i);if(j>=0)G.hk[j]=-1;}
function calcOver(){return {esc:G.S.filter(s=>s.hp==='esc').length,rd:G.rd};}
function maybeEnd(){
  if(G.S.every(s=>!alive(s))){G.ph='END';G.over=calcOver();lg('จบเกม','h');return true;}
  return false;
}
function updateKS(){
  if(!G||G.ks||G.ph==='END')return;
  if(G.S.some(s=>alive(s)&&s.hid<0&&seesK(s))){G.ks=1;lg('ทีมเห็นผู้ล่าแล้ว: '+KCH[G.K.key].n,'h');}
}
function startKillerPhase(){
  G.ph='K';
  for(const s of G.S){
    if(s.hp==='hook'){
      if(md(s,G.K)<=SELF_NEAR){
        s.kn=(s.kn||0)+1;
        if(s.kn>=SELF_NEED){
          freeHook(s);s.hp='hurt';s.heal=0;s.hl=0;s.kn=0;s.en=ENDURE;
          alertK(s.x,s.y,'มีคนปลดตัวเองจากตะขอ');
          lg(nm(s)+' ปลดตัวเองลงจากตะขอ! ได้สถานะทนทาน '+ENDURE+' เทิร์น','s');
          continue;
        }
        lg(nm(s)+' ดิ้นบนตะขอ (ผู้ล่าอยู่ใกล้ '+s.kn+'/'+SELF_NEED+')');
      }
      s.hl--;
      if(s.hl<=0){
        if((s.hph||1)===1){s.hph=2;s.hl=HOOK_P2;lg(nm(s)+' เข้าสู่เฟส 2 บนตะขอ เหลือ '+s.hl+' เทิร์น','h');}
        else{freeHook(s);s.hp='out';lg(nm(s)+' หมดเวลาบนตะขอ ตกรอบ');}
      }
      else if(s.hl===1)lg(nm(s)+' เหลือเวลาบนตะขออีก 1 เทิร์น');
    }
  }
  if(maybeEnd())return;
  if(G.K.stun){G.K.stun=false;lg('ผู้ล่ายังมึนอยู่ เสียเทิร์น');endKillerPhase();return;}
  G.K.rolled=false;G.K.pts=0;
  stamp();
}
function endKillerPhase(){
  G.al=[];
  for(let j=0;j<GENS.length;j++)if(G.sh[j]&&G.gp[j]<GEN_NEED)G.gp[j]=Math.max(0,G.gp[j]-1);
  for(const s of G.S){s.rev=0;if(s.en>0)s.en--;}
  G.noise=null;G.K.warp=Math.max(0,G.K.warp-1);G.K.scd=Math.max(0,(G.K.scd||0)-1);G.K.pts=0;
  G.rd++;
  if(G.rd>MAXR){G.ph='END';G.over=calcOver();lg('หมดเวลาเกม','h');return;}
  startRound();
}
function afterS(){if(G.ph==='S'&&G.S.every(t=>t.acted||!playable(t)))startKillerPhase();}

/* ---------- ผู้รอดชีวิต ---------- */
function can(s){return G.ph==='S'&&playable(s)&&!s.acted;}
function autoEnd(s){
  if(!(s.pts>0)){s.acted=true;s.pts=0;afterS();}
}
function alertK(x,y,t){
  G.al=(G.al||[]).filter(a=>a.x!==x||a.y!==y);
  G.al.push({x,y});if(G.al.length>8)G.al.shift();
  lg(t+' ที่ '+coord(x,y),'k');
}
function sRoll(i){
  const s=G.S[i];
  if(!can(s)||s.hp==='carry'||s.rolled||s.hid>=0)return false;
  const v=rnd(6);
  s.rv=v;s.pts=Math.max(1,v+SB-(s.hp==='hurt'?1:0)-(s.snare?2:0));s.rolled=true;if(s.snare){s.snare=0;lg(nm(s)+' ยังเจ็บจากกับดักหมี เดินได้น้อยลง 2 แต้ม','s');}
  G.roll={id:++G.rid,seat:i+1,vals:[v]};
  return true;
}
function sReach(i){
  const s=G.S[i];
  if(!can(s)||!s.rolled||s.pts<=0)return {dist:new Map(),prev:new Map()};
  const r=dijk(s.x,s.y,(x,y)=>sCost(s,x,y),s.pts,occSet(i,false));
  for(const k of Array.from(r.dist.keys())){const [a,b]=k.split(',').map(Number);if(tile(a,b)==='W')r.dist.delete(k);}
  return r;
}
function sMove(i,x,y){
  const s=G.S[i];
  const r=sReach(i),d=r.dist.get(key(x,y));
  if(!d)return false;
  let vault=null,trap=null,rr=r;
  if(G.traps&&G.traps.length){
    const r2=dijk(s.x,s.y,(a,b)=>(trapAt(a,b)&&!(a===x&&b===y))?Infinity:sCost(s,a,b),s.pts,occSet(i,false));
    if(r2.dist.get(key(x,y))===d)rr=r2;
  }
  for(const k of pathKeys(rr.prev,key(x,y))){const [a,b]=k.split(',').map(Number);if(!trap&&trapAt(a,b))trap={x:a,y:b};if(!trap&&!vault&&(tile(a,b)==='W'||(tile(a,b)==='P'&&palSt(a,b)==='d')))vault={x:a,y:b};}
  if(trap){
    s.x=trap.x;s.y=trap.y;s.pts=0;s.snare=1;s.rev=1;
    G.traps=(G.traps||[]).filter(t=>t.x!==trap.x||t.y!==trap.y);
    lg(nm(s)+' เหยียบกับดักหมี ติดอยู่ที่ '+coord(trap.x,trap.y)+' เทิร์นหน้าเดินได้น้อยลง 2 แต้ม','s');
    alertK(trap.x,trap.y,'มีผู้รอดชีวิตติดกับดักหมี');
    autoEnd(s);
    return true;
  }
  s.x=x;s.y=y;s.pts-=d;
  if(vault){s.rev=1;alertK(vault.x,vault.y,'ผู้รอดชีวิตข้าม'+(tile(vault.x,vault.y)==='W'?'หน้าต่าง':'พาเล็ต'));}
  if(tile(x,y)==='E'&&G.xo[exSide(x,y)]){
    s.hp='esc';s.pts=0;s.acted=true;
    lg(nm(s)+' หนีออกจากประตูได้สำเร็จ');
    if(!maybeEnd())afterS();
    return true;
  }
  autoEnd(s);
  return true;
}
function sRepair(i){
  const s=G.S[i];
  if(!can(s)||!s.rolled||s.pts<1)return false;
  const g=nearList(s,(x,y)=>tile(x,y)==='G'&&G.gp[gI[key(x,y)]]<GEN_NEED)[0];
  if(!g)return false;
  const j=gI[key(g.x,g.y)];
  const need=GEN_NEED-G.gp[j],spend=Math.min(s.pts,need);
  let add=spend;
  if(s.item==='tool'){add+=4;s.item=null;lg(nm(s)+' ใช้ชุดเครื่องมือ ปั่นเพิ่ม +4','s');}
  G.gp[j]=Math.min(GEN_NEED,G.gp[j]+add);
  s.pts-=spend;s.rep++;
  lg(nm(s)+' ปั่นเครื่อง '+(j+1)+' ('+coord(g.x,g.y)+') เป็น '+G.gp[j]+'/'+GEN_NEED,'s');
  if(G.sh[j]&&G.gp[j]>=G.sh[j]){G.sh[j]=0;lg(nm(s)+' ซ่อมเครื่อง '+(j+1)+' จนหายช็อต','s');}
  if(G.gp[j]>=GEN_NEED){
    G.sh[j]=0;lg(nm(s)+' ปั่นเครื่อง '+(j+1)+' จนติดสำเร็จ','s');alertK(g.x,g.y,'เครื่องปั่นไฟติดแล้ว');
    if(!G.gate&&G.gp.filter(p=>p>=GEN_NEED).length>=GEN_GOAL){G.gate=true;lg('ปั่นไฟครบ '+GEN_GOAL+' เครื่อง ประตูทางออกมีไฟแล้ว ไปหาประตูแล้วใช้ '+EXIT_NEED+' แต้มเปิด!','g');}
  }
  if(rnd(6)===1){G.noise={x:g.x,y:g.y};lg('ผู้ล่าได้ยินเสียงเครื่องปั่นไฟดังที่ '+coord(g.x,g.y),'k');}
  autoEnd(s);
  return true;
}
function sOpenGate(i){
  const s=G.S[i];
  if(!can(s)||!s.rolled||s.pts<1||!G.gate)return false;
  const e=nearList(s,(x,y)=>tile(x,y)==='E'&&G.xs.indexOf(exSide(x,y))>=0&&!G.xo[exSide(x,y)])[0];
  if(!e)return false;
  const sd=exSide(e.x,e.y);
  const sp=Math.min(s.pts,EXIT_NEED-G.xp[sd]);
  G.xp[sd]+=sp;
  lg(nm(s)+' กำลังเปิดประตูทางออก ('+coord(e.x,e.y)+')','s');
  s.pts-=sp;
  if(G.xp[sd]>=EXIT_NEED){G.xo[sd]=1;alertK(e.x,e.y,'ประตูทางออกเปิดแล้ว');lg('ประตูทางออกด้าน'+['บน','ล่าง','ซ้าย','ขวา'][sd]+'เปิดแล้ว!','g');}
  autoEnd(s);
  return true;
}
function dropCarry(){
  const k=G.K,s=G.S[k.carry];
  k.carry=-1;
  s.hp='down';s.str=0;s.acted=true;
  const occ=occSet(s.i,false);
  for(const [dx,dy] of D4){
    const x=k.x+dx,y=k.y+dy;
    if(x>=0&&y>=0&&x<W&&y<H&&sCost(s,x,y)<Infinity&&tile(x,y)!=='E'&&!occ.has(key(x,y))){s.x=x;s.y=y;return;}
  }
  s.x=k.x;s.y=k.y;
}
function sPallet(i){
  const s=G.S[i];
  if(!can(s)||!s.rolled||s.pts<1)return false;
  const p=nearList(s,(x,y)=>tile(x,y)==='P'&&palSt(x,y)==='u')[0];
  if(!p)return false;
  G.pal[pI[key(p.x,p.y)]]='d';
  s.pts-=1;alertK(p.x,p.y,'มีคนล้มพาเล็ต');
  if(md(p,G.K)<=1&&G.K.key==='brt'){
    lg(nm(s)+' ล้มพาเล็ตใส่ผู้ล่า แต่อัศวินยกโล่รับไว้ ไม่สตัน');
  }else if(md(p,G.K)<=1){
    G.K.stun=true;
    lg(nm(s)+' ล้มพาเล็ตใส่ผู้ล่า สตัน 1 เทิร์น');
    if(G.K.carry>=0){lg('ผู้ล่าทิ้งผู้รอดชีวิตที่อุ้มไว้');dropCarry();}
  }else lg(nm(s)+' ล้มพาเล็ตที่ '+coord(p.x,p.y));
  autoEnd(s);
  return true;
}
function sChest(i){
  const s=G.S[i];
  if(!can(s)||!s.rolled||s.pts<2||s.item)return false;
  const c=nearList(s,(x,y)=>tile(x,y)==='C'&&!G.ch[cI[key(x,y)]])[0];
  if(!c)return false;
  const ks=['flash','kit','tool'];
  s.item=ks[rnd(3)-1];G.ch[cI[key(c.x,c.y)]]=1;s.pts-=2;
  lg(nm(s)+' เปิดกล่องได้ '+({flash:'ไฟฉาย',kit:'ชุดปฐมพยาบาล',tool:'ชุดเครื่องมือ'})[s.item],'s');
  autoEnd(s);
  return true;
}
function sRescue(i){
  const s=G.S[i];
  if(!can(s)||!s.rolled||s.hp==='carry')return false;
  const cost=1;
  if(s.pts<cost)return false;
  const t=G.S.find(t=>t.i!==i&&t.hp==='hook'&&md(s,t)<=1);
  if(!t)return false;
  freeHook(t);t.hp='hurt';t.heal=0;t.hl=0;t.kn=0;t.en=ENDURE;alertK(t.x,t.y,'มีคนช่วยเพื่อนลงจากตะขอ');
  s.pts-=cost;s.res++;
  lg(nm(s)+' ช่วย '+nm(t)+' ลงจากตะขอ ได้สถานะทนทาน '+ENDURE+' เทิร์น');
  autoEnd(s);
  return true;
}
function sRevive(i){
  const s=G.S[i];
  if(!can(s)||!s.rolled||s.pts<3)return false;
  const t=G.S.find(t=>t.i!==i&&t.hp==='down'&&md(s,t)<=1);
  if(!t)return false;
  t.hp='hurt';s.pts-=3;s.res++;
  lg(nm(s)+' พยุง '+nm(t)+' ขึ้นมา');
  autoEnd(s);
  return true;
}
function sHeal(i,self){
  const s=G.S[i];
  if(self||!can(s)||!s.rolled||s.pts<1)return false;
  const t=G.S.find(t=>t.i!==i&&t.hp==='hurt'&&md(s,t)<=1);
  if(!t)return false;
  const sp=Math.min(s.pts,HEAL_NEED-(t.heal||0));
  t.heal=(t.heal||0)+sp;s.pts-=sp;
  if(t.heal>=HEAL_NEED){t.hp='ok';t.heal=0;lg(nm(s)+' รักษา '+nm(t)+' กลับมาปกติ');}
  else lg(nm(s)+' กำลังรักษา '+nm(t)+' ('+t.heal+'/'+HEAL_NEED+')');
  autoEnd(s);
  return true;
}
function sKit(i){
  const s=G.S[i];
  if(!can(s)||!s.rolled||s.item!=='kit'||s.pts<1)return false;
  const t=G.S.find(t=>t.i!==i&&t.hp==='hurt'&&md(s,t)<=1);
  if(!t)return false;
  t.hp='ok';t.heal=0;s.item=null;s.pts-=1;
  lg(nm(s)+' ใช้ชุดปฐมพยาบาลรักษา '+nm(t));
  autoEnd(s);
  return true;
}
function sFlash(i){
  const s=G.S[i];
  if(!can(s)||!s.rolled||s.item!=='flash'||s.pts<1||md(s,G.K)>3)return false;
  G.K.stun=true;s.item=null;s.pts-=1;
  lg(nm(s)+' ส่องไฟฉายใส่ผู้ล่า สตัน 1 เทิร์น');
  if(G.K.carry>=0){lg('ผู้ล่าทิ้งผู้รอดชีวิตที่อุ้มไว้');dropCarry();}
  autoEnd(s);
  return true;
}
function sSprint(i){return false;}
function sStruggle(i){
  const s=G.S[i];
  if(!can(s)||s.hp!=='carry')return false;
  const v=rnd(6),add=v;
  s.str+=add;s.acted=true;s.rv=v;
  G.roll={id:++G.rid,seat:i+1,vals:[v]};
  if(s.str>=STRUGGLE_NEED){
    dropCarry();
    s.hp='hurt';s.str=0;G.K.stun=true;
    lg(nm(s)+' ดิ้นหลุดจากการอุ้ม! ผู้ล่าเสียหลัก');
  }else lg(nm(s)+' ดิ้นขัดขืน ('+s.str+'/'+STRUGGLE_NEED+')');
  afterS();
  return true;
}
function sEnd(i){
  const s=G.S[i];
  if(!can(s))return false;
  s.acted=true;s.pts=0;
  afterS();
  return true;
}

/* ---------- ประตูไม้ และการพังเครื่องปั่นไฟ ---------- */
function sOpenDoor(i){return false;} // ผู้รอดชีวิตเปิดประตู/แผงไม้เองไม่ได้ มีแต่ผู้ล่าที่พังได้
function kBreakDoor(j){
  const k=G.K;
  if(G.ph!=='K'||!k.rolled||k.pts<brkNeed(tile(DOORS[j].x,DOORS[j].y))||k.carry>=0||j<0||j>=DOORS.length||G.dr[j]!=='c'||md(k,DOORS[j])>1)return false;
  const bn=brkNeed(tile(DOORS[j].x,DOORS[j].y));
  G.dr[j]='b';k.pts-=bn;
  lg('ผู้ล่าพัง'+(bn===3?'แผงไม้ ':'ประตูไม้ ')+coord(DOORS[j].x,DOORS[j].y));
  kAuto();
  return true;
}
function kDamage(j){
  const k=G.K;
  if(G.ph!=='K'||!k.rolled||k.pts<2||k.carry>=0||j<0||j>=GENS.length||md(k,GENS[j])!==1)return false;
  if(G.gp[j]<=0||G.gp[j]>=GEN_NEED||G.sh[j])return false;
  const pre=G.gp[j];
  G.gp[j]=Math.max(0,pre-3);G.sh[j]=pre;k.pts-=2;k.dmg++;
  G.noise=null;
  lg('ผู้ล่ากระทืบเครื่องปั่นไฟ '+coord(GENS[j].x,GENS[j].y)+' เครื่องช็อต! ลดทันที 3 แต้ม และลดต่อรอบละ 1 ต้องปั่นให้ถึง '+pre+' ถึงจะหายช็อต');
  kAuto();
  return true;
}

/* ---------- ตู้ล็อคเกอร์ ---------- */
function freeAround(x,y,exS,prefFar){
  const occ=occSet(exS,false),c=[];
  for(const [dx,dy] of D4){
    const a=x+dx,b=y+dy;
    if(a<0||b<0||a>=W||b>=H||isB(tile(a,b))||tile(a,b)==='E'||occ.has(key(a,b)))continue;
    c.push({x:a,y:b,d:md({x:a,y:b},G.K)});
  }
  c.sort((p,q)=>prefFar?q.d-p.d:p.d-q.d);
  return c[0]||null;
}
function sHide(i){
  const s=G.S[i];
  if(!can(s)||s.hp==='carry'||s.hid>=0||!s.rolled||s.pts<1)return false;
  const L=nearList(s,(x,y)=>tile(x,y)==='L'&&G.lk[lI[key(x,y)]]===-1)[0];
  if(!L)return false;
  const j=lI[key(L.x,L.y)];
  G.lk[j]=i;s.hid=j;s.hidRd=G.rd;s.x=L.x;s.y=L.y;s.pts=0;s.acted=true;
  lg(nm(s)+' เข้าไปซ่อนในตู้ล็อคเกอร์ '+coord(L.x,L.y));alertK(L.x,L.y,'มีคนเข้าตู้ล็อคเกอร์');
  afterS();
  return true;
}
function sUnhide(i){
  const s=G.S[i];
  if(!can(s)||s.hid<0)return false;
  const L=LOCKERS[s.hid],p=freeAround(L.x,L.y,i,true);
  if(!p)return false;
  G.lk[s.hid]=-1;s.hid=-1;s.x=p.x;s.y=p.y;
  lg(nm(s)+' ออกจากตู้ล็อคเกอร์');alertK(L.x,L.y,'มีคนออกจากตู้ล็อคเกอร์');
  return true;
}
function kOpen(j){
  const k=G.K;
  if(G.ph!=='K'||!k.rolled||k.pts<1||k.carry>=0||j<0||j>=LOCKERS.length||md(k,LOCKERS[j])!==1)return false;
  const L=LOCKERS[j],si=G.lk[j];
  k.pts=0;
  if(si<0){lg('ผู้ล่าเปิดตู้ล็อคเกอร์ '+coord(L.x,L.y)+' ว่างเปล่า');kAuto();return true;}
  const s=G.S[si];
  G.lk[j]=-1;s.hid=-1;
  const p=freeAround(L.x,L.y,si,false);
  if(p){s.x=p.x;s.y=p.y;}else{s.x=k.x;s.y=k.y;}
  if(s.en>0){lg('ผู้ล่าเปิดตู้ล็อคเกอร์ '+coord(L.x,L.y)+' เจอ '+nm(s)+' แต่ทนทาน ดาเมจไม่มีผล','s');kAuto();return true;}
  if(s.hp==='ok'){s.hp='hurt';s.heal=0;}else if(s.hp==='hurt'){s.hp='down';}
  k.hits++;
  lg('ผู้ล่าเปิดตู้ล็อคเกอร์ '+coord(L.x,L.y)+' เจอ '+nm(s)+' ฟาดเข้าไปเต็มแรง');
  kAuto();
  return true;
}

/* ---------- ผู้ล่า ---------- */
function kAuto(){if(G.ph==='K'&&G.K.pts<=0)endKillerPhase();}
function kRoll(){
  const k=G.K;
  if(G.ph!=='K'||k.rolled)return false;
  const a=rnd(6),b=rnd(6);
  let p=Math.max(a,b)+KCH[k.key].bonus+KB;
  if(k.carry>=0)p-=1;
  k.pts=Math.max(1,p);k.rolled=true;k.rv=[a,b];
  G.roll={id:++G.rid,seat:0,vals:[a,b]};
  return true;
}
function kReach(){
  const k=G.K;
  if(G.ph!=='K'||!k.rolled||k.pts<=0)return {dist:new Map(),prev:new Map()};
  return dijk(k.x,k.y,kCost,k.pts,occSet(-1,true));
}
function kMove(x,y){
  const k=G.K;
  const d=kReach().dist.get(key(x,y));
  if(!d)return false;
  k.x=x;k.y=y;k.pts-=d;
  if(k.carry>=0){const s=G.S[k.carry];s.x=x;s.y=y;}
  kAuto();
  return true;
}
function kAttack(si){
  const k=G.K,s=G.S[si];
  if(G.ph!=='K'||!k.rolled||k.pts<1||k.carry>=0||!s||s.hid>=0||md(s,k)>1)return false;
  if(s.en>0){lg('ผู้ล่าฟาด '+nm(s)+' แต่ทนทาน ดาเมจไม่มีผล','s');k.pts=0;kAuto();return true;}
  if(s.hp==='ok'){s.hp='hurt';s.heal=0;lg('ผู้ล่าฟาด '+nm(s)+' บาดเจ็บ');}
  else if(s.hp==='hurt'){s.hp='down';lg('ผู้ล่าฟาด '+nm(s)+' ล้มลง');}
  else return false;
  k.hits++;k.pts=0;
  kAuto();
  return true;
}
function kPickup(si){
  const k=G.K,s=G.S[si];
  if(G.ph!=='K'||!k.rolled||k.pts<1||k.carry>=0||!s||s.hid>=0||s.hp!=='down'||md(s,k)>1)return false;
  s.hp='carry';s.x=k.x;s.y=k.y;s.str=0;k.carry=si;
  lg('ผู้ล่าอุ้ม '+nm(s)+' ขึ้นบ่า ดิ้นให้หลุด!');
  kAuto();
  return true;
}
function kHang(j){
  const k=G.K;
  if(G.ph!=='K'||!k.rolled||k.pts<1||k.carry<0||j<0||j>=HOOKS.length||G.hk[j]!==-1||md(k,HOOKS[j])!==1)return false;
  const s=G.S[k.carry];
  s.hooks++;k.carry=-1;k.pts-=1;k.hangs++;
  if(s.hooks>=3){s.hp='out';lg('ผู้ล่าแขวน '+nm(s)+' ครั้งที่ 3 ตกรอบ');}
  else{
    s.hp='hook';s.hph=s.hooks>=2?2:1;s.hl=s.hph===2?HOOK_P2:HOOK_P1;s.kn=0;s.en=0;s.x=HOOKS[j].x;s.y=HOOKS[j].y;G.hk[j]=s.i;
    lg('ผู้ล่าแขวน '+nm(s)+' บนตะขอที่ '+coord(HOOKS[j].x,HOOKS[j].y)+' (ครั้งที่ '+s.hooks+' เฟส '+s.hph+' เหลือ '+s.hl+' เทิร์น)');
  }
  if(maybeEnd())return true;
  kAuto();
  return true;
}
function kBreak(j){
  const k=G.K,c=KCH[k.key].brk;
  if(G.ph!=='K'||!k.rolled||k.pts<c||j<0||j>=PALS.length||G.pal[j]!=='d'||md(k,PALS[j])>1)return false;
  G.pal[j]='b';k.pts-=c;
  lg('ผู้ล่าทุบพาเล็ตที่ '+coord(PALS[j].x,PALS[j].y)+' จนพัง');
  kAuto();
  return true;
}
function kWarp(){
  const k=G.K;
  if(G.ph!=='K'||!k.rolled||k.pts<1||!G.noise||k.warp>0||k.carry>=0)return false;
  const spots=[];
  const occ=occSet(-1,true);
  for(let dy=-2;dy<=2;dy++)for(let dx=-2;dx<=2;dx++){
    const x=G.noise.x+dx,y=G.noise.y+dy;
    if(Math.abs(dx)+Math.abs(dy)>2||x<0||y<0||x>=W||y>=H||kCost(x,y)===Infinity||occ.has(key(x,y)))continue;
    spots.push({x,y,d:Math.abs(dx)+Math.abs(dy)});
  }
  if(!spots.length)return false;
  spots.sort((p,q)=>p.d-q.d);
  k.x=spots[0].x;k.y=spots[0].y;k.warp=KCH[k.key].wcd;k.pts=Math.min(k.pts,2);
  lg('ผู้ล่าวาร์ปไปที่เครื่องที่ส่งเสียงดัง');
  return true;
}
function kSkill(dry){
  const k=G.K,d=KCH[k.key];
  if(!d.sk||G.ph!=='K'||!k.rolled||k.carry>=0||(k.scd||0)>0||k.pts<d.sc)return false;
  if(d.sk==='sense'){
    const T=G.S.filter(s=>alive(s)&&s.hid<0&&s.hp!=='carry'&&d2(s,k)<=SENSE_R*SENSE_R);
    if(!T.length)return false;
    if(dry)return true;
    T.forEach(s=>{s.rev=1;});
    k.pts-=d.sc;k.scd=d.scd;
    lg('ผู้ล่าใช้เซนส์ จับตำแหน่งผู้รอดชีวิต '+T.length+' คน','k');
  }else if(d.sk==='trap'){
    if('.iy'.indexOf(tile(k.x,k.y))<0||trapAt(k.x,k.y))return false;
    if(dry)return true;
    G.traps=G.traps||[];G.traps.push({x:k.x,y:k.y});
    if(G.traps.length>MAX_TRAPS)G.traps.shift();
    k.pts-=d.sc;k.scd=d.scd;
    lg('ผู้ล่าวางกับดักหมีที่ '+coord(k.x,k.y)+' (มี '+G.traps.length+'/'+MAX_TRAPS+')','k');
  }else if(d.sk==='blink'){
    const occ=occSet(-1,true);let best=null;
    for(const s of G.S){
      if(!alive(s)||s.hid>=0||s.hp==='carry'||!killerSees(s)||md(s,k)<2||md(s,k)>BLINK_R)continue;
      for(const [dx,dy] of D4){
        const x=s.x+dx,y=s.y+dy;
        if(x<0||y<0||x>=W||y>=H||kCost(x,y)===Infinity||tile(x,y)==='W'||occ.has(key(x,y)))continue;
        const sc=md({x,y},k)+(s.hp==='down'?-2:s.hp==='hurt'?-1:0);
        if(!best||sc<best.sc)best={sc,x,y,s};
      }
    }
    if(!best)return false;
    if(dry)return true;
    k.x=best.x;k.y=best.y;k.pts-=d.sc;k.scd=d.scd;
    lg('ผู้ล่าใช้ Shrouded Step ไปประชิด '+nm(best.s));
  }else if(d.sk==='sweep'){
    const T=G.S.filter(s=>(s.hp==='ok'||s.hp==='hurt')&&s.hid<0&&Math.max(Math.abs(s.x-k.x),Math.abs(s.y-k.y))<=1&&killerSees(s));
    if(T.length<2)return false;
    if(dry)return true;
    let n=0;
    for(const s of T){
      if(s.en>0){lg('ผู้ล่าฟันกวาด '+nm(s)+' แต่ทนทาน ดาเมจไม่มีผล','s');continue;}
      if(s.hp==='ok'){s.hp='hurt';s.heal=0;}else s.hp='down';
      n++;k.hits++;
    }
    lg('ผู้ล่าฟันกวาด โดน '+n+' คน');
    k.pts=0;k.scd=d.scd;
  }else return false;
  kAuto();
  return true;
}
function skillInfoHTML(k,d){
  if(!d.sk)return '';
  const ex=d.sk==='trap'?' · กับดักบนแมพ '+(G.traps||[]).length+'/'+MAX_TRAPS:'';
  return `<div class="mini">สกิล <b style="color:var(--fg)">${d.skn}</b> · ${k.scd>0?'คูลดาวน์อีก '+k.scd+' รอบ':'พร้อมใช้'}${ex}</div>`;
}
function kEnd(){
  if(G.ph!=='K')return false;
  endKillerPhase();
  return true;
}

/* ---------- รางวัล ---------- */
function outcomeFor(seat){
  const e=G.over.esc;
  if(seat===0)return e<=1?'win':e===2?'draw':'lose';
  return e>=3?'win':e===2?'draw':'lose';
}
function rewards(seat){
  const o=outcomeFor(seat),items=[['เล่นจนจบเกม',30]];
  if(o==='win')items.push(['ชนะ',60]);
  else if(o==='draw')items.push(['เสมอ',30]);
  else items.push(['แพ้ (ปลอบใจ)',10]);
  if(seat===0){
    if(G.K.hangs)items.push(['แขวนตะขอ ×'+G.K.hangs,G.K.hangs*15]);
    if(G.K.hits)items.push(['ฟาดโดน ×'+G.K.hits,G.K.hits*5]);
    if(G.K.dmg)items.push(['ทำลายเครื่องปั่นไฟ ×'+G.K.dmg,G.K.dmg*4]);
  }else{
    const s=G.S[seat-1];
    if(s.rep)items.push(['ปั่นไฟ ×'+s.rep,s.rep*6]);
    if(s.res)items.push(['ช่วยเพื่อน ×'+s.res,s.res*25]);
    if(s.hp==='esc')items.push(['หนีออกมาได้',40]);
  }
  return {outcome:o,items,total:items.reduce((a,b)=>a+b[1],0)};
}

/* ---------- บอทผู้รอดชีวิต ---------- */
function aiFree(t){
  const r=[];
  for(const [dx,dy] of D4){const x=t.x+dx,y=t.y+dy;if(x>=0&&y>=0&&x<W&&y<H&&!isB(tile(x,y))&&tile(x,y)!=='E')r.push({x,y});}
  return r;
}
function aiGoal(i){
  const s=G.S[i],kv=seesK(s)?G.K:null;
  const others=G.S.filter(t=>t.i!==i&&playable(t));
  for(const t of G.S.filter(t=>t.hp==='hook'&&(!kv||md(t,kv)>5))){
    if(others.every(o=>md(o,t)>=md(s,t)-2))return {kind:'rescue',tiles:aiFree(t)};
  }
  for(const t of G.S.filter(t=>t.hp==='down'&&(!kv||md(t,kv)>6))){
    if(others.every(o=>md(o,t)>=md(s,t)-2))return {kind:'revive',tiles:aiFree(t).concat([{x:t.x,y:t.y}])};
  }
  if(G.gate){
    const ex=actEx();
    const open=ex.filter(e=>G.xo[exSide(e.x,e.y)]);
    if(open.length)return {kind:'exit',tiles:open};
    const cl=ex.slice().sort((a,b)=>md(s,a)-md(s,b))[0];
    let t=[];for(const e of ex)if(exSide(e.x,e.y)===exSide(cl.x,cl.y))t=t.concat(aiFree(e));
    return {kind:'exit',tiles:t};
  }
  let cand=GENS.map((g,j)=>({g,j})).filter(o=>G.gp[o.j]<GEN_NEED);
  if(!cand.length)return null;
  const safe=cand.filter(o=>!(kv&&md(o.g,kv)<=6));
  if(safe.length)cand=safe;
  const sc=o=>md(s,o.g)+(others.some(t=>md(t,o.g)<=1)?6:0)-G.gp[o.j]*0.4-(G.sh[o.j]?6:0);
  cand.sort((a,b)=>sc(a)-sc(b));
  const g=cand[0].g;
  return {kind:'gen',tiles:[g].concat(aiFree(g))};
}
function aiTryAct(i,g,kv){
  const s=G.S[i];
  if(s.pts<1)return false;
  if(g.kind==='exit'&&G.gate&&sOpenGate(i))return true;
  if(g.kind==='gen'&&nearList(s,(x,y)=>tile(x,y)==='G'&&G.gp[gI[key(x,y)]]<GEN_NEED).length)return sRepair(i);
  if(g.kind==='rescue'&&G.S.some(t=>t.hp==='hook'&&md(s,t)<=1))return sRescue(i);
  if(g.kind==='revive'&&s.pts>=3&&G.S.some(t=>t.hp==='down'&&md(s,t)<=1))return sRevive(i);
  if(!kv&&!s.item&&s.pts>=2&&nearList(s,(x,y)=>tile(x,y)==='C'&&!G.ch[cI[key(x,y)]]).length)return sChest(i);
  return false;
}
function aiMove(i,g){
  const s=G.S[i];
  if(s.pts<1)return false;
  const {dist,prev}=dijk(s.x,s.y,(x,y)=>sPlan(s,x,y),Infinity,occSet(i,false));
  let best=null;
  for(const t of g.tiles){const d=dist.get(key(t.x,t.y));if(d!=null&&(best===null||d<best.d))best={d,t};}
  if(!best||best.d===0)return false;
  let acted=false;
  for(const k of pathKeys(prev,key(best.t.x,best.t.y))){
    if(!can(G.S[i]))break;
    const [x,y]=k.split(',').map(Number);
    if(tile(x,y)==='W')continue;
    if(isDr(tile(x,y))&&drSt(x,y)==='c')break;
    if(sCost(s,x,y)>G.S[i].pts)break;
    if(!sMove(i,x,y))break;
    acted=true;
  }
  return acted;
}
function aiFlee(i){
  const s=G.S[i],r=sReach(i);
  if(r.dist.size<2)return false;
  const kd=dijk(G.K.x,G.K.y,kPlan,40,occSet(-1,true)).dist;
  let best=null;
  for(const [k,d] of r.dist){
    if(d===0)continue;
    const [x,y]=k.split(',').map(Number);
    let sc=(kd.has(k)?kd.get(k):40)*1.0;
    if(nearList({x,y},(a,b)=>tile(a,b)==='P'&&palSt(a,b)==='u').length)sc+=2;
    if(tile(x,y)==='W')sc+=1;
    if(nearList({x,y},(a,b)=>tile(a,b)==='L'&&G.lk[lI[key(a,b)]]===-1).length)sc+=2.5;
    sc+=Math.random()*0.5;
    if(!best||sc>best.sc)best={sc,x,y};
  }
  return best?sMove(i,best.x,best.y):false;
}
async function aiS(i,dl){
  let s=G.S[i];
  if(!can(s))return;
  if(s.hp==='carry'){sStruggle(i);await SLH(dl);return;}
  if(s.hid>=0){
    if(seesK(s)||G.rd-s.hidRd<2){sEnd(i);await SLH(dl);return;}
    sUnhide(i);await SLH(dl);
    if(!can(G.S[i]))return;
  }
  if(!s.rolled){sRoll(i);await SLH(dl);}
  for(let it=0;it<10&&can(G.S[i]);it++){
    s=G.S[i];
    const kv=seesK(s)?G.K:null,dK=kv?md(s,kv):99;
    if(s.item==='flash'&&kv&&dK<=3&&s.pts>=1){if(sFlash(i)){await SLH(dl);continue;}}
    if(dK>6&&s.pts>=1){
      if(s.item==='kit'&&sKit(i)){await SLH(dl);continue;}
      if(G.S.some(t=>t.i!==i&&t.hp==='hurt'&&md(s,t)<=1)&&sHeal(i,false)){await SLH(dl);continue;}
    }
    if(kv&&s.pts>=1){
      const p=nearList(s,(x,y)=>tile(x,y)==='P'&&palSt(x,y)==='u'&&!(G.K.x===x&&G.K.y===y)&&Math.abs(x-G.K.x)+Math.abs(y-G.K.y)<=1)[0];
      if(p&&sPallet(i)){await SLH(dl);continue;}
    }
    if(kv&&dK>=2&&dK<=6&&s.pts>=1&&rnd(10)<=6){if(sHide(i)){await SLH(dl);return;}}
    if(kv&&dK<=4){aiFlee(i);await SLH(dl);if(can(G.S[i]))sEnd(i);return;}
    const g=aiGoal(i);
    if(!g){sEnd(i);return;}
    if(aiTryAct(i,g,kv)){await SLH(dl);continue;}
    if(!aiMove(i,g)){sEnd(i);return;}
    await SLH(dl);
  }
  if(can(G.S[i]))sEnd(i);
}

/* ---------- บอทผู้ล่า ---------- */
async function aiKStep(tiles,dl){
  const k=G.K;
  const {dist,prev}=dijk(k.x,k.y,kPlan,Infinity,occSet(-1,true));
  let best=null;
  for(const t of tiles){const d=dist.get(key(t.x,t.y));if(d!=null&&(best===null||d<best.d))best={d,t};}
  if(!best||best.d===0)return false;
  const path=pathKeys(prev,key(best.t.x,best.t.y));
  const [nx,ny]=path[0].split(',').map(Number);
  if(tile(nx,ny)==='P'&&palSt(nx,ny)==='d'){
    if(k.pts>=KCH[k.key].brk&&kBreak(pI[key(nx,ny)])){await SLH(dl);return true;}
    return false;
  }
  if(isDr(tile(nx,ny))&&drSt(nx,ny)==='c'){
    if(k.pts>=brkNeed(tile(nx,ny))&&kBreakDoor(dI[key(nx,ny)])){await SLH(dl);return true;}
    return false;
  }
  if(kCost(nx,ny)>k.pts)return false;
  if(!kMove(nx,ny))return false;
  await SLH(dl);
  return true;
}
async function aiK(dl){
  if(G.ph!=='K')return;
  const k=G.K;
  if(!k.rolled){kRoll();await SLH(dl);}
  if(G.ph==='K'&&G.noise&&k.warp===0&&k.carry<0&&k.pts>=1){if(kWarp())await SLH(dl);}
  for(let it=0;it<60&&G.ph==='K';it++){
    if(k.pts<=0){kEnd();return;}
    if(k.carry>=0){
      const hj=HOOKS.findIndex((h,j)=>G.hk[j]===-1&&md(k,h)===1);
      if(hj>=0&&kHang(hj)){await SLH(dl);continue;}
      const tiles=[];
      HOOKS.forEach((h,j)=>{if(G.hk[j]===-1)for(const t of aiFree(h))tiles.push(t);});
      if(!(await aiKStep(tiles,dl)))break;
      continue;
    }
    {
      const sk=KCH[k.key].sk;
      if(sk&&!(k.scd>0)){
        const cheb=G.S.filter(s=>(s.hp==='ok'||s.hp==='hurt')&&s.hid<0&&Math.max(Math.abs(s.x-k.x),Math.abs(s.y-k.y))<=1).length;
        const anyVis=G.S.some(s=>(s.hp==='down'||s.hp==='ok'||s.hp==='hurt')&&killerSees(s));
        if(sk==='sweep'&&cheb>=2&&kSkill()){await SLH(dl);return;}
        if(sk==='sense'&&!anyVis&&k.pts>=2&&kSkill()){await SLH(dl);continue;}
        if(sk==='trap'&&anyVis&&k.pts>=2&&!trapAt(k.x,k.y)&&nearList(k,(x,y)=>'WPDL'.indexOf(tile(x,y))>=0).length&&rnd(10)<=6&&kSkill()){await SLH(dl);continue;}
        if(sk==='blink'&&anyVis&&k.pts>=3&&kSkill()){await SLH(dl);continue;}
      }
    }
    const adj=G.S.filter(s=>s.hid<0&&md(s,k)===1&&(s.hp==='down'||s.hp==='ok'||s.hp==='hurt'));
    {
      const oj=LOCKERS.findIndex((l,j)=>md(l,k)===1&&k.chk.indexOf(j)<0&&((k.mem&&md(k.mem,l)<=4)||(G.lk[j]>=0&&rnd(10)<=3)));
      if(oj>=0&&!adj.length){k.chk.push(oj);if(kOpen(oj)){await SLH(dl);return;}}
    }
    const dn=adj.find(s=>s.hp==='down');
    if(dn&&kPickup(dn.i)){await SLH(dl);continue;}
    const tg=adj.find(s=>s.hp==='hurt')||adj[0];
    if(tg&&kAttack(tg.i)){await SLH(dl);return;}
    if(!adj.length&&k.pts>=2&&!G.S.some(s=>(s.hp==='down'||s.hp==='ok'||s.hp==='hurt')&&killerSees(s))){
      const gj=GENS.findIndex((g,j)=>md(g,k)===1&&G.gp[j]>0&&G.gp[j]<GEN_NEED&&!G.sh[j]);
      if(gj>=0&&kDamage(gj)){await SLH(dl);continue;}
    }
    const vis=G.S.filter(s=>(s.hp==='down'||s.hp==='ok'||s.hp==='hurt')&&killerSees(s));
    let tiles=null;
    if(vis.length){
      const {dist}=dijk(k.x,k.y,kPlan,Infinity,occSet(-1,true));
      let best=null;
      for(const v of vis){
        for(const t of aiFree(v)){
          const d=dist.get(key(t.x,t.y));
          if(d==null)continue;
          const sc=d-(v.hp==='down'?3:v.hp==='hurt'?1:0);
          if(best===null||sc<best.sc)best={sc,t,v};
        }
      }
      if(best){tiles=[best.t];k.mem={x:best.v.x,y:best.v.y,rd:G.rd};k.chk=[];}
    }
    if(!tiles&&k.mem&&G.rd-k.mem.rd<=3){
      const cand=LOCKERS.map((l,j)=>j).filter(j=>k.chk.indexOf(j)<0&&md(LOCKERS[j],k.mem)<=4);
      if(cand.length){cand.sort((a,b)=>md(k,LOCKERS[a])-md(k,LOCKERS[b]));tiles=aiFree(LOCKERS[cand[0]]);}
    }
    if(!tiles&&k.mem&&G.rd-k.mem.rd<=2){
      if(md(k,k.mem)<=1)k.mem=null;
      else tiles=[k.mem];
    }
    if(!tiles){
      if(G.gate){
        tiles=[];
        for(const e of actEx())for(const t of aiFree(e))tiles.push(t);
      }else{
        let gi=k.pat;
        if(gi<0||md(k,GENS[gi])<=2){
          const pool=GENS.map((g,j)=>j).filter(j=>j!==k.pat&&md(k,GENS[j])>2);
          pool.sort((a,b)=>md(k,GENS[a])-md(k,GENS[b]));
          gi=pool.length?pool[Math.min(pool.length-1,rnd(3)-1)]:-1;
          k.pat=gi;
        }
        if(gi>=0)tiles=[GENS[gi]].concat(aiFree(GENS[gi]));
      }
    }
    if(!tiles||!tiles.length)break;
    if(!(await aiKStep(tiles,dl)))break;
  }
  if(G.ph==='K')kEnd();
}

    $('nav').innerHTML=`<button class="btn sm" id="nSnd" type="button">${SAVE.mute?'เสียง: ปิด':'เสียง: เปิด'}</button><button class="btn sm" id="nMus" type="button">${SAVE.nomusic?'ดนตรี: ปิด':'ดนตรี: เปิด'}</button><button class="btn sm" id="nHelp" type="button">วิธีเล่น</button><button class="btn sm dng" id="nLeave" type="button">ออกจากเกม</button>${w}`;
    $('nHelp').onclick=()=>showHelpModal();
    $('nLeave').onclick=()=>{
      const b=$('nLeave');
      if(b.dataset.armed){leaveAll();go('home');return;}
      b.dataset.armed='1';b.textContent='แตะอีกครั้งเพื่อออก';
      setTimeout(()=>{if(b&&b.isConnected){delete b.dataset.armed;b.textContent='ออกจากเกม';}},3000);
    };
  }else{
    $('nav').innerHTML=`${page!=='home'?'<button class="btn sm" id="nHome" type="button">เมนู</button>':''}<button class="btn sm" id="nShop" type="button">ร้านค้า</button><button class="btn sm" id="nHelp" type="button">วิธีเล่น</button><button class="btn sm" id="nSnd" type="button">${SAVE.mute?'เสียง: ปิด':'เสียง: เปิด'}</button><button class="btn sm" id="nMus" type="button">${SAVE.nomusic?'ดนตรี: ปิด':'ดนตรี: เปิด'}</button>${w}`;
    if($('nHome'))$('nHome').onclick=()=>go('home');
    $('nShop').onclick=()=>go('shop');
    $('nHelp').onclick=()=>go('help');
  }
  bindSnd();
}
function bindSnd(){const b=$('nSnd');if(b)b.onclick=()=>{SFX.toggle();b.textContent=SAVE.mute?'เสียง: ปิด':'เสียง: เปิด';};const m=$('nMus');if(m)m.onclick=()=>{SFX.toggleMusic();m.textContent=SAVE.nomusic?'ดนตรี: ปิด':'ดนตรี: เปิด';};}
document.addEventListener('click',e=>{if(e.target.closest&&e.target.closest('.btn,.card,.mcard')&&!e.target.closest('#panel'))SFX.play('click');},true);
function go(p){

}

const TH={};
function mapThumb(i){
  if(TH[i])return TH[i];
  const rows=MAPS[i].rows,c=mkc(W*3,H*3),g=c.getContext('2d');
  const col={'.':'#1d2b22','i':'#5a4833','#':'#8b7464','W':'#8fc7e6','f':'#a88858','t':'#2d7d4f','X':'#a97c3f','y':'#7d5d3b','P':'#c58a55','D':'#8a5a30','B':'#e0b070','G':'#f0b429','C':'#d9a03a','L':'#6f8288','H':'#ee4b55','E':'#c0392b'};
  for(let y=0;y<H;y++)for(let x=0;x<W;x++){g.fillStyle=col[rows[y][x]]||'#000';g.fillRect(x*3,y*3,3,3);}
  return TH[i]=c.toDataURL();
}
function mapPicker(cur){return MAPS.map((m,i)=>`<button class="card pick mp" data-mp="${i}" aria-pressed="${i===cur}" type="button"><img class="thumb" alt="" src="${mapThumb(i)}"><b>${m.n}</b><small>${m.d}</small></button>`).join('');}

/* ---------- ร้านค้า ---------- */
let shopTab='chars',shopChar='mech';
function pShop(el){
  const tabs=[['chars','ตัวละคร'],['acc','ของตกแต่ง'],['items','ไอเทม']];
  let body='';
  if(shopTab==='chars'){
    const item=(k,d,kind)=>{
      const o=owns(k);
      return `<div class="card"><div class="row">${kind==='k'?kIcon(k,'l',(SAVE.eq||{})[k]):sIcon(k,'l',(SAVE.eq||{})[k])}<b>${d.n}</b></div><small>${d.desc}</small>
      ${o?'<span class="own">มีแล้ว</span>':`<div class="row"><span class="price">${d.price} เหรียญ</span><button class="btn sm pri" data-buy="${k}" ${SAVE.coins<d.price?'disabled':''} type="button">ซื้อ</button></div>`}</div>`;
    };
    body=`<h2>ผู้รอดชีวิต</h2><div class="grid">${Object.keys(SCH).map(k=>item(k,SCH[k],'s')).join('')}</div><h2>ผู้ล่า</h2><div class="grid">${Object.keys(KCH).map(k=>item(k,KCH[k],'k')).join('')}</div>`;
  }else if(shopTab==='acc'){
    const mine=Object.keys(SCH).concat(Object.keys(KCH)).filter(owns);
    if(mine.indexOf(shopChar)<0)shopChar=mine[0];
    const isK=!!KCH[shopChar],eq=(SAVE.eq||{})[shopChar]||'';
    const pv=(a)=>isK?kIcon(shopChar,'l',a):sIcon(shopChar,'l',a);
    body=`<p class="muted">เลือกตัวละครที่มีแล้ว แล้วซื้อของตกแต่งของตัวนั้น กด "ใส่" เพื่อใช้ตอนเล่น</p>
    <div class="chips">${mine.map(k=>`<button class="chip" data-sc="${k}" aria-pressed="${k===shopChar}" type="button">${isK||KCH[k]?kIcon(k,'',(SAVE.eq||{})[k]):sIcon(k,'',(SAVE.eq||{})[k])}<span>${(SCH[k]||KCH[k]).n}</span></button>`).join('')}</div>
    <div class="grid">${['']. concat(CHACC[shopChar]).map(a=>{
      const key=a?'acc:'+shopChar+':'+a:'',o=!a||owns(key),on=eq===a;
      const d=a?ACC[a]:{n:'ไม่ใส่อะไร',price:0};
      return `<div class="card ${on?'on':''}"><div class="row">${pv(a)}<b>${d.n}</b></div>
      ${o?`<div class="row"><button class="btn sm ${on?'':'pri'}" data-eq="${a}" ${on?'disabled':''} type="button">${on?'ใส่อยู่':'ใส่'}</button></div>`:`<div class="row"><span class="price">${d.price} เหรียญ</span><button class="btn sm pri" data-buya="${a}" ${SAVE.coins<d.price?'disabled':''} type="button">ซื้อ</button></div>`}</div>`;
    }).join('')}</div>`;
  }else{
    body=`<div class="card" style="text-align:center;padding:36px 16px"><b>ร้านไอเทม</b><p class="muted">ยังไม่มีสินค้า เร็วๆ นี้</p></div>`;
  }
  el.innerHTML=`<div class="pg"><h1>ร้านค้า</h1><p class="muted">เหรียญได้จากการเล่นจนจบเกม ข้อมูลเก็บไว้ในเครื่องนี้</p>
  <div class="seg tabs">${tabs.map(t=>`<button class="card pick" data-tab="${t[0]}" aria-pressed="${t[0]===shopTab}" type="button"><b>${t[1]}</b></button>`).join('')}</div>${body}</div>`;
  el.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{shopTab=b.dataset.tab;pShop(el);});
  el.querySelectorAll('[data-sc]').forEach(b=>b.onclick=()=>{shopChar=b.dataset.sc;pShop(el);});
  el.querySelectorAll('[data-buy]').forEach(b=>b.onclick=()=>{
    const k=b.dataset.buy,d=SCH[k]||KCH[k];
    if(SAVE.coins<d.price||owns(k))return;
    SAVE.coins-=d.price;SAVE.owned.push(k);persist();renderNav();SFX.play('ok');pShop(el);
  });
  el.querySelectorAll('[data-buya]').forEach(b=>b.onclick=()=>{
    const a=b.dataset.buya,key='acc:'+shopChar+':'+a,d=ACC[a];
    if(SAVE.coins<d.price||owns(key))return;
    SAVE.coins-=d.price;SAVE.owned.push(key);if(!SAVE.eq)SAVE.eq={};SAVE.eq[shopChar]=a;persist();renderNav();SFX.play('ok');pShop(el);
  });
  el.querySelectorAll('[data-eq]').forEach(b=>b.onclick=()=>{if(!SAVE.eq)SAVE.eq={};SAVE.eq[shopChar]=b.dataset.eq;persist();SFX.play('ok');pShop(el);});
}

function chooser(side){
  const src=side==='s'?SCH:KCH,cur=side==='s'?sel.ch:sel.kch;
  return Object.keys(src).map(k=>{
    const d=src[k],o=owns(k);

function startSolo(){
  leaveAll();

  const pool=BASIC.filter(b=>b!==mine).sort(()=>Math.random()-.5);
  const schars=[];
  for(let i=1;i<=4;i++)schars.push(i===seat?mine:pool.pop());
  const ctl=['a','a','a','a','a'];ctl[seat]='h';
  const sacc=['','','',''];if(!isK)sacc[seat-1]=(SAVE.eq||{})[mine]||'';
  newGame({schars,kchar:isK?mine:pick(Object.keys(KCH)),kacc:isK?((SAVE.eq||{})[mine]||''):'',sacc,ctl,timer:false,map:sel.map});
  NET.mode='solo';NET.seat=seat;NET.owner={};
  setHook(()=>{renderGame();});
  manualZoom=false;
  go('game');drive();
}

/* ---------- วนเล่นของบอท ---------- */
async function drive(){
  if(driving)return;
  driving=true;const run=++RUN;
  try{
    while(G&&G.ph!=='END'&&run===RUN&&(NET.mode==='solo'||NET.mode==='host')){
      if(G.ph==='S'){
        const s=G.S.find(s=>s.ctl==='a'&&can(s));
        if(s)await aiS(s.i,DL_S);else await new Promise(r=>setTimeout(r,160));
      }else if(G.ph==='K'){
        if(G.K.ctl==='a')await aiK(DL_K);else await new Promise(r=>setTimeout(r,160));
      }else break;
    }
  }catch(e){}finally{driving=false;}
  if(G&&G.ph==='END')renderGame();
}

/* ---------- ส่งคำสั่งของผู้เล่น ---------- */
const KONLY={attack:1,pickup:1,hang:1,brk:1,warp:1,open:1,dmg:1,brkdoor:1,skill:1};
const SONLY={repair:1,pallet:1,chest:1,rescue:1,revive:1,heal:1,kit:1,flash:1,struggle:1,hide:1,unhide:1,opendoor:1,opengate:1};
const ACT={
  roll:s=>s===0?kRoll():sRoll(s-1),
  move:(s,x,y)=>s===0?kMove(x,y):sMove(s-1,x,y),
  repair:s=>sRepair(s-1),pallet:s=>sPallet(s-1),chest:s=>sChest(s-1),rescue:s=>sRescue(s-1),revive:s=>sRevive(s-1),
  heal:s=>sHeal(s-1,false),kit:s=>sKit(s-1),flash:s=>sFlash(s-1),struggle:s=>sStruggle(s-1),
  opengate:s=>sOpenGate(s-1),hide:s=>sHide(s-1),unhide:s=>sUnhide(s-1),opendoor:s=>sOpenDoor(s-1),
  open:(s,j)=>kOpen(j),dmg:(s,j)=>kDamage(j),brkdoor:(s,j)=>kBreakDoor(j),
  end:s=>s===0?kEnd():sEnd(s-1),
  attack:(s,i)=>kAttack(i),pickup:(s,i)=>kPickup(i),hang:(s,j)=>kHang(j),brk:(s,j)=>kBreak(j),warp:()=>kWarp(),skill:()=>kSkill()
};
function runAct(seat,a,args){
  const f=ACT[a];
  if(!f||!G||G.ph==='END')return false;
  if(KONLY[a]&&seat!==0)return false;
  if(SONLY[a]&&seat<1)return false;
  if(!args.every(n=>Number.isInteger(n)))return false;
  if(seat===0&&G.ph!=='K')return false;
  try{return !!f(seat,...args);}catch(e){return false;}
}
function act(a,...args){
  if(NET.mode==='client'){if(NET.room&&NET.seat>=0)NET.room.emit('act',{a,args,seat:NET.seat,aid:myPeer()+':'+(++NET.aid),ph:G?G.ph:''}).catch(netWarn);return;}
  if(NET.seat<0)return;
  if(runAct(NET.seat,a,args))commit();
}
function commit(){renderGame();if(NET.mode==='host')bcast();drive();}

/* ---------- มุมมองและหมอก ---------- */
function myView(){
  const seat=NET.seat;
  const full=!G||G.ph==='END'||seat<0||(seat>0&&!alive(G.S[seat-1]));
  const lit=new Uint8Array(W*H);
  const circle=(c,r)=>{
    for(let y=Math.max(0,c.y-r);y<=Math.min(H-1,c.y+r);y++)for(let x=Math.max(0,c.x-r);x<=Math.min(W-1,c.x+r);x++)
      if((x-c.x)*(x-c.x)+(y-c.y)*(y-c.y)<=r*r)lit[y*W+x]=1;
  };
  if(full)lit.fill(1);
  else if(seat===0)circle(G.K,KCH[G.K.key].vis);
  else circle(G.S[seat-1],R_S);
  return {seat,full,lit};
}
function visS(s,v){return v.full||(v.seat>=1&&(s.i===v.seat-1||!!v.lit[s.y*W+s.x]))||(v.seat===0&&killerSees(s));}
function visK(v){return v.full||v.seat===0||!!v.lit[G.K.y*W+G.K.x];}
let KNOW=null,ANYSHOCK=false,ANIM=false,FR=0;
function updateKnow(v){
  if(!KNOW||KNOW.gid!==G.gid)KNOW={gid:G.gid,gp:GENS.map(()=>0),sh:GENS.map(()=>0),pal:PALS.map(()=>'u'),ch:CHESTS.map(()=>0),hk:HOOKS.map(()=>-1),dr:DOORS.map(()=>'c'),ex:[0,0,0,0]};
  const L=o=>v.full||!!v.lit[o.y*W+o.x];
  ANYSHOCK=false;
  GENS.forEach((o,j)=>{if(L(o)){KNOW.gp[j]=G.gp[j];KNOW.sh[j]=G.sh[j]||0;}if(KNOW.sh[j])ANYSHOCK=true;});
  PALS.forEach((o,j)=>{if(L(o))KNOW.pal[j]=G.pal[j];});
  CHESTS.forEach((o,j)=>{if(L(o))KNOW.ch[j]=G.ch[j];});
  HOOKS.forEach((o,j)=>{if(L(o))KNOW.hk[j]=G.hk[j];});
  DOORS.forEach((o,j)=>{if(L(o))KNOW.dr[j]=G.dr[j];});
  EXITS.forEach(o=>{if(L(o)){const sd=exSide(o.x,o.y);if(G.xs.indexOf(sd)>=0)KNOW.ex[sd]=G.xo[sd]?2:1;}});
}

/* ---------- วาดกระดาน ---------- */
const CL={g1:'#1b2920',g2:'#1e2e24',f1:'#4b3c2d',f2:'#54432f',wall:'#6b5749',wallHi:'#8b7464',wallLo:'#3a2d27',fence:'#a88858',tree1:'#1b5638',tree2:'#2d7d4f',crate:'#a97c3f',wood:'#bf8a50',woodDk:'#6b4a2e',glass:'#8fc7e6',amber:'#f0b429',red:'#ee4b55',green:'#5fd6a0',steel:'#4d5a54'};
const hsh=(x,y)=>(((x*73856093)^(y*19349663))>>>0);
const wallish=(x,y)=>x>=0&&y>=0&&x<W&&y<H&&(MAP[y][x]==='#'||MAP[y][x]==='W');
const fenceAt=(x,y)=>x>=0&&y>=0&&x<W&&y<H&&(MAP[y][x]==='f'||MAP[y][x]==='E');
const margin=cs=>Math.round(cs*.95);

function drawBoard(){
  const cv=$('cv');if(!cv)return;FR=(FR+1)%1000;
  const cs=CS,M=margin(cs),wpx=M*2+cs*W,hpx=M*2+cs*H;
  const dpr=Math.min(2,window.devicePixelRatio||1);
  if(cv.width!==Math.round(wpx*dpr)||cv.height!==Math.round(hpx*dpr)){cv.width=Math.round(wpx*dpr);cv.height=Math.round(hpx*dpr);cv.style.width=wpx+'px';cv.style.height=hpx+'px';}
  const g=cv.getContext('2d');
  g.setTransform(dpr,0,0,dpr,0,0);
  g.imageSmoothingEnabled=false;
  g.fillStyle='#0b100d';g.fillRect(0,0,wpx,hpx);
  g.fillStyle='#8fa197';g.font='700 '+Math.max(8,Math.round(cs*.42))+'px "Chakra Petch",monospace';g.textAlign='center';g.textBaseline='middle';
  const step=cs>=18?1:cs>=11?2:5;
  for(let x=0;x<W;x+=step){const t=colName(x);g.fillText(t,M+x*cs+cs/2,M*.5);g.fillText(t,M+x*cs+cs/2,hpx-M*.5);}
  for(let y=0;y<H;y+=step){const t=String(H-y);g.fillText(t,M*.5,M+y*cs+cs/2);g.fillText(t,wpx-M*.5,M+y*cs+cs/2);}
  g.save();g.translate(M,M);
  const mt=MAPS[G.map];if(mt&&mt.th){CL.g1=mt.th[0];CL.g2=mt.th[1];CL.f1=mt.th[2];CL.f2=mt.th[3];}
  const v=myView();
  updateKnow(v);
  for(let y=0;y<H;y++)for(let x=0;x<W;x++)drawTile(g,x,y,cs);
  g.fillStyle='rgba(4,7,5,.5)';
  for(let y=0;y<H;y++)for(let x=0;x<W;x++)if(!v.lit[y*W+x])g.fillRect(x*cs,y*cs,cs,cs);
  if(!v.full){
    const me=v.seat===0?G.K:G.S[v.seat-1],r=v.seat===0?KCH[G.K.key].vis:R_S;
    g.strokeStyle='rgba(240,180,41,.6)';g.setLineDash([4,4]);g.lineWidth=1.5;
    g.beginPath();g.arc((me.x+.5)*cs,(me.y+.5)*cs,(r+.5)*cs,0,Math.PI*2);g.stroke();g.setLineDash([]);
  }
  if(G.noise&&(v.full||v.seat===0)){
    g.strokeStyle=CL.red;g.lineWidth=2;
    for(const rr of[.7,1.3]){g.beginPath();g.arc((G.noise.x+.5)*cs,(G.noise.y+.5)*cs,rr*cs,0,Math.PI*2);g.stroke();}
  }
  if(v.seat>=0&&G.ph!=='END'){
    let reach=null;
    if(v.seat===0&&G.ph==='K')reach=kReach().dist;
    else if(v.seat>=1)reach=sReach(v.seat-1).dist;
    if(reach){
      g.textAlign='center';g.textBaseline='middle';g.font='700 '+Math.max(7,Math.round(cs*.36))+'px "Chakra Petch",monospace';
      reach.forEach((d,k)=>{
        if(d<=0)return;
        const [x,y]=k.split(',').map(Number);
        g.fillStyle='rgba(240,180,41,.3)';g.fillRect(x*cs+1,y*cs+1,cs-2,cs-2);
        if(cs>=14){g.fillStyle='rgba(255,214,102,.98)';g.fillText(String(d),x*cs+cs/2,y*cs+cs/2);}
      });
    }
    if(v.seat===0&&G.ph==='K'&&G.K.rolled){
      g.lineWidth=2;
      const box=(p,c)=>{g.strokeStyle=c;g.strokeRect(p.x*cs+1,p.y*cs+1,cs-2,cs-2);};
      for(const s of G.S)if((s.hp==='ok'||s.hp==='hurt'||s.hp==='down')&&killerSees(s)&&md(s,G.K)===1)box(s,s.hp==='down'?CL.amber:CL.red);
      if(G.K.carry>=0)HOOKS.forEach((h,j)=>{if(G.hk[j]===-1&&md(h,G.K)===1)box(h,CL.amber);});
      PALS.forEach((p,j)=>{if(G.pal[j]==='d'&&md(p,G.K)<=1)box(p,CL.amber);});
      DOORS.forEach((p,j)=>{if(G.dr[j]==='c'&&md(p,G.K)<=1)box(p,CL.amber);});
      GENS.forEach((p,j)=>{if(md(p,G.K)===1&&G.gp[j]>0&&G.gp[j]<GEN_NEED&&!G.sh[j])box(p,CL.red);});
      LOCKERS.forEach(p=>{if(md(p,G.K)===1)box(p,'#9fb4ba');});
    }
  }
  if(G.traps)for(const t of G.traps){if(v.full||v.seat===0||v.lit[t.y*W+t.x])drawTrap(g,t.x,t.y,cs);}
  for(const s of G.S){

  }
  if(visK(v))drawKiller(g,cs,v.seat===0);
  ANIM=ANYSHOCK;
  if(v.seat===0&&G.ph==='K'&&G.al&&G.al.length){
    ANIM=true;
    const k=G.K,kx=(k.x+.5)*cs,ky=(k.y+.5)*cs;
    for(const a of G.al){
      const ax=(a.x+.5)*cs,ay=(a.y+.5)*cs,ph=(FR%8)/8;
      g.strokeStyle='rgba(255,214,102,'+(1-ph)+')';g.lineWidth=2;
      g.beginPath();g.arc(ax,ay,cs*(.4+ph*1.1),0,7);g.stroke();
      g.strokeStyle='#ffd666';g.lineWidth=2;g.beginPath();g.arc(ax,ay,cs*.28,0,7);g.stroke();
      const dx=a.x-k.x,dy=a.y-k.y,dist=Math.abs(dx)+Math.abs(dy);
      if(dist>=2){
        const ang=Math.atan2(dy,dx),r=cs*1.9,px=kx+Math.cos(ang)*r,py=ky+Math.sin(ang)*r,sz=Math.max(5,cs*.32);
        g.save();g.translate(px,py);g.rotate(ang);

        g.beginPath();g.moveTo(sz,0);g.lineTo(-sz*.7,-sz*.75);g.lineTo(-sz*.3,0);g.lineTo(-sz*.7,sz*.75);g.closePath();g.fill();g.stroke();
        g.restore();
        if(cs>=9){g.fillStyle='#ffd666';g.font='700 '+Math.max(8,Math.round(cs*.34))+'px "Chakra Petch",monospace';g.textAlign='center';g.textBaseline='middle';g.shadowColor='#000';g.shadowBlur=3;g.fillText(String(dist),px-Math.cos(ang)*sz*1.7,py-Math.sin(ang)*sz*1.7);g.shadowBlur=0;}
      }
    }
  }
  g.restore();
}

function drawTile(g,x,y,cs){
  let c=MAP[y][x];const px=x*cs,py=y*cs,h=hsh(x,y);
  let exst=0;if(c==='E'){exst=KNOW?KNOW.ex[exSide(x,y)]:0;if(!exst)c='f';}
  const even=(x+y)%2===0;
  const indoor=(c==='i'||c==='y'||c==='C'||c==='G'||c==='L');
  g.fillStyle=indoor?(even?CL.f1:CL.f2):(even?CL.g1:CL.g2);
  g.fillRect(px,py,cs,cs);
  if(indoor&&cs>=12){g.strokeStyle='rgba(0,0,0,.18)';g.lineWidth=1;g.beginPath();g.moveTo(px,py+cs*.5);g.lineTo(px+cs,py+cs*.5);g.stroke();}
  switch(c){
  case '#':{
    g.fillStyle=CL.wall;g.fillRect(px,py,cs,cs);
    g.fillStyle=CL.wallHi;g.fillRect(px,py,cs,Math.max(1,cs*.14));
    if(cs>=10&&!wallish(x,y+1)&&y+1<H&&MAP[y+1][x]!=='P'&&MAP[y+1][x]!=='D'){g.fillStyle=CL.wallLo;g.fillRect(px,py+cs*.8,cs,cs*.2);}
    if(cs>=12){g.strokeStyle='rgba(0,0,0,.25)';g.lineWidth=1;g.strokeRect(px+.5,py+.5,cs-1,cs-1);}
    break;}
  case 'W':{
    g.fillStyle=CL.wall;g.fillRect(px,py,cs,cs);
    const hor=wallish(x-1,y)&&wallish(x+1,y);
    const rx=hor?px+cs*.1:px+cs*.3,ry=hor?py+cs*.3:py+cs*.1,rw=hor?cs*.8:cs*.4,rh=hor?cs*.4:cs*.8;
    g.fillStyle=CL.woodDk;g.fillRect(rx-1,ry-1,rw+2,rh+2);
    g.fillStyle=CL.glass;g.fillRect(rx,ry,rw,rh);
    if(cs>=10){g.strokeStyle='rgba(255,255,255,.85)';g.lineWidth=1.2;g.beginPath();
    if(hor){g.moveTo(rx+rw/2,ry);g.lineTo(rx+rw/2,ry+rh);}else{g.moveTo(rx,ry+rh/2);g.lineTo(rx+rw,ry+rh/2);}
    g.stroke();}
    break;}
  case 'f':{
    g.strokeStyle=CL.fence;g.lineWidth=Math.max(1.5,cs*.1);g.lineCap='round';
    const cx=px+cs/2,cy=py+cs/2;
    g.beginPath();
    if(fenceAt(x-1,y)){g.moveTo(px,cy-cs*.14);g.lineTo(cx,cy-cs*.14);g.moveTo(px,cy+cs*.14);g.lineTo(cx,cy+cs*.14);}
    if(fenceAt(x+1,y)){g.moveTo(cx,cy-cs*.14);g.lineTo(px+cs,cy-cs*.14);g.moveTo(cx,cy+cs*.14);g.lineTo(px+cs,cy+cs*.14);}
    if(fenceAt(x,y-1)){g.moveTo(cx-cs*.14,py);g.lineTo(cx-cs*.14,cy);g.moveTo(cx+cs*.14,py);g.lineTo(cx+cs*.14,cy);}
    if(fenceAt(x,y+1)){g.moveTo(cx-cs*.14,cy);g.lineTo(cx-cs*.14,py+cs);g.moveTo(cx+cs*.14,cy);g.lineTo(cx+cs*.14,py+cs);}
    g.stroke();
    g.fillStyle=CL.wood;g.fillRect(cx-cs*.11,cy-cs*.11,cs*.22,cs*.22);
    g.lineCap='butt';
    break;}
  case 't':{
    const dc=(MAPS[G.map]&&MAPS[G.map].deco)||'tree',cx=px+cs/2,cy=py+cs/2;
    g.fillStyle='rgba(0,0,0,.3)';g.beginPath();g.ellipse(cx+cs*.05,py+cs*.82,cs*.4,cs*.14,0,0,7);g.fill();
    if(dc==='pine'){
      g.fillStyle='#143d2a';g.beginPath();g.moveTo(cx,py+cs*.04);g.lineTo(px+cs*.9,py+cs*.86);g.lineTo(px+cs*.1,py+cs*.86);g.closePath();g.fill();
      g.fillStyle='#e8f1f4';g.beginPath();g.moveTo(cx,py+cs*.04);g.lineTo(px+cs*.66,py+cs*.4);g.lineTo(px+cs*.34,py+cs*.4);g.closePath();g.fill();
    }else if(dc==='bush'){
      g.fillStyle='#2f6b3a';g.beginPath();g.arc(cx-cs*.15,cy+cs*.1,cs*.28,0,7);g.arc(cx+cs*.17,cy+cs*.1,cs*.26,0,7);g.arc(cx,cy-cs*.1,cs*.26,0,7);g.fill();
      g.fillStyle='#4a9a55';g.beginPath();g.arc(cx-cs*.05,cy-cs*.12,cs*.12,0,7);g.fill();
    }else if(dc==='grave'){
      g.fillStyle='#8d949c';g.beginPath();g.moveTo(px+cs*.28,py+cs*.86);g.lineTo(px+cs*.28,py+cs*.34);g.arc(cx,py+cs*.34,cs*.22,Math.PI,0);g.lineTo(px+cs*.72,py+cs*.86);g.closePath();g.fill();
      g.strokeStyle='#4d535a';g.lineWidth=1.2;g.beginPath();g.moveTo(cx,py+cs*.34);g.lineTo(cx,py+cs*.62);g.moveTo(cx-cs*.1,py+cs*.46);g.lineTo(cx+cs*.1,py+cs*.46);g.stroke();
    }else if(dc==='barrel'){
      g.fillStyle='#7b5a3a';g.fillRect(px+cs*.2,py+cs*.14,cs*.6,cs*.7);g.fillStyle='#4b5560';g.fillRect(px+cs*.2,py+cs*.28,cs*.6,cs*.07);g.fillRect(px+cs*.2,py+cs*.62,cs*.6,cs*.07);
      g.fillStyle='#9a7448';g.fillRect(px+cs*.24,py+cs*.14,cs*.12,cs*.7);
    }else if(dc==='rock'){
      g.fillStyle='#6b6a66';g.beginPath();g.moveTo(px+cs*.1,py+cs*.84);g.lineTo(px+cs*.22,py+cs*.34);g.lineTo(px+cs*.52,py+cs*.16);g.lineTo(px+cs*.86,py+cs*.4);g.lineTo(px+cs*.92,py+cs*.84);g.closePath();g.fill();
      g.fillStyle='#8c8b86';g.beginPath();g.moveTo(px+cs*.22,py+cs*.34);g.lineTo(px+cs*.52,py+cs*.16);g.lineTo(px+cs*.58,py+cs*.5);g.lineTo(px+cs*.3,py+cs*.6);g.closePath();g.fill();

function fitCS(){

  const ch=Math.max(320,window.innerHeight*(window.innerWidth<1000?.5:.82));

}
function setBoxHeight(){const bb=$('boardbox');if(bb)bb.style.maxHeight=Math.max(320,window.innerHeight*(window.innerWidth<1000?.52:.84))+'px';}
function setZoom(n,keepCenter,cx,cy){
  n=Math.max(6,Math.min(56,Math.round(n)));
  if(n===CS)return;
  const bb=$('boardbox');
  let ux=0,uy=0,ox=0,oy=0,ok=bb&&keepCenter!==false;
  if(ok){
    const r=bb.getBoundingClientRect();
    ox=cx===undefined?bb.clientWidth/2:cx-r.left;oy=cy===undefined?bb.clientHeight/2:cy-r.top;
    const M=margin(CS);
    ux=(bb.scrollLeft+ox-M)/CS;uy=(bb.scrollTop+oy-M)/CS;
  }
  CS=n;manualZoom=true;
  drawBoard();
  if(ok){const M=margin(CS);bb.scrollLeft=M+ux*CS-ox;bb.scrollTop=M+uy*CS-oy;}
}
function buildGame(el){

  <aside class="gside"><div class="panel" id="panel"></div><div class="panel"><h3>บันทึกเหตุการณ์</h3><ol id="log"></ol></div></aside></div>`;
  setBoxHeight();
  CS=manualZoom?CS:fitCS();
  needCenter=manualZoom;
  const cv=$('cv'),pts=new Map();let p0=0,c0=0;
  cv.onclick=e=>{
    if(moved)return;
    const r=cv.getBoundingClientRect(),M=margin(CS);
    const x=Math.floor((e.clientX-r.left-M)/CS),y=Math.floor((e.clientY-r.top-M)/CS);

  const bb=$('boardbox');cv.style.touchAction='none';

    if(pts.size===2){const [a,b2]=[...pts.values()];p0=Math.hypot(a.x-b2.x,a.y-b2.y);c0=CS;drag=null;moved=true;}
  });
  cv.addEventListener('pointermove',e=>{
    if(!pts.has(e.pointerId))return;

    }
  });
  const up=e=>{pts.delete(e.pointerId);if(pts.size<2)p0=0;if(pts.size===0)drag=null;setTimeout(()=>{if(pts.size===0)moved=false;},0);};
  cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',up);
  window.onkeydown=e=>{if(page!=='game'||/INPUT|SELECT|TEXTAREA/.test((e.target||{}).tagName||''))return;if(e.key==='+'||e.key==='=')setZoom(CS*1.2);else if(e.key==='-')setZoom(CS/1.2);else if(e.key==='0'){manualZoom=false;CS=0;setZoom(fitCS(),false);}};

  };

}

function makeFirebaseRoomApi(db,auth){
  let srvOff=0;
  try{db.ref('.info/serverTimeOffset').on('value',s=>{srvOff=Number(s.val())||0;});}catch(e){}
  const nowS=()=>Date.now()+srvOff;                       // เวลาตามเซิร์ฟเวอร์ ไม่ขึ้นกับนาฬิกาเครื่อง
  const LEGACY=['nm','seat','ch','host'];
  const slim=p=>{const o={};for(const k of LEGACY)if(p[k]!==undefined)o[k]=p[k];return o;};
  const mkErr=(code,msg)=>Object.assign(new Error(msg||code),{code});
  return {
    async join(roomName,isHost=false){
      const roomRef=db.ref('rooms/'+roomName);
      const hostRef=roomRef.child('hostUid');
      const uid=auth.currentUser.uid;
      if(isHost){
        const tx=await hostRef.transaction(v=>v===null?uid:v);
        if(!tx.committed||tx.snapshot.val()!==uid)throw mkErr('room-exists','Room code already exists');
        await Promise.all([roomRef.child('state').remove(),roomRef.child('acts').remove()]).catch(()=>{});
      }
      const playersRef=roomRef.child('players');
      const peerId=uid+'_'+playersRef.push().key;
      const myRef=playersRef.child(peerId);
      const joinedAt=nowS();
      let presenceData={nm:'ผู้เล่น',seat:null,ch:null,host:!!isHost};
      let slimOnly=false,closed=false,wasConn=false;
      const cache=new Map(),peerListeners=new Set(),errListeners=new Set(),ev={state:new Set(),act:new Set()};
      const peers=()=>Array.from(cache.values());
      const peerObj=(id,v)=>({peer:id,kind:'viewer',presence:(v&&v.presence)||{},joinedAt:(v&&v.joinedAt)||0,sameTab:id===peerId});
      const curPresence=()=>slimOnly?slim(presenceData):presenceData;
      const fireErr=e=>{for(const fn of errListeners){try{fn(e);}catch(_){}}};
      const register=async()=>{
        await myRef.set({uid,presence:curPresence(),joinedAt});
        await myRef.onDisconnect().remove();                   // หลุด/ปิดแท็บ = ลบที่นั่งอัตโนมัติ
        if(isHost)roomRef.onDisconnect().remove().catch(()=>{}); // เจ้าห้องหลุด = ปิดห้อง ไม่ให้ข้อมูลค้าง
      };
      let firstSnap;const ready=new Promise(res=>{firstSnap=res;});
      const playersHandler=snap=>{
        if(closed)return;
        const next=new Map();
        snap.forEach(ch=>{next.set(ch.key,peerObj(ch.key,ch.val()));});
        const joined=[],left=[],changed=[];
        for(const [id,p] of next){
          if(!cache.has(id))joined.push(p);
          else if(JSON.stringify(cache.get(id).presence)!==JSON.stringify(p.presence))changed.push(p);
        }
        for(const [id,p] of cache)if(!next.has(id))left.push(p);
        cache.clear();for(const [id,p] of next)cache.set(id,p);
        firstSnap();
        // แจ้งทั้งตอนมีคนเข้า/ออก และตอนมีคนนั่ง/ลุก/เปลี่ยนตัวละคร
        if(joined.length||left.length||changed.length)for(const fn of peerListeners)fn({joined,left,changed});
      };
      const parse=d=>{if(typeof d==='string'){try{return JSON.parse(d);}catch(e){return null;}}return d;};
      const stateRef=roomRef.child('state'),actsRef=roomRef.child('acts');
      const stateHandler=snap=>{
        const v=snap.val();if(!v||v.data==null)return;
        const d=parse(v.data);if(d==null)return;
        const msg={peer:v.peer||'',data:d,sameTab:v.peer===peerId};
        for(const fn of ev.state)fn(msg);
      };
      const actsHandler=snap=>{
        if(seenActs.has(snap.key))return;                      // ข้ามคำสั่งเก่าที่ค้างอยู่ก่อนเข้าห้อง (ไม่ใช้เวลาเครื่อง)
        const v=snap.val();
        snap.ref.remove().catch(()=>{});                       // เก็บกวาด ไม่ให้ acts โตไม่หยุด
        if(!v||v.data==null||!v.peer)return;
        const d=parse(v.data);if(d==null)return;
        const msg={peer:v.peer,data:d,sameTab:v.peer===peerId};
        for(const fn of ev.act)fn(msg);
      };
      const seenActs=new Set();
      const connRef=db.ref('.info/connected');
      const connHandler=async s=>{
        if(closed||!s.val())return;
        if(wasConn){try{if(isHost)await hostRef.set(uid);await register();}catch(e){fireErr(e);}} // ต่อเน็ตใหม่: ลงทะเบียนตัวเองกลับ
        wasConn=true;
      };
      const cleanupFail=async()=>{
        closed=true;
        try{playersRef.off('value',playersHandler);stateRef.off('value',stateHandler);actsRef.off('child_added',actsHandler);connRef.off('value',connHandler);}catch(_){}
        try{await myRef.onDisconnect().cancel();}catch(_){}
        try{if(isHost){await roomRef.onDisconnect().cancel();await roomRef.remove();}else await myRef.remove();}catch(_){}
      };
      try{
        await register();
        playersRef.on('value',playersHandler,fireErr);
        if(isHost){
          try{const s=await actsRef.once('value');const o=s.val();if(o)for(const k of Object.keys(o))seenActs.add(k);}catch(e){}
          actsRef.on('child_added',actsHandler,fireErr);
        }else stateRef.on('value',stateHandler,fireErr);
        connRef.on('value',connHandler);
        await Promise.race([ready,new Promise((_,rej)=>setTimeout(()=>rej(mkErr('timeout')),10000))]);
      }catch(e){await cleanupFail();throw e;}
      const api={
        peers,peerId,degraded:false,
        async presence(data){
          if(closed)throw mkErr('room-closed');
          const prev=presenceData;
          const nx={...presenceData,...data};
          if(data&&Number.isInteger(data.seat)&&data.seat!==presenceData.seat)nx.sat=nowS(); // เวลาที่จองที่นั่ง ใช้ตัดสินเมื่อมีคนจองชนกัน
          if(data&&data.seat===null)nx.sat=null;
          presenceData=nx;
          try{await myRef.update({uid,presence:curPresence(),joinedAt});}
          catch(e){
            if(!slimOnly&&e&&e.code==='PERMISSION_DENIED'){
              // กฎฐานข้อมูลเดิมอาจไม่รู้จักฟิลด์ใหม่ (ac, sat) ลองเขียนเฉพาะฟิลด์เดิม
              slimOnly=true;api.degraded=true;
              try{await myRef.update({uid,presence:slim(presenceData),joinedAt});}
              catch(e2){presenceData=prev;slimOnly=false;api.degraded=false;throw e2;}
            }else{presenceData=prev;throw e;}
          }
        },
        onPeers(fn){peerListeners.add(fn);return()=>peerListeners.delete(fn);},
        onError(fn){errListeners.add(fn);return()=>errListeners.delete(fn);},
        on(event,fn){if(!ev[event])throw mkErr('unknown-event','Unknown room event');ev[event].add(fn);return()=>ev[event].delete(fn);},
        async emit(event,data){
          if(closed)throw mkErr('room-closed');
          const json=JSON.stringify(data);   // เก็บเป็นสตริง กัน RTDB ทำ array ว่าง/null หาย
          if(event==='state')return stateRef.set({peer:peerId,data:json,at:nowS()});
          if(event==='act')return actsRef.push({peer:peerId,peerUid:uid,data:json,at:nowS()});
          throw mkErr('unknown-event','Unknown room event');
        },
        async leave(){
          if(closed)return;closed=true;
          try{playersRef.off('value',playersHandler);stateRef.off('value',stateHandler);actsRef.off('child_added',actsHandler);connRef.off('value',connHandler);}catch(_){}
          try{await myRef.onDisconnect().cancel();}catch(_){}
          try{
            if(isHost){await roomRef.onDisconnect().cancel().catch(()=>{});await roomRef.remove();}
            else await myRef.remove();
          }catch(e){try{await myRef.remove();}catch(_){}}
          peerListeners.clear();errListeners.clear();ev.state.clear();ev.act.clear();cache.clear();
        }
      };
      return api;
    }
  };
}

async function enterRoom(code,host){
  leaveAll();
  const api=await roomApi();
  if(!api){const e=$('em');if(e)e.textContent='เชื่อมต่อออนไลน์ไม่ได้: '+(ROOM_API_ERROR||'ตรวจค่า Firebase และการตั้งค่า Authentication/Database');return false;}
  try{
    const r=await api.join('bf-'+code.toLowerCase(),host);
    NET.room=r;NET.code=code;NET.mode=host?'host':'client';NET.seat=-1;NET.owner={};
    NET.subs.push(r.onPeers(onPeers));
    NET.subs.push(r.on('state',onState));
    NET.subs.push(r.on('act',onActMsg));
    NET.subs.push(r.onError(netWarn));
    if(!host&&!hostPeer()){leaveAll();NET.lobbyMsg='ไม่พบห้อง '+code;if(page==='online')pOnline($('pg'));else go('online');return false;}
    await r.presence({nm:SAVE.name,seat:null,ch:null,host:!!host});

    return true;
  }catch(e){
    leaveAll();
    if(host&&e&&e.code==='room-exists')return 'retry';
    NET.lobbyMsg='เข้าห้องไม่ได้ — '+fbText(e);
    if(page==='online')pOnline($('pg'));else go('online');
    return false;
  }
}

  const ps=NET.room.peers().filter(p=>p.kind==='viewer'&&p.presence&&Number.isInteger(p.presence.seat)).sort((a,b)=>{const x=a.presence.sat||1e18,y=b.presence.sat||1e18;return x!==y?x-y:(a.peer<b.peer?-1:1);});
  for(const p of ps){const k=p.presence.seat;if(k>=0&&k<5&&!o[k])o[k]=p;}
  return o;
}
