let optTimer=true,optMap=0;
function renderLobby(){
  if(page!=='lobby'||!NET.room)return;
  const own=owners(),me=myPeer();
  const mine=Object.keys(own).find(k=>own[k].peer===me);
  const mePeer=NET.room.peers().find(p=>p.sameTab);
  if(mePeer&&mePeer.presence&&Number.isInteger(mePeer.presence.seat)&&String(mePeer.presence.seat)!==mine){NET.room.presence({seat:null,ch:null,ac:''}).catch(()=>{});const e0=$('em');if(e0)e0.textContent='ที่นั่งนั้นมีผู้เล่นอื่นจองก่อนแล้ว กรุณาเลือกที่นั่งอื่น';}
  const seatsEl=$('seats');if(!seatsEl)return;
  seatsEl.innerHTML=[0,1,2,3,4].map(k=>{
    const o=own[k],isMe=o&&o.peer===me;
    const label=k===0?'ผู้ล่า':'ผู้รอดชีวิต '+k;
    const chars=k===0?KCH:SCH;
    const taken=new Set(k>0?Object.keys(own).filter(j=>+j>0&&+j!==k).map(j=>own[j].presence.ch):[]);
    const opts=Object.keys(chars).filter(c=>owns(c)).map(c=>`<option value="${c}" ${(isMe&&o.presence.ch===c)?'selected':''} ${taken.has(c)?'disabled':''}>${chars[c].n}${taken.has(c)?' (มีคนเลือกแล้ว)':''}</option>`).join('');
    const ic=isMe&&o.presence.ch&&chars[o.presence.ch]?(k===0?kIcon(o.presence.ch,'',o.presence.ac):sIcon(o.presence.ch,'',o.presence.ac)):(k===0?kIcon('std'):sIcon(BASIC[k-1]));
    return `<div class="seat ${isMe?'mine':''}">${ic}
    <div><b>${label}</b><small>${o?esc(String(o.presence.nm||'ผู้เล่น')).slice(0,14)+(isMe?' (คุณ)':''):'ว่าง · บอทเล่นแทน'}</small></div>
    <div class="row">${isMe?`<select data-ch="${k}" aria-label="ตัวละคร">${opts}</select><button class="btn sm" data-free="1" type="button">ลุก</button>`:(o?'':`<button class="btn sm pri" data-sit="${k}" type="button" ${mine!==undefined?'disabled':''}>นั่งที่นี่</button>`)}</div></div>`;
  }).join('');
  seatsEl.querySelectorAll('[data-sit]').forEach(b=>b.onclick=async()=>{
    const k=+b.dataset.sit,chars=k===0?KCH:SCH,e=$('em');
    const used=new Set(Object.keys(own).filter(j=>+j>0).map(j=>own[j].presence.ch));
    const ch=Object.keys(chars).find(c=>owns(c)&&(k===0||!used.has(c)))||Object.keys(chars).find(c=>owns(c));
    b.disabled=true;if(e)e.textContent='กำลังจองที่นั่ง...';
    try{await NET.room.presence({seat:k,ch,ac:(SAVE.eq||{})[ch]||'',nm:SAVE.name});const e2=$('em');if(e2&&e2.textContent==='กำลังจองที่นั่ง...')e2.textContent='';}
    catch(err){const e2=$('em');if(e2)e2.textContent='นั่งที่นั่งไม่ได้: '+fbText(err);b.disabled=false;}
  });
  seatsEl.querySelectorAll('[data-free]').forEach(b=>b.onclick=async()=>{
    try{await NET.room.presence({seat:null,ch:null,ac:''});const e=$('em');if(e)e.textContent='';}
    catch(err){const e=$('em');if(e)e.textContent='ลุกจากที่นั่งไม่ได้: '+fbText(err);}
  });
  seatsEl.querySelectorAll('[data-ch]').forEach(s=>s.onchange=async()=>{
    try{await NET.room.presence({ch:s.value,ac:(SAVE.eq||{})[s.value]||''});const e=$('em');if(e)e.textContent='';}
    catch(err){const e=$('em');if(e)e.textContent='บันทึกตัวละครไม่สำเร็จ: '+fbText(err);renderLobby();}
  });
  const pl=$('plist');
  if(pl){
    const ps=NET.room.peers().slice().sort((a,b)=>(a.joinedAt||0)-(b.joinedAt||0)||(a.peer<b.peer?-1:1));
    pl.innerHTML='<b>ผู้เล่นในห้อง ('+ps.length+')</b><br>'+ps.map(p=>{
      const pr=p.presence||{},sk=Object.keys(own).find(k=>own[k].peer===p.peer);
      return esc(String(pr.nm||'ผู้เล่น').slice(0,14))+(pr.host?' (เจ้าห้อง)':'')+(p.sameTab?' (คุณ)':'')+' · '+(sk===undefined?'ยังไม่ได้นั่ง':(+sk===0?'ผู้ล่า':'ผู้รอดชีวิต '+sk));
    }).join('<br>');
  }
  $('lopt').innerHTML=NET.mode==='host'?`<label class="chk"><input type="checkbox" id="tm" ${optTimer?'checked':''}> จับเวลา ${SECS} วินาทีต่อเทิร์น</label><h3 style="margin-top:10px">เลือกด่าน</h3><div class="grid" id="mps">${mapPicker(optMap)}</div>`:'<p class="note">รอโฮสต์เริ่มเกม โฮสต์เป็นคนเลือกด่าน</p>';
  const tm=$('tm');if(tm)tm.onchange=()=>{optTimer=tm.checked;};
  const mps=$('mps');if(mps)mps.onclick=e=>{const b=e.target.closest('[data-mp]');if(!b)return;optMap=+b.dataset.mp;renderLobby();};
}
function onPeers(ch){
  if(NET.mode==='client'&&page==='lobby'&&ch.left.some(p=>p.presence&&p.presence.host)&&!hostPeer()){leaveAll();NET.lobbyMsg='โฮสต์ปิดห้องแล้ว';go('online');return;}
  if(page==='lobby')renderLobby();
  if(NET.mode==='host'&&G&&page==='game'){
    for(const p of ch.left){
      for(const k of Object.keys(NET.owner)){
        if(NET.owner[k]===p.peer){
          delete NET.owner[k];NET.lost[k]=uidOf(p.peer);
          if(+k===0)G.K.ctl='a';else G.S[+k-1].ctl='a';
          lg((+k===0?'ผู้ล่า':SCH[G.S[+k-1].key].n)+' หลุดจากห้อง บอทเล่นแทน','h');
        }
      }
    }
    // ผู้เล่นเดิมกลับเข้าห้อง (uid เดียวกัน) -> คืนที่นั่งและตัวละครเดิม ยกเลิกบอท ผู้เล่นใหม่ไม่ได้ที่นั่งของใคร
    for(const p of ch.joined){
      for(const k of Object.keys(NET.lost)){
        if(NET.lost[k]===uidOf(p.peer)&&NET.owner[k]===undefined){
          NET.owner[k]=p.peer;delete NET.lost[k];
          if(+k===0)G.K.ctl='h';else G.S[+k-1].ctl='h';
          lg((+k===0?'ผู้ล่า':SCH[G.S[+k-1].key].n)+' กลับเข้าห้อง ผู้เล่นกลับมาควบคุมเอง','h');
        }
      }
    }
    if(ch.left.length||ch.joined.length){commit();}
  }
  if(NET.mode==='client'&&page==='game'&&!hostPeer()){leaveAll();NET.lobbyMsg='โฮสต์ออกจากห้องแล้ว';go('online');}
}
function hostStart(){
  if(!NET.room)return;
  const own=owners(),me=myPeer();
  const mineSeat=Object.keys(own).find(k=>own[k].peer===me);
  if(mineSeat===undefined){const e=$('em');if(e)e.textContent='เลือกที่นั่งของคุณก่อนเริ่มเกม';return;}
  const owner={},used=new Set(),schars=[null,null,null,null];
  for(let k=0;k<5;k++)if(own[k])owner[k]=own[k].peer;
  for(let k=1;k<=4;k++){const c=own[k]&&own[k].presence.ch;if(c&&SCH[c]&&!used.has(c)){used.add(c);schars[k-1]=c;}}
  for(let i=0;i<4;i++)if(!schars[i]){const pool=BASIC.filter(b=>!used.has(b));const c=pool.length?pick(pool):pick(Object.keys(SCH).filter(c=>!used.has(c)));used.add(c);schars[i]=c;}
  const kc=own[0]&&own[0].presence.ch;
  const ctl=[0,1,2,3,4].map(k=>own[k]?'h':'a');
  const sacc=[0,1,2,3].map(i=>{const o=own[i+1];return o&&o.presence&&o.presence.ch===schars[i]&&typeof o.presence.ac==='string'&&ACC[o.presence.ac]?o.presence.ac:'';});
  const kac=own[0]&&own[0].presence&&own[0].presence.ch===kc&&ACC[own[0].presence.ac]?own[0].presence.ac:'';
  newGame({schars,kchar:KCH[kc]?kc:pick(Object.keys(KCH)),kacc:kac,sacc,ctl,timer:optTimer,map:optMap});
  NET.mode='host';NET.owner=owner;NET.lost={};NET.seat=+mineSeat;
  setHook(()=>{renderGame();bcast();});
  manualZoom=false;
  if(page!=='game')go('game');else{$('modal').hidden=true;$('modal').dataset.gid='';renderGame();}
  bcast();drive();
}
function bcast(){
  if(!NET.room||NET.mode!=='host'||!G)return;
  const rem=G.timer?Math.max(0,Math.round((G.dl-Date.now())/1000)):0;
  let lgs=getLog().slice(-8),msg;const rv=++NET.rv;
  for(;;){
    msg={g:G,o:NET.owner,l:lgs,rem,rv};
    if(new TextEncoder().encode(JSON.stringify(msg)).length<3900||!lgs.length)break;
    lgs=lgs.slice(1);
  }
  NET.room.emit('state',msg).catch(netWarn);
}
function onState(m){
  if(NET.mode!=='client'||m.sameTab||m.peer!==hostPeer())return;
  const d=m.data;
  if(!d||!d.g||!d.g.S||!d.g.K)return;
  const newGid=!G||G.gid!==d.g.gid;
  if(!newGid&&Number.isInteger(d.rv)&&d.rv<=NET.lastRv)return;   // สถานะเก่ากว่าที่เห็นแล้ว ข้ามไป
  if(Number.isInteger(d.rv))NET.lastRv=d.rv;
  const hadSeat=NET.seat>=0;
  setG(d.g);setLog(Array.isArray(d.l)?d.l:[]);
  NET.owner=d.o||{};NET.rem=d.rem||0;NET.remAt=Date.now();
  const me=myPeer();
  const k=Object.keys(NET.owner).find(k=>NET.owner[k]===me);
  NET.seat=k===undefined?-1:+k;
  if(hadSeat&&NET.seat<0)netNote('คุณไม่ได้ควบคุมตัวละครแล้ว (ถูกบอทเล่นแทนหลังหลุดจากห้อง) หากต่อเน็ตกลับมาจะได้ตัวละครคืนอัตโนมัติ');
  if(page!=='game'){manualZoom=false;go('game');}
  else{if(newGid){manualZoom=false;CS=0;setZoom(fitCS(),false);}renderGame();}
}
function onActMsg(m){
  if(NET.mode!=='host'||m.sameTab||!G)return;
  const d=m.data||{},seat=d.seat;
  if(!Number.isInteger(seat)||seat<0||seat>4||NET.owner[seat]!==m.peer)return;
  if(typeof d.aid!=='string'||NET.seenAid.has(d.aid))return;     // คำสั่งซ้ำ/ไม่มีรหัส ไม่ประมวลผล
  NET.seenAid.add(d.aid);if(NET.seenAid.size>400)NET.seenAid.delete(NET.seenAid.values().next().value);
  if(d.ph&&d.ph!==G.ph)return;                                   // ส่งมาจากเฟสที่จบไปแล้ว
  const args=Array.isArray(d.args)?d.args.slice(0,3):[];
  if(runAct(seat,String(d.a),args))commit();
}

  const jobs=[];
