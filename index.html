<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>ปั่นไฟหนีล่า</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Mitr:wght@400;600&family=Sarabun:wght@400;600&family=Chakra+Petch:wght@600;700&display=swap">
<style>
/* Layout: top bar (brand + wallet), then one page at a time. Game page = fogged board on the left, seat panel + log on the right. Dark industrial, amber = power, red = killer. */
:root{
  color-scheme:dark;
  --bg:#0b100d; --surface:#131a16; --raised:#1b2520; --line:#2a3731;
  --fg:#e5eee8; --muted:#8fa197;
  --amber:#f0b429; --amber-ink:#1a1405; --danger:#ee4b55; --good:#5fd6a0;
  --s0:#58b2ff; --s1:#5fd6a0; --s2:#ff9ecb; --s3:#b79cff;
  --scrim:rgba(6,9,7,.86);
  --f-display:'Mitr','Noto Sans Thai',system-ui,sans-serif;
  --f-body:'Sarabun','Noto Sans Thai',system-ui,sans-serif;
  --f-num:'Chakra Petch','Sarabun',ui-monospace,monospace;
}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{margin:0;color:var(--fg);font:15px/1.5 var(--f-body);padding-block:12px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button,input,select{font:inherit;color:inherit}
[hidden]{display:none!important}
.app{max-width:1180px;margin:0 auto;display:grid;gap:14px}
.bar{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.brand{font:600 24px/1.1 var(--f-display);display:flex;align-items:center;gap:10px;cursor:pointer;background:none;border:0;padding:0}
.brand i{width:12px;height:12px;border-radius:50%;background:var(--amber);box-shadow:0 0 14px 2px rgba(240,180,41,.55)}
.wallet{font:700 14px var(--f-num);color:var(--amber);border:1px solid var(--line);padding:5px 10px;background:var(--surface);display:flex;gap:6px;align-items:center}
.btn{background:var(--raised);border:1px solid var(--line);padding:9px 14px;min-height:44px;font-weight:600;font-size:14px;cursor:pointer;border-radius:6px}
.btn:hover{border-color:var(--muted)}
.btn.pri{background:var(--amber);border-color:var(--amber);color:var(--amber-ink)}
.btn.dng{border-color:var(--danger);color:var(--danger)}
.btn:disabled{opacity:.4;cursor:default}
.btn.sm{min-height:36px;padding:5px 10px;font-size:13px}
.btn:focus-visible,.card:focus-visible,.pick:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
.pg{display:grid;gap:16px}
h1,h2,h3{font-family:var(--f-display);font-weight:600;margin:0;text-wrap:balance}
h1{font-size:30px;line-height:1.2}
h2{font-size:21px}
h3{font-size:16px}
p{margin:0}
.muted{color:var(--muted)}
.note{font-size:13px;color:var(--muted)}
.hero{display:grid;gap:8px;padding:6px 0 4px}
.menu{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.mcard{background:var(--surface);border:1px solid var(--line);padding:16px;text-align:left;cursor:pointer;display:grid;gap:6px;border-radius:6px;min-width:0}
.mcard:hover{border-color:var(--amber)}
.mcard b{font:600 18px var(--f-display)}
.mcard span{color:var(--muted);font-size:13.5px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.card{background:var(--surface);border:1px solid var(--line);padding:12px;display:grid;gap:6px;border-radius:6px;min-width:0;align-content:start}
.pick{cursor:pointer;text-align:left}
.pick[aria-pressed="true"]{border-color:var(--amber);background:var(--raised)}
.pick:disabled{opacity:.5;cursor:default}
.card b{font:600 16px var(--f-display)}
.card small{color:var(--muted);font-size:13px;line-height:1.35}
.tag{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:50%;background:var(--col,var(--amber));color:#0b0f0d;font:700 15px var(--f-num)}
.tag.k{border-radius:5px;background:var(--danger);color:#fff}
.price{font:700 13px var(--f-num);color:var(--amber)}
.own{font:600 12px var(--f-num);color:var(--good)}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.field{display:grid;gap:4px;max-width:320px}
.field input{background:var(--surface);border:1px solid var(--line);padding:9px 12px;min-height:44px;border-radius:6px;font-size:16px}
.chk{display:flex;gap:8px;align-items:center}
.chk input{width:20px;height:20px}
.err{color:var(--danger);font-size:14px}
.code{font:700 34px var(--f-num);letter-spacing:.2em;color:var(--amber)}
.seats{display:grid;gap:8px}
.seat{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--line);padding:10px 12px;border-radius:6px}
.seat.mine{border-color:var(--amber)}
.seat select{background:var(--bg);border:1px solid var(--line);padding:6px;border-radius:6px;max-width:100%}
.seat small{display:block;color:var(--muted)}
/* game */
.gwrap{display:grid;gap:14px;grid-template-columns:minmax(0,1fr)}
@media(min-width:1000px){.gwrap{grid-template-columns:minmax(0,1fr) 340px;align-items:start}}
.gmain,.gside{display:grid;gap:10px;min-width:0;align-content:start;grid-template-columns:minmax(0,1fr)}
.hud{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;font:600 13px var(--f-num);color:var(--muted);letter-spacing:.03em}
.hud b{color:var(--fg)}
.pips{display:flex;gap:4px}
.pip{width:34px;height:8px;background:var(--surface);border:1px solid var(--line);position:relative}
.pip i{position:absolute;inset:0 auto 0 0;background:var(--amber)}
.pip.d{border-color:var(--good)}.pip.d i{background:var(--good)}
.phase{padding:2px 8px;border:1px solid var(--line)}
.phase.k{color:#fff;background:var(--danger);border-color:var(--danger)}
.boardbox{overflow:auto;border:1px solid var(--line);background:#0b100d;max-height:min(76vh,860px);touch-action:pan-x pan-y;overscroll-behavior:contain}
canvas{display:block}
.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.legend{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12px;color:var(--muted)}
.panel{background:var(--surface);border:1px solid var(--line);padding:12px;display:grid;gap:10px;border-radius:6px}
.who{display:flex;align-items:center;gap:10px}
.who b{display:block;font:600 17px/1.2 var(--f-display)}
.who small{color:var(--muted);font-size:12.5px;line-height:1.3;display:block}
.st{margin-left:auto;font:600 12px var(--f-num);padding:3px 8px;border:1px solid var(--line);white-space:nowrap}
.st.bad{color:var(--danger);border-color:var(--danger)}
.st.hook{color:#fff;background:var(--danger);border-color:var(--danger)}
.dicebox{display:flex;align-items:center;gap:12px;min-height:46px}
.dice{display:flex;gap:6px}
.die{display:inline-grid;place-items:center;width:42px;height:42px;border-radius:8px;background:var(--fg);color:var(--bg);font:700 23px var(--f-num)}
.die.lo{opacity:.45}
.mv{font:600 12px var(--f-num);color:var(--muted);letter-spacing:.03em}
.mv b{display:block;font:700 26px/1 var(--f-num);color:var(--amber);letter-spacing:0}
.actions{display:flex;flex-wrap:wrap;gap:8px}
.bar2{height:8px;background:var(--bg);border:1px solid var(--line)}
.bar2 i{display:block;height:100%;background:var(--danger)}
.roster{display:grid;gap:6px;font-size:13px}
.rr{display:flex;align-items:center;gap:8px}
.rr .tag{width:22px;height:22px;font-size:12px}
.rr span:last-child{margin-left:auto;font:600 12px var(--f-num);color:var(--muted)}
#log{list-style:none;margin:0;padding:0;display:grid;gap:3px;font-size:13px;color:var(--muted)}
#log li:first-child{color:var(--fg)}
#log li.h{font:600 11px var(--f-num);letter-spacing:.06em;color:var(--amber);padding-top:4px}
.help{display:grid;gap:12px;max-width:760px}
.help ul{margin:6px 0 0;padding-left:20px;display:grid;gap:3px;color:var(--muted)}
.help b{color:var(--fg)}
.modal{position:fixed;inset:0;background:var(--scrim);display:grid;place-items:center;z-index:20;padding:16px}
.mbox{background:var(--surface);border:1px solid var(--amber);max-width:420px;width:100%;padding:20px;display:grid;gap:12px;border-radius:8px}
.mbox h2{font-size:26px}
.tbl{display:grid;gap:4px;font-size:14px}
.tbl div{display:flex;justify-content:space-between;gap:10px}
.tbl .t{border-top:1px solid var(--line);padding-top:6px;font:700 16px var(--f-num);color:var(--amber)}

.btn{min-height:48px;font-size:15px}
.btn.sm{min-height:40px}
.btn.big{min-height:56px;font-size:17px;padding:12px 20px}
.spr{width:36px;height:42px;image-rendering:pixelated;flex:none}
.spr.l{width:48px;height:56px}
.hero{padding:10px 0 4px}
.hero h1{font-size:34px}
.menu .mcard{grid-template-columns:auto 1fr;align-items:center;gap:4px 12px}
.menu .mcard .spr{grid-row:1/3}
.thumb{width:100%;max-width:150px;aspect-ratio:1;image-rendering:pixelated;border:1px solid var(--line);background:#0b100d}
.mp{display:grid;gap:6px}
.hint{display:flex;align-items:center;gap:10px;background:var(--raised);border:1px solid var(--amber);padding:10px 12px;border-radius:8px;font-weight:600;font-size:15px;min-height:52px}
.hint.wait{border-color:var(--line);color:var(--muted);font-weight:400}
.hint.warn{border-color:var(--danger);color:#ffd7da}
.steps{display:flex;gap:6px;flex-wrap:wrap}
.step{font:700 12px var(--f-num);padding:3px 9px;border:1px solid var(--line);color:var(--muted);border-radius:99px}
.step.on{background:var(--amber);border-color:var(--amber);color:var(--amber-ink)}
.step.done{color:var(--good);border-color:var(--good)}
.bw{position:relative;min-width:0;max-width:100%}
.zoomctl{position:absolute;right:8px;top:8px;display:grid;gap:6px;z-index:3}
.zoomctl .btn{width:44px;min-height:44px;padding:0;font-size:20px;background:rgba(19,26,22,.92)}
.zoomctl .btn.t{font-size:12px;font-family:var(--f-num)}
.tools .btn.sm{min-height:44px}
.acts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.acts .btn{text-align:left;display:flex;gap:8px;align-items:center}
.acts .btn.pri{grid-column:1/-1;justify-content:center;min-height:56px;font-size:17px}
.mini{font-size:12px;color:var(--muted)}
body.ingame{padding-bottom:40px}
@media(max-width:999px){
  body.ingame{padding-bottom:calc(46vh + 16px)}
  #panel{position:fixed;left:0;right:0;bottom:0;z-index:15;max-height:46vh;overflow:auto;border-radius:14px 14px 0 0;border-width:1px 0 0;padding:12px max(16px,env(safe-area-inset-left,0px)) calc(12px + env(safe-area-inset-bottom,0px));box-shadow:0 -8px 24px rgba(0,0,0,.5)}
}
@media(prefers-reduced-motion:no-preference){.hint:not(.wait){animation:glow 1.8s ease-in-out infinite}@keyframes glow{50%{box-shadow:0 0 0 3px rgba(240,180,41,.18)}}}
.team{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.tm{display:flex;align-items:center;gap:7px;background:rgba(8,12,10,.82);border:1px solid rgba(255,255,255,.1);border-left:4px solid var(--c,#58b2ff);border-radius:8px;padding:4px 8px 4px 5px;min-width:0}
.tm.me{background:rgba(26,34,28,.92);box-shadow:0 0 0 1px rgba(255,255,255,.35) inset}
.tm .spr{width:26px;height:30px;flex:none}
.tm.gone{opacity:.55;filter:grayscale(.8)}
.tm .nm{display:grid;line-height:1.15;min-width:0}
.tm .nm b{font-size:12px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tm .nm small{font-size:11px;color:#9fb0a6}
.tm .ic{margin-left:auto;display:flex;align-items:center;gap:3px;flex:none}
.tm svg{width:20px;height:20px}
.tm .pips{display:flex;gap:2px}.tm .pips i{width:6px;height:6px;border-radius:50%;background:#555}.tm .pips i.on{background:#ee4b55}
@media(max-width:720px){.tm{padding:3px 5px 3px 4px;gap:4px}.tm .nm small{display:none}.tm .nm b{font-size:11px}.tm .spr{width:20px;height:24px}.tm svg{width:16px;height:16px}.tm .pips{display:none}}
</style>

  <header class="bar">

  <main id="pg"></main>
</div>

      const pool=cand.slice().sort(()=>Math.random()-.5),S=[];
      for(const p of pool){if(S.every(q=>dd(q,p)>=ds)){S.push(p);if(S.length===4)break;}}
      if(S.length<4)continue;
      const K=pool.find(p=>S.every(q=>dd(q,p)>=dk));
      if(K)return {S,K};
    }
  }
  return {S:cand.slice(0,4),K:cand[4]};
}

function stamp(){if(G.timer)G.dl=Date.now()+SECS*1000;}

/* ---------- ตู้ล็อคเกอร์ ---------- */
function freeAround(x,y,exS,prefFar){
  const occ=occSet(exS,false),c=[];
  for(const [dx,dy] of D4){
    const a=x+dx,b=y+dy;
    if(a<0||b<0||a>=W||b>=H||isB(tile(a,b))||tile(a,b)==='E'||occ.has(key(a,b)))continue;
    c.push({x:a,y:b,d:md({x:a,y:b},G.K)});
  }
  c.sort((p,q)=>prefFar?q.d-p.d:p.d-q.d);
  return c[0]||null;
}
function sHide(i){

  const L=nearList(s,(x,y)=>tile(x,y)==='L'&&G.lk[lI[key(x,y)]]===-1)[0];
  if(!L)return false;
  const j=lI[key(L.x,L.y)];
  G.lk[j]=i;s.hid=j;s.hidRd=G.rd;s.x=L.x;s.y=L.y;s.pts=0;s.acted=true;
  lg(nm(s)+' เข้าไปซ่อนในตู้ล็อคเกอร์ '+coord(L.x,L.y));
  afterS();
  return true;
}
function sUnhide(i){
  const s=G.S[i];
  if(!can(s)||s.hid<0)return false;
  const L=LOCKERS[s.hid],p=freeAround(L.x,L.y,i,true);
  if(!p)return false;
  G.lk[s.hid]=-1;s.hid=-1;s.x=p.x;s.y=p.y;
  lg(nm(s)+' ออกจากตู้ล็อคเกอร์');
  return true;
}
function kOpen(j){
  const k=G.K;
  if(G.ph!=='K'||!k.rolled||k.pts<1||k.carry>=0||j<0||j>=LOCKERS.length||md(k,LOCKERS[j])!==1)return false;
  const L=LOCKERS[j],si=G.lk[j];
  k.pts=0;
  if(si<0){lg('ผู้ล่าเปิดตู้ล็อคเกอร์ '+coord(L.x,L.y)+' ว่างเปล่า');kAuto();return true;}
  const s=G.S[si];
  G.lk[j]=-1;s.hid=-1;
  const p=freeAround(L.x,L.y,si,false);
  if(p){s.x=p.x;s.y=p.y;}else{s.x=k.x;s.y=k.y;}
  if(s.hp==='ok'){s.hp='hurt';}else if(s.hp==='hurt'){s.hp='down';}
  k.hits++;
  lg('ผู้ล่าเปิดตู้ล็อคเกอร์ '+coord(L.x,L.y)+' เจอ '+nm(s)+' ฟาดเข้าไปเต็มแรง');
  kAuto();
  return true;
}

function kHang(j){
  const k=G.K;
  if(G.ph!=='K'||!k.rolled||k.pts<1||k.carry<0||j<0||j>=HOOKS.length||G.hk[j]!==-1||md(k,HOOKS[j])!==1)return false;
  const s=G.S[k.carry];
  s.hooks++;k.carry=-1;k.pts-=1;k.hangs++;
  if(s.hooks>=3){s.hp='out';lg('ผู้ล่าแขวน '+nm(s)+' ครั้งที่ 3 ตกรอบ');}
  else{
    s.hp='hook';s.hl=HOOK_TIME[s.hooks];s.x=HOOKS[j].x;s.y=HOOKS[j].y;G.hk[j]=s.i;
    lg('ผู้ล่าแขวน '+nm(s)+' บนตะขอที่ '+coord(HOOKS[j].x,HOOKS[j].y)+' (ครั้งที่ '+s.hooks+' เหลือ '+s.hl+' รอบ)');
  }
  if(maybeEnd())return true;
  kAuto();
  return true;
}
function kBreak(j){
  const k=G.K,c=KCH[k.key].brk;
  if(G.ph!=='K'||!k.rolled||k.pts<c||j<0||j>=PALS.length||G.pal[j]!=='d'||md(k,PALS[j])>1)return false;
  G.pal[j]='b';k.pts-=c;
  lg('ผู้ล่าทุบพาเล็ตที่ '+coord(PALS[j].x,PALS[j].y)+' จนพัง');
  kAuto();
  return true;
}
function kWarp(){
  const k=G.K;
  if(G.ph!=='K'||!k.rolled||k.pts<1||!G.noise||k.warp>0||k.carry>=0)return false;
  const spots=[];
  const occ=occSet(-1,true);
  for(let dy=-2;dy<=2;dy++)for(let dx=-2;dx<=2;dx++){
    const x=G.noise.x+dx,y=G.noise.y+dy;
    if(Math.abs(dx)+Math.abs(dy)>2||x<0||y<0||x>=W||y>=H||kCost(x,y)===Infinity||occ.has(key(x,y)))continue;
    spots.push({x,y,d:Math.abs(dx)+Math.abs(dy)});
  }
  if(!spots.length)return false;
  spots.sort((p,q)=>p.d-q.d);
  k.x=spots[0].x;k.y=spots[0].y;k.warp=KCH[k.key].wcd;k.pts=Math.min(k.pts,2);
  lg('ผู้ล่าวาร์ปไปที่เครื่องที่ส่งเสียงดัง');
  return true;
}
function kEnd(){
  if(G.ph!=='K')return false;
  endKillerPhase();
  return true;
}

/* ---------- รางวัล ---------- */
function outcomeFor(seat){
  const e=G.over.esc;
  if(seat===0)return e<=1?'win':e===2?'draw':'lose';
  return e>=3?'win':e===2?'draw':'lose';
}
function rewards(seat){
  const o=outcomeFor(seat),items=[['เล่นจนจบเกม',30]];
  if(o==='win')items.push(['ชนะ',60]);
  else if(o==='draw')items.push(['เสมอ',30]);
  else items.push(['แพ้ (ปลอบใจ)',10]);
  if(seat===0){
    if(G.K.hangs)items.push(['แขวนตะขอ ×'+G.K.hangs,G.K.hangs*15]);
    if(G.K.hits)items.push(['ฟาดโดน ×'+G.K.hits,G.K.hits*5]);
    if(G.K.dmg)items.push(['ทำลายเครื่องปั่นไฟ ×'+G.K.dmg,G.K.dmg*4]);
  }else{
    const s=G.S[seat-1];
    if(s.rep)items.push(['ปั่นไฟ ×'+s.rep,s.rep*6]);
    if(s.res)items.push(['ช่วยเพื่อน ×'+s.res,s.res*25]);
    if(s.hp==='esc')items.push(['หนีออกมาได้',40]);
  }
  return {outcome:o,items,total:items.reduce((a,b)=>a+b[1],0)};
}

/* ---------- บอทผู้รอดชีวิต ---------- */
function aiFree(t){
  const r=[];
  for(const [dx,dy] of D4){const x=t.x+dx,y=t.y+dy;if(x>=0&&y>=0&&x<W&&y<H&&!isB(tile(x,y))&&tile(x,y)!=='E')r.push({x,y});}
  return r;
}
function aiGoal(i){
  const s=G.S[i],kv=seesK(s)?G.K:null;
  const others=G.S.filter(t=>t.i!==i&&playable(t));
  for(const t of G.S.filter(t=>t.hp==='hook'&&(!kv||md(t,kv)>5))){
    if(others.every(o=>md(o,t)>=md(s,t)-2))return {kind:'rescue',tiles:aiFree(t)};
  }
  for(const t of G.S.filter(t=>t.hp==='down'&&(!kv||md(t,kv)>6))){
    if(others.every(o=>md(o,t)>=md(s,t)-2))return {kind:'revive',tiles:aiFree(t).concat([{x:t.x,y:t.y}])};
  }
  if(G.gate){
    const ex=actEx();
    const open=ex.filter(e=>G.xo[exSide(e.x,e.y)]);
    if(open.length)return {kind:'exit',tiles:open};
    const cl=ex.slice().sort((a,b)=>md(s,a)-md(s,b))[0];
    let t=[];for(const e of ex)if(exSide(e.x,e.y)===exSide(cl.x,cl.y))t=t.concat(aiFree(e));
    return {kind:'exit',tiles:t};
  }
  let cand=GENS.map((g,j)=>({g,j})).filter(o=>G.gp[o.j]<GEN_NEED);
  if(!cand.length)return null;
  const safe=cand.filter(o=>!(kv&&md(o.g,kv)<=6));
  if(safe.length)cand=safe;
  const sc=o=>md(s,o.g)+(others.some(t=>md(t,o.g)<=1)?6:0)-G.gp[o.j]*0.4-(G.sh[o.j]?6:0);
  cand.sort((a,b)=>sc(a)-sc(b));
  const g=cand[0].g;
  return {kind:'gen',tiles:[g].concat(aiFree(g))};
}
function aiTryAct(i,g,kv){
  const s=G.S[i];
  if(s.pts<1)return false;
  if(g.kind==='exit'&&G.gate&&sOpenGate(i))return true;
  if(g.kind==='gen'&&nearList(s,(x,y)=>tile(x,y)==='G'&&G.gp[gI[key(x,y)]]<GEN_NEED).length)return sRepair(i);
  if(g.kind==='rescue'&&G.S.some(t=>t.hp==='hook'&&md(s,t)<=1))return sRescue(i);
  if(g.kind==='revive'&&s.pts>=3&&G.S.some(t=>t.hp==='down'&&md(s,t)<=1))return sRevive(i);
  if(!kv&&!s.item&&s.pts>=2&&nearList(s,(x,y)=>tile(x,y)==='C'&&!G.ch[cI[key(x,y)]]).length)return sChest(i);
  return false;
}
function aiMove(i,g){
  const s=G.S[i];
  if(s.pts<1)return false;
  const {dist,prev}=dijk(s.x,s.y,(x,y)=>sPlan(s,x,y),Infinity,occSet(i,false));
  let best=null;
  for(const t of g.tiles){const d=dist.get(key(t.x,t.y));if(d!=null&&(best===null||d<best.d))best={d,t};}
  if(!best||best.d===0)return false;
  let acted=false;
  for(const k of pathKeys(prev,key(best.t.x,best.t.y))){
    if(!can(G.S[i]))break;
    const [x,y]=k.split(',').map(Number);
    if(isDr(tile(x,y))&&drSt(x,y)==='c')break;
    if(sCost(s,x,y)>G.S[i].pts)break;
    if(!sMove(i,x,y))break;
    acted=true;
  }
  return acted;
}
function aiFlee(i){
  const s=G.S[i],r=sReach(i);
  if(r.dist.size<2)return false;
  const kd=dijk(G.K.x,G.K.y,kPlan,40,occSet(-1,true)).dist;
  let best=null;
  for(const [k,d] of r.dist){
    if(d===0)continue;
    const [x,y]=k.split(',').map(Number);
    let sc=(kd.has(k)?kd.get(k):40)*1.0;
    if(nearList({x,y},(a,b)=>tile(a,b)==='P'&&palSt(a,b)==='u').length)sc+=2;
    if(tile(x,y)==='W')sc+=1;
    if(nearList({x,y},(a,b)=>tile(a,b)==='L'&&G.lk[lI[key(a,b)]]===-1).length)sc+=2.5;
    sc+=Math.random()*0.5;
    if(!best||sc>best.sc)best={sc,x,y};
  }
  return best?sMove(i,best.x,best.y):false;
}
async function aiS(i,dl){
  let s=G.S[i];
  if(!can(s))return;
  if(s.hp==='carry'){sStruggle(i);await SLH(dl);return;}
  if(s.hid>=0){
    if(seesK(s)||G.rd-s.hidRd<2){sEnd(i);await SLH(dl);return;}
    sUnhide(i);await SLH(dl);
    if(!can(G.S[i]))return;
  }
  if(!s.rolled){sRoll(i);await SLH(dl);}
  for(let it=0;it<10&&can(G.S[i]);it++){
    s=G.S[i];
    const kv=seesK(s)?G.K:null,dK=kv?md(s,kv):99;
    if(s.item==='flash'&&kv&&dK<=3&&s.pts>=1){if(sFlash(i)){await SLH(dl);continue;}}
    if(dK>6&&s.pts>=1){
      if(s.hp==='hurt'&&s.item==='kit'&&sKit(i)){await SLH(dl);continue;}
      if(s.hp==='hurt'&&s.key==='med'&&s.pts>=3&&sHeal(i,true)){await SLH(dl);continue;}
    }
    if(kv&&s.pts>=1){
      const p=nearList(s,(x,y)=>tile(x,y)==='P'&&palSt(x,y)==='u'&&!(G.K.x===x&&G.K.y===y)&&Math.abs(x-G.K.x)+Math.abs(y-G.K.y)<=1)[0];
      if(p&&sPallet(i)){await SLH(dl);continue;}
    }
    if(kv&&dK>=2&&dK<=6&&s.pts>=1&&rnd(10)<=6){if(sHide(i)){await SLH(dl);return;}}
    if(kv&&dK<=4){aiFlee(i);await SLH(dl);if(can(G.S[i]))sEnd(i);return;}
    const g=aiGoal(i);
    if(!g){sEnd(i);return;}
    if(aiTryAct(i,g,kv)){await SLH(dl);continue;}
    if(!aiMove(i,g)){sEnd(i);return;}
    await SLH(dl);
  }
  if(can(G.S[i]))sEnd(i);
}

/* ---------- บอทผู้ล่า ---------- */
async function aiKStep(tiles,dl){
  const k=G.K;
  const {dist,prev}=dijk(k.x,k.y,kPlan,Infinity,occSet(-1,true));
  let best=null;
  for(const t of tiles){const d=dist.get(key(t.x,t.y));if(d!=null&&(best===null||d<best.d))best={d,t};}
  if(!best||best.d===0)return false;
  const path=pathKeys(prev,key(best.t.x,best.t.y));
  const [nx,ny]=path[0].split(',').map(Number);
  if(tile(nx,ny)==='P'&&palSt(nx,ny)==='d'){
    if(k.pts>=KCH[k.key].brk&&kBreak(pI[key(nx,ny)])){await SLH(dl);return true;}
    return false;
  }
  if(isDr(tile(nx,ny))&&drSt(nx,ny)==='c'){
    if(k.pts>=brkNeed(tile(nx,ny))&&kBreakDoor(dI[key(nx,ny)])){await SLH(dl);return true;}
    return false;
  }
  if(kCost(nx,ny)>k.pts)return false;
  if(!kMove(nx,ny))return false;
  await SLH(dl);
  return true;
}
async function aiK(dl){
  if(G.ph!=='K')return;
  const k=G.K;
  if(!k.rolled){kRoll();await SLH(dl);}
  if(G.ph==='K'&&G.noise&&k.warp===0&&k.carry<0&&k.pts>=1){if(kWarp())await SLH(dl);}
  for(let it=0;it<60&&G.ph==='K';it++){
    if(k.pts<=0){kEnd();return;}
    if(k.carry>=0){
      const hj=HOOKS.findIndex((h,j)=>G.hk[j]===-1&&md(k,h)===1);
      if(hj>=0&&kHang(hj)){await SLH(dl);continue;}
      const tiles=[];
      HOOKS.forEach((h,j)=>{if(G.hk[j]===-1)for(const t of aiFree(h))tiles.push(t);});
      if(!(await aiKStep(tiles,dl)))break;
      continue;
    }
    const adj=G.S.filter(s=>s.hid<0&&md(s,k)===1&&(s.hp==='down'||s.hp==='ok'||s.hp==='hurt'));
    {
      const oj=LOCKERS.findIndex((l,j)=>md(l,k)===1&&k.chk.indexOf(j)<0&&((k.mem&&md(k.mem,l)<=4)||(G.lk[j]>=0&&rnd(10)<=3)));
      if(oj>=0&&!adj.length){k.chk.push(oj);if(kOpen(oj)){await SLH(dl);return;}}
    }
    const dn=adj.find(s=>s.hp==='down');
    if(dn&&kPickup(dn.i)){await SLH(dl);continue;}
    const tg=adj.find(s=>s.hp==='hurt')||adj[0];
    if(tg&&kAttack(tg.i)){await SLH(dl);return;}
    if(!adj.length&&k.pts>=2&&!G.S.some(s=>(s.hp==='down'||s.hp==='ok'||s.hp==='hurt')&&killerSees(s))){
      const gj=GENS.findIndex((g,j)=>md(g,k)===1&&G.gp[j]>0&&G.gp[j]<GEN_NEED&&!G.sh[j]);
      if(gj>=0&&kDamage(gj)){await SLH(dl);continue;}
    }
    const vis=G.S.filter(s=>(s.hp==='down'||s.hp==='ok'||s.hp==='hurt')&&killerSees(s));
    let tiles=null;
    if(vis.length){
      const {dist}=dijk(k.x,k.y,kPlan,Infinity,occSet(-1,true));
      let best=null;
      for(const v of vis){
        for(const t of aiFree(v)){
          const d=dist.get(key(t.x,t.y));
          if(d==null)continue;
          const sc=d-(v.hp==='down'?3:v.hp==='hurt'?1:0);
          if(best===null||sc<best.sc)best={sc,t,v};
        }
      }
      if(best){tiles=[best.t];k.mem={x:best.v.x,y:best.v.y,rd:G.rd};k.chk=[];}
    }
    if(!tiles&&k.mem&&G.rd-k.mem.rd<=3){
      const cand=LOCKERS.map((l,j)=>j).filter(j=>k.chk.indexOf(j)<0&&md(LOCKERS[j],k.mem)<=4);
      if(cand.length){cand.sort((a,b)=>md(k,LOCKERS[a])-md(k,LOCKERS[b]));tiles=aiFree(LOCKERS[cand[0]]);}
    }
    if(!tiles&&k.mem&&G.rd-k.mem.rd<=2){
      if(md(k,k.mem)<=1)k.mem=null;
      else tiles=[k.mem];
    }
    if(!tiles){
      if(G.gate){
        tiles=[];
        for(const e of actEx())for(const t of aiFree(e))tiles.push(t);
      }else{
        let gi=k.pat;
        if(gi<0||md(k,GENS[gi])<=2){
          const pool=GENS.map((g,j)=>j).filter(j=>j!==k.pat&&md(k,GENS[j])>2);
          pool.sort((a,b)=>md(k,GENS[a])-md(k,GENS[b]));
          gi=pool.length?pool[Math.min(pool.length-1,rnd(3)-1)]:-1;
          k.pat=gi;
        }
        if(gi>=0)tiles=[GENS[gi]].concat(aiFree(GENS[gi]));
      }
    }
    if(!tiles||!tiles.length)break;
    if(!(await aiKStep(tiles,dl)))break;
  }
  if(G.ph==='K')kEnd();
}

let SNAP=null;
function sfxDiff(v){

    pos:G.S.map(t=>t.x+','+t.y).join(';')+'|'+G.K.x+','+G.K.y,esc:G.S.filter(t=>t.hp==='esc').length,ch:G.ch.join(''),lk:G.lk.join(','),xo:G.xo.join(''),sh:G.sh.join(',')};
  const o=SNAP;SNAP=s;
  {const me=NET.seat>0?G.S[NET.seat-1]:null;SFX.near(me&&alive(me)&&G.ph!=='END'&&md(me,G.K)<=8?1:0);}
  if(!o||o.gid!==s.gid)return;
  if(s.roll!==o.roll){SFX.play('roll');return;}
  if(s.ph==='END'&&o.ph!=='END'){const r=NET.seat>=0?rewards(NET.seat).outcome:'draw';SFX.play(r==='win'?'win':r==='lose'?'lose':'draw');return;}
  if(s.gate&&!o.gate)return SFX.play('gate');
  if(s.xo!==o.xo)return SFX.play('door');
  if(s.sh!==o.sh){for(let j=0;j<GENS.length;j++)if(G.sh[j]&&o.sh.split(',')[j]==='0'&&(v.full||v.lit[GENS[j].y*W+GENS[j].x]))return SFX.play('shock');}
  if(s.done>o.done)return SFX.play('gen');
  if(s.esc>o.esc)return SFX.play('esc');
  for(let i=0;i<4;i++){
    const a=o.hp[i],b=s.hp[i],t=G.S[i];
    if(a===b||!(v.full||visS(t,v)||NET.seat===i+1))continue;
    if(b==='hook')return SFX.play('hook');
    if(b==='hurt'||b==='down'&&a!=='hurt')return SFX.play(b==='down'?'down':'hit');
    if(b==='down')return SFX.play('down');
    if(a==='carry'&&(b==='ok'||b==='hurt'))return SFX.play('free');
    if((a==='hook'||a==='down')&&(b==='ok'||b==='hurt'))return SFX.play('free');
  }
  if(s.stun&&!o.stun)return SFX.play('stun');
  if(s.ch!==o.ch){for(let j=0;j<s.ch.length;j++)if(s.ch[j]!==o.ch[j]&&(v.full||v.lit[CHESTS[j].y*W+CHESTS[j].x]))return SFX.play('chest');}

  if(s.pal!==o.pal){for(let j=0;j<s.pal.length;j++)if(s.pal[j]!==o.pal[j]&&(v.full||v.lit[PALS[j].y*W+PALS[j].x]))return SFX.play(s.pal[j]==='d'?'pallet':'brk');}

  if(s.ph!==o.ph&&s.ph==='S'&&NET.seat>0&&G.S[NET.seat-1]&&alive(G.S[NET.seat-1])){
    const me=G.S[NET.seat-1];if(md(me,G.K)<=8)return SFX.play('near');
    return SFX.play('turn');
  }
  if(s.ph!==o.ph)return SFX.play('turn');
  if(s.pos!==o.pos){const me=NET.seat===0?G.K:NET.seat>0?G.S[NET.seat-1]:null;
    for(const t of G.S){if(visS(t,v)&&t.x+','+t.y!==o.pos.split('|')[0].split(';')[t.i])return SFX.play('step');}

function startSolo(){
  leaveAll();
  const isK=sel.side==='k';
  const seat=isK?0:1+Math.floor(Math.random()*4);
  const mine=isK?sel.kch:sel.ch;
  const pool=BASIC.filter(b=>b!==mine).sort(()=>Math.random()-.5);
  const schars=[];
  for(let i=1;i<=4;i++)schars.push(i===seat?mine:pool.pop());
  const ctl=['a','a','a','a','a'];ctl[seat]='h';
  newGame({schars,kchar:isK?mine:pick(Object.keys(KCH)),ctl,timer:false,map:sel.map});
  NET.mode='solo';NET.seat=seat;NET.owner={};
  setHook(()=>{renderGame();});
  manualZoom=false;
  go('game');drive();
}

/* ---------- วนเล่นของบอท ---------- */
async function drive(){
  if(driving)return;
  driving=true;const run=++RUN;
  try{
    while(G&&G.ph!=='END'&&run===RUN&&(NET.mode==='solo'||NET.mode==='host')){
      if(G.ph==='S'){
        const s=G.S.find(s=>s.ctl==='a'&&can(s));
        if(s)await aiS(s.i,DL_S);else await new Promise(r=>setTimeout(r,160));
      }else if(G.ph==='K'){
        if(G.K.ctl==='a')await aiK(DL_K);else await new Promise(r=>setTimeout(r,160));
      }else break;
    }
  }catch(e){}finally{driving=false;}
  if(G&&G.ph==='END')renderGame();
}

/* ---------- ส่งคำสั่งของผู้เล่น ---------- */
const KONLY={attack:1,pickup:1,hang:1,brk:1,warp:1,open:1,dmg:1,brkdoor:1};
const SONLY={repair:1,pallet:1,chest:1,rescue:1,revive:1,heal:1,healself:1,kit:1,flash:1,sprint:1,struggle:1,hide:1,unhide:1,opendoor:1,opengate:1};
const ACT={
  roll:s=>s===0?kRoll():sRoll(s-1),
  move:(s,x,y)=>s===0?kMove(x,y):sMove(s-1,x,y),
  repair:s=>sRepair(s-1),pallet:s=>sPallet(s-1),chest:s=>sChest(s-1),rescue:s=>sRescue(s-1),revive:s=>sRevive(s-1),
  heal:s=>sHeal(s-1,false),healself:s=>sHeal(s-1,true),kit:s=>sKit(s-1),flash:s=>sFlash(s-1),sprint:s=>sSprint(s-1),struggle:s=>sStruggle(s-1),
  opengate:s=>sOpenGate(s-1),hide:s=>sHide(s-1),unhide:s=>sUnhide(s-1),opendoor:s=>sOpenDoor(s-1),
  open:(s,j)=>kOpen(j),dmg:(s,j)=>kDamage(j),brkdoor:(s,j)=>kBreakDoor(j),
  end:s=>s===0?kEnd():sEnd(s-1),
  attack:(s,i)=>kAttack(i),pickup:(s,i)=>kPickup(i),hang:(s,j)=>kHang(j),brk:(s,j)=>kBreak(j),warp:()=>kWarp()
};
function runAct(seat,a,args){
  const f=ACT[a];
  if(!f||!G||G.ph==='END')return false;
  if(KONLY[a]&&seat!==0)return false;
  if(SONLY[a]&&seat<1)return false;
  if(!args.every(n=>Number.isInteger(n)))return false;
  if(seat===0&&G.ph!=='K')return false;
  try{return !!f(seat,...args);}catch(e){return false;}
}
function act(a,...args){
  if(NET.mode==='client'){if(NET.room&&NET.seat>=0)NET.room.emit('act',{a,args,seat:NET.seat}).catch(()=>{});return;}
  if(NET.seat<0)return;
  if(runAct(NET.seat,a,args))commit();
}
function commit(){renderGame();if(NET.mode==='host')bcast();drive();}

/* ---------- มุมมองและหมอก ---------- */
function myView(){
  const seat=NET.seat;
  const full=!G||G.ph==='END'||seat<0||(seat>0&&!alive(G.S[seat-1]));
  const lit=new Uint8Array(W*H);
  const circle=(c,r)=>{
    for(let y=Math.max(0,c.y-r);y<=Math.min(H-1,c.y+r);y++)for(let x=Math.max(0,c.x-r);x<=Math.min(W-1,c.x+r);x++)
      if((x-c.x)*(x-c.x)+(y-c.y)*(y-c.y)<=r*r)lit[y*W+x]=1;
  };
  if(full)lit.fill(1);
  else if(seat===0)circle(G.K,KCH[G.K.key].vis);
  else circle(G.S[seat-1],R_S);
  return {seat,full,lit};
}
function visS(s,v){return v.full||(v.seat>=1&&(s.i===v.seat-1||!!v.lit[s.y*W+s.x]))||(v.seat===0&&killerSees(s));}
function visK(v){return v.full||v.seat===0||!!v.lit[G.K.y*W+G.K.x];}
let KNOW=null,ANYSHOCK=false,FR=0;
function updateKnow(v){
  if(!KNOW||KNOW.gid!==G.gid)KNOW={gid:G.gid,gp:GENS.map(()=>0),sh:GENS.map(()=>0),pal:PALS.map(()=>'u'),ch:CHESTS.map(()=>0),hk:HOOKS.map(()=>-1),dr:DOORS.map(()=>'c'),ex:[0,0,0,0]};
  const L=o=>v.full||!!v.lit[o.y*W+o.x];
  ANYSHOCK=false;
  GENS.forEach((o,j)=>{if(L(o)){KNOW.gp[j]=G.gp[j];KNOW.sh[j]=G.sh[j]||0;}if(KNOW.sh[j])ANYSHOCK=true;});
  PALS.forEach((o,j)=>{if(L(o))KNOW.pal[j]=G.pal[j];});
  CHESTS.forEach((o,j)=>{if(L(o))KNOW.ch[j]=G.ch[j];});
  HOOKS.forEach((o,j)=>{if(L(o))KNOW.hk[j]=G.hk[j];});
  DOORS.forEach((o,j)=>{if(L(o))KNOW.dr[j]=G.dr[j];});
  EXITS.forEach(o=>{if(L(o)){const sd=exSide(o.x,o.y);if(G.xs.indexOf(sd)>=0)KNOW.ex[sd]=G.xo[sd]?2:1;}});
}

function drawBoard(){
  const cv=$('cv');if(!cv)return;FR=(FR+1)%1000;
  const cs=CS,M=margin(cs),wpx=M*2+cs*W,hpx=M*2+cs*H;
  const dpr=Math.min(2,window.devicePixelRatio||1);
  if(cv.width!==Math.round(wpx*dpr)||cv.height!==Math.round(hpx*dpr)){cv.width=Math.round(wpx*dpr);cv.height=Math.round(hpx*dpr);cv.style.width=wpx+'px';cv.style.height=hpx+'px';}
  const g=cv.getContext('2d');
  g.setTransform(dpr,0,0,dpr,0,0);
  g.imageSmoothingEnabled=false;
  g.fillStyle='#0b100d';g.fillRect(0,0,wpx,hpx);
  g.fillStyle='#8fa197';g.font='700 '+Math.max(8,Math.round(cs*.42))+'px "Chakra Petch",monospace';g.textAlign='center';g.textBaseline='middle';
  const step=cs>=18?1:cs>=11?2:5;
  for(let x=0;x<W;x+=step){const t=colName(x);g.fillText(t,M+x*cs+cs/2,M*.5);g.fillText(t,M+x*cs+cs/2,hpx-M*.5);}
  for(let y=0;y<H;y+=step){const t=String(H-y);g.fillText(t,M*.5,M+y*cs+cs/2);g.fillText(t,wpx-M*.5,M+y*cs+cs/2);}
  g.save();g.translate(M,M);
  const mt=MAPS[G.map];if(mt&&mt.th){CL.g1=mt.th[0];CL.g2=mt.th[1];CL.f1=mt.th[2];CL.f2=mt.th[3];}
  const v=myView();
  updateKnow(v);
  for(let y=0;y<H;y++)for(let x=0;x<W;x++)drawTile(g,x,y,cs);
  g.fillStyle='rgba(4,7,5,.5)';
  for(let y=0;y<H;y++)for(let x=0;x<W;x++)if(!v.lit[y*W+x])g.fillRect(x*cs,y*cs,cs,cs);
  if(!v.full){
    const me=v.seat===0?G.K:G.S[v.seat-1],r=v.seat===0?KCH[G.K.key].vis:R_S;
    g.strokeStyle='rgba(240,180,41,.6)';g.setLineDash([4,4]);g.lineWidth=1.5;
    g.beginPath();g.arc((me.x+.5)*cs,(me.y+.5)*cs,(r+.5)*cs,0,Math.PI*2);g.stroke();g.setLineDash([]);
  }
  if(G.noise&&(v.full||v.seat===0)){
    g.strokeStyle=CL.red;g.lineWidth=2;
    for(const rr of[.7,1.3]){g.beginPath();g.arc((G.noise.x+.5)*cs,(G.noise.y+.5)*cs,rr*cs,0,Math.PI*2);g.stroke();}
  }
  if(v.seat>=0&&G.ph!=='END'){
    let reach=null;
    if(v.seat===0&&G.ph==='K')reach=kReach().dist;
    else if(v.seat>=1)reach=sReach(v.seat-1).dist;
    if(reach){
      g.textAlign='center';g.textBaseline='middle';g.font='700 '+Math.max(7,Math.round(cs*.36))+'px "Chakra Petch",monospace';
      reach.forEach((d,k)=>{
        if(d<=0)return;
        const [x,y]=k.split(',').map(Number);
        g.fillStyle='rgba(240,180,41,.3)';g.fillRect(x*cs+1,y*cs+1,cs-2,cs-2);
        if(cs>=14){g.fillStyle='rgba(255,214,102,.98)';g.fillText(String(d),x*cs+cs/2,y*cs+cs/2);}
      });
    }
    if(v.seat===0&&G.ph==='K'&&G.K.rolled){
      g.lineWidth=2;
      const box=(p,c)=>{g.strokeStyle=c;g.strokeRect(p.x*cs+1,p.y*cs+1,cs-2,cs-2);};
      for(const s of G.S)if((s.hp==='ok'||s.hp==='hurt'||s.hp==='down')&&killerSees(s)&&md(s,G.K)===1)box(s,s.hp==='down'?CL.amber:CL.red);
      if(G.K.carry>=0)HOOKS.forEach((h,j)=>{if(G.hk[j]===-1&&md(h,G.K)===1)box(h,CL.amber);});
      PALS.forEach((p,j)=>{if(G.pal[j]==='d'&&md(p,G.K)<=1)box(p,CL.amber);});
      DOORS.forEach((p,j)=>{if(G.dr[j]==='c'&&md(p,G.K)<=1)box(p,CL.amber);});
      GENS.forEach((p,j)=>{if(md(p,G.K)===1&&G.gp[j]>0&&G.gp[j]<GEN_NEED&&!G.sh[j])box(p,CL.red);});
      LOCKERS.forEach(p=>{if(md(p,G.K)===1)box(p,'#9fb4ba');});
    }
  }
  for(const s of G.S){
    if(!alive(s)||!visS(s,v))continue;
    drawSurv(g,s,cs,v.seat===s.i+1);
  }
  if(visK(v))drawKiller(g,cs,v.seat===0);
  g.restore();
}

function drawTile(g,x,y,cs){
  let c=MAP[y][x];const px=x*cs,py=y*cs,h=hsh(x,y);
  let exst=0;if(c==='E'){exst=KNOW?KNOW.ex[exSide(x,y)]:0;if(!exst)c='f';}
  const even=(x+y)%2===0;
  const indoor=(c==='i'||c==='y'||c==='C'||c==='G'||c==='L');
  g.fillStyle=indoor?(even?CL.f1:CL.f2):(even?CL.g1:CL.g2);
  g.fillRect(px,py,cs,cs);
  if(indoor&&cs>=12){g.strokeStyle='rgba(0,0,0,.18)';g.lineWidth=1;g.beginPath();g.moveTo(px,py+cs*.5);g.lineTo(px+cs,py+cs*.5);g.stroke();}
  switch(c){
  case '#':{
    g.fillStyle=CL.wall;g.fillRect(px,py,cs,cs);
    g.fillStyle=CL.wallHi;g.fillRect(px,py,cs,Math.max(1,cs*.14));
    if(cs>=10&&!wallish(x,y+1)&&y+1<H&&MAP[y+1][x]!=='P'&&MAP[y+1][x]!=='D'){g.fillStyle=CL.wallLo;g.fillRect(px,py+cs*.8,cs,cs*.2);}
    if(cs>=12){g.strokeStyle='rgba(0,0,0,.25)';g.lineWidth=1;g.strokeRect(px+.5,py+.5,cs-1,cs-1);}
    break;}
  case 'W':{
    g.fillStyle=CL.wall;g.fillRect(px,py,cs,cs);
    const hor=wallish(x-1,y)&&wallish(x+1,y);
    const rx=hor?px+cs*.1:px+cs*.3,ry=hor?py+cs*.3:py+cs*.1,rw=hor?cs*.8:cs*.4,rh=hor?cs*.4:cs*.8;
    g.fillStyle=CL.woodDk;g.fillRect(rx-1,ry-1,rw+2,rh+2);
    g.fillStyle=CL.glass;g.fillRect(rx,ry,rw,rh);
    if(cs>=10){g.strokeStyle='rgba(255,255,255,.85)';g.lineWidth=1.2;g.beginPath();
    if(hor){g.moveTo(rx+rw/2,ry);g.lineTo(rx+rw/2,ry+rh);}else{g.moveTo(rx,ry+rh/2);g.lineTo(rx+rw,ry+rh/2);}
    g.stroke();}
    break;}
  case 'f':{
    g.strokeStyle=CL.fence;g.lineWidth=Math.max(1.5,cs*.1);g.lineCap='round';
    const cx=px+cs/2,cy=py+cs/2;
    g.beginPath();
    if(fenceAt(x-1,y)){g.moveTo(px,cy-cs*.14);g.lineTo(cx,cy-cs*.14);g.moveTo(px,cy+cs*.14);g.lineTo(cx,cy+cs*.14);}
    if(fenceAt(x+1,y)){g.moveTo(cx,cy-cs*.14);g.lineTo(px+cs,cy-cs*.14);g.moveTo(cx,cy+cs*.14);g.lineTo(px+cs,cy+cs*.14);}
    if(fenceAt(x,y-1)){g.moveTo(cx-cs*.14,py);g.lineTo(cx-cs*.14,cy);g.moveTo(cx+cs*.14,py);g.lineTo(cx+cs*.14,cy);}
    if(fenceAt(x,y+1)){g.moveTo(cx-cs*.14,cy);g.lineTo(cx-cs*.14,py+cs);g.moveTo(cx+cs*.14,cy);g.lineTo(cx+cs*.14,py+cs);}
    g.stroke();
    g.fillStyle=CL.wood;g.fillRect(cx-cs*.11,cy-cs*.11,cs*.22,cs*.22);
    g.lineCap='butt';
    break;}
  case 't':{
    const dc=(MAPS[G.map]&&MAPS[G.map].deco)||'tree',cx=px+cs/2,cy=py+cs/2;
    g.fillStyle='rgba(0,0,0,.3)';g.beginPath();g.ellipse(cx+cs*.05,py+cs*.82,cs*.4,cs*.14,0,0,7);g.fill();
    if(dc==='pine'){
      g.fillStyle='#143d2a';g.beginPath();g.moveTo(cx,py+cs*.04);g.lineTo(px+cs*.9,py+cs*.86);g.lineTo(px+cs*.1,py+cs*.86);g.closePath();g.fill();
      g.fillStyle='#e8f1f4';g.beginPath();g.moveTo(cx,py+cs*.04);g.lineTo(px+cs*.66,py+cs*.4);g.lineTo(px+cs*.34,py+cs*.4);g.closePath();g.fill();
    }else if(dc==='bush'){
      g.fillStyle='#2f6b3a';g.beginPath();g.arc(cx-cs*.15,cy+cs*.1,cs*.28,0,7);g.arc(cx+cs*.17,cy+cs*.1,cs*.26,0,7);g.arc(cx,cy-cs*.1,cs*.26,0,7);g.fill();
      g.fillStyle='#4a9a55';g.beginPath();g.arc(cx-cs*.05,cy-cs*.12,cs*.12,0,7);g.fill();
    }else if(dc==='grave'){
      g.fillStyle='#8d949c';g.beginPath();g.moveTo(px+cs*.28,py+cs*.86);g.lineTo(px+cs*.28,py+cs*.34);g.arc(cx,py+cs*.34,cs*.22,Math.PI,0);g.lineTo(px+cs*.72,py+cs*.86);g.closePath();g.fill();
      g.strokeStyle='#4d535a';g.lineWidth=1.2;g.beginPath();g.moveTo(cx,py+cs*.34);g.lineTo(cx,py+cs*.62);g.moveTo(cx-cs*.1,py+cs*.46);g.lineTo(cx+cs*.1,py+cs*.46);g.stroke();
    }else if(dc==='barrel'){
      g.fillStyle='#7b5a3a';g.fillRect(px+cs*.2,py+cs*.14,cs*.6,cs*.7);g.fillStyle='#4b5560';g.fillRect(px+cs*.2,py+cs*.28,cs*.6,cs*.07);g.fillRect(px+cs*.2,py+cs*.62,cs*.6,cs*.07);
      g.fillStyle='#9a7448';g.fillRect(px+cs*.24,py+cs*.14,cs*.12,cs*.7);
    }else if(dc==='rock'){
      g.fillStyle='#6b6a66';g.beginPath();g.moveTo(px+cs*.1,py+cs*.84);g.lineTo(px+cs*.22,py+cs*.34);g.lineTo(px+cs*.52,py+cs*.16);g.lineTo(px+cs*.86,py+cs*.4);g.lineTo(px+cs*.92,py+cs*.84);g.closePath();g.fill();
      g.fillStyle='#8c8b86';g.beginPath();g.moveTo(px+cs*.22,py+cs*.34);g.lineTo(px+cs*.52,py+cs*.16);g.lineTo(px+cs*.58,py+cs*.5);g.lineTo(px+cs*.3,py+cs*.6);g.closePath();g.fill();
    }else if(dc==='palm'){
      g.strokeStyle='#8a6a43';g.lineWidth=Math.max(2,cs*.14);g.beginPath();g.moveTo(cx,py+cs*.86);g.quadraticCurveTo(cx+cs*.1,cy,cx-cs*.04,py+cs*.28);g.stroke();
      g.fillStyle='#3f8f4c';for(const a of[-.9,-.3,.3,.9,1.5]){g.save();g.translate(cx-cs*.04,py+cs*.28);g.rotate(a-.3);g.beginPath();g.ellipse(0,-cs*.2,cs*.1,cs*.26,0,0,7);g.fill();g.restore();}
    }else{
      g.fillStyle=CL.tree1;g.beginPath();g.arc(cx,cy,cs*.45,0,7);g.fill();
      g.fillStyle=CL.tree2;g.beginPath();g.arc(px+cs*.42,py+cs*.4,cs*.24,0,7);g.fill();
    }
    break;}
  case 'X':{
    g.fillStyle=CL.crate;g.fillRect(px+cs*.14,py+cs*.14,cs*.72,cs*.72);
    g.strokeStyle=CL.woodDk;g.lineWidth=1.5;g.strokeRect(px+cs*.14,py+cs*.14,cs*.72,cs*.72);
    if(cs>=10){g.beginPath();g.moveTo(px+cs*.14,py+cs*.14);g.lineTo(px+cs*.86,py+cs*.86);g.moveTo(px+cs*.86,py+cs*.14);g.lineTo(px+cs*.14,py+cs*.86);g.stroke();}
    break;}
  case 'y':{
    const kind=h%3;
    if(kind===0){g.fillStyle='#7d5d3b';g.fillRect(px+cs*.12,py+cs*.14,cs*.76,cs*.72);g.fillStyle='#d9d2c4';g.fillRect(px+cs*.16,py+cs*.18,cs*.26,cs*.64);g.fillStyle='#4e6f8c';g.fillRect(px+cs*.44,py+cs*.18,cs*.4,cs*.64);}
    else if(kind===1){g.fillStyle='#8a6a43';g.fillRect(px+cs*.14,py+cs*.14,cs*.72,cs*.72);g.fillStyle='#a98456';g.fillRect(px+cs*.2,py+cs*.2,cs*.6,cs*.6);g.fillStyle='#e9e1cf';g.beginPath();g.arc(px+cs/2,py+cs/2,cs*.12,0,7);g.fill();}
    else{g.fillStyle='#6a4b30';g.fillRect(px+cs*.1,py+cs*.22,cs*.8,cs*.56);g.strokeStyle='#3d2a1a';g.lineWidth=1;if(cs>=12)for(let i=1;i<4;i++){g.beginPath();g.moveTo(px+cs*(.1+.2*i),py+cs*.22);g.lineTo(px+cs*(.1+.2*i),py+cs*.78);g.stroke();}}
    break;}
  case 'P':{
    const st=KNOW?KNOW.pal[pI[key(x,y)]]:'u';
    const hor=wallish(x-1,y)&&wallish(x+1,y);
    g.save();g.translate(px+cs/2,py+cs/2);if(!hor)g.rotate(Math.PI/2);
    if(st==='u'){
      g.fillStyle=CL.wood;g.fillRect(-cs*.44,-cs*.09,cs*.88,cs*.18);
      g.strokeStyle=CL.woodDk;g.lineWidth=1.2;g.strokeRect(-cs*.44,-cs*.09,cs*.88,cs*.18);
      if(cs>=12)for(let i=-2;i<=2;i++){g.beginPath();g.moveTo(i*cs*.17,-cs*.09);g.lineTo(i*cs*.17,cs*.09);g.stroke();}
      g.fillStyle='rgba(240,180,41,.45)';g.fillRect(-cs*.44,cs*.12,cs*.88,Math.max(1,cs*.05));
    }else if(st==='d'){
      g.fillStyle=CL.woodDk;g.fillRect(-cs*.46,-cs*.28,cs*.92,cs*.56);
      g.strokeStyle=CL.wood;g.lineWidth=1.6;
      if(cs>=10)for(let i=-1;i<=1;i++){g.beginPath();g.moveTo(-cs*.46,i*cs*.18);g.lineTo(cs*.46,i*cs*.18);g.stroke();}
      g.strokeRect(-cs*.46,-cs*.28,cs*.92,cs*.56);
    }else{
      g.fillStyle='rgba(185,138,80,.5)';
      g.save();g.rotate(.5);g.fillRect(-cs*.4,-cs*.2,cs*.3,cs*.07);g.restore();
      g.save();g.rotate(-.4);g.fillRect(cs*.05,cs*.1,cs*.34,cs*.07);g.restore();
      g.fillRect(-cs*.1,cs*.02,cs*.2,cs*.06);
    }
    g.restore();
    break;}
  case 'B':{
    const st=KNOW?KNOW.dr[dI[key(x,y)]]:'c';
    const hor=(wallish(x-1,y)&&wallish(x+1,y))||(fenceAt(x-1,y)&&fenceAt(x+1,y));
    g.save();g.translate(px+cs/2,py+cs/2);if(!hor)g.rotate(Math.PI/2);
    if(st==='c'){
      g.fillStyle='#d9a36a';g.fillRect(-cs*.5,-cs*.42,cs,cs*.84);
      g.strokeStyle='#6b4528';g.lineWidth=Math.max(1,cs*.07);
      for(let i=-2;i<=2;i++){g.beginPath();g.moveTo(i*cs*.2,-cs*.42);g.lineTo(i*cs*.2,cs*.42);g.stroke();}
      g.strokeRect(-cs*.5,-cs*.42,cs,cs*.84);
      g.strokeStyle='#8a5a30';g.lineWidth=Math.max(1.5,cs*.1);g.beginPath();g.moveTo(-cs*.46,-cs*.2);g.lineTo(cs*.46,cs*.2);g.moveTo(-cs*.46,cs*.2);g.lineTo(cs*.46,-cs*.2);g.stroke();
      g.fillStyle='#3a2a1a';for(const [a,b] of[[-.4,-.3],[.4,-.3],[-.4,.3],[.4,.3]]){g.beginPath();g.arc(a*cs,b*cs,Math.max(1,cs*.04),0,7);g.fill();}
    }else{
      g.fillStyle='rgba(217,163,106,.55)';
      g.save();g.rotate(.5);g.fillRect(-cs*.42,-cs*.14,cs*.34,cs*.09);g.restore();
      g.save();g.rotate(-.35);g.fillRect(cs*.04,cs*.08,cs*.38,cs*.09);g.restore();
      g.fillRect(-cs*.12,-cs*.02,cs*.24,cs*.07);g.fillRect(-cs*.3,cs*.2,cs*.2,cs*.06);
    }
    g.restore();
    break;}
  case 'D':{
    const st=KNOW?KNOW.dr[dI[key(x,y)]]:'c';
    const hor=wallish(x-1,y)&&wallish(x+1,y);
    g.save();g.translate(px+cs/2,py+cs/2);if(!hor)g.rotate(Math.PI/2);
    if(st==='c'){
      g.fillStyle='#8a5a30';g.fillRect(-cs*.5,-cs*.2,cs,cs*.4);
      g.strokeStyle='#4a2f18';g.lineWidth=1.2;g.strokeRect(-cs*.5,-cs*.2,cs,cs*.4);
      if(cs>=12)for(let i=-1;i<=1;i++){g.beginPath();g.moveTo(i*cs*.3,-cs*.2);g.lineTo(i*cs*.3,cs*.2);g.stroke();}
      g.fillStyle=CL.amber;g.beginPath();g.arc(cs*.34,0,Math.max(1,cs*.05),0,7);g.fill();
    }else if(st==='o'){
      g.fillStyle='#8a5a30';g.fillRect(-cs*.5,-cs*.5,cs*.14,cs*.62);
      g.strokeStyle='#4a2f18';g.lineWidth=1;g.strokeRect(-cs*.5,-cs*.5,cs*.14,cs*.62);
    }else{
      g.fillStyle='rgba(138,90,48,.55)';
      g.save();g.rotate(.4);g.fillRect(-cs*.4,-cs*.12,cs*.32,cs*.08);g.restore();
      g.save();g.rotate(-.3);g.fillRect(cs*.08,cs*.06,cs*.32,cs*.08);g.restore();
      g.fillRect(-cs*.1,-cs*.02,cs*.2,cs*.06);
    }
    g.restore();
    break;}
  case 'L':{
    g.fillStyle='#2b3438';g.fillRect(px+cs*.14,py+cs*.06,cs*.72,cs*.88);
    g.fillStyle='#58696f';g.fillRect(px+cs*.18,py+cs*.1,cs*.64,cs*.8);
    if(cs>=10){g.strokeStyle='#2b3438';g.lineWidth=1.2;
    for(let i=0;i<3;i++){g.beginPath();g.moveTo(px+cs*.28,py+cs*(.2+.07*i));g.lineTo(px+cs*.72,py+cs*(.2+.07*i));g.stroke();}
    g.beginPath();g.moveTo(px+cs*.5,py+cs*.4);g.lineTo(px+cs*.5,py+cs*.86);g.stroke();
    g.fillStyle=CL.amber;g.fillRect(px+cs*.58,py+cs*.58,cs*.07,cs*.12);}
    break;}
  case 'H':{
    const j=hI[key(x,y)],occ=KNOW&&KNOW.hk[j]>=0;
    g.fillStyle=CL.steel;g.beginPath();g.arc(px+cs/2,py+cs*.78,cs*.2,0,7);g.fill();
    g.strokeStyle='#9aa8a1';g.lineWidth=Math.max(1.5,cs*.1);g.beginPath();g.moveTo(px+cs/2,py+cs*.78);g.lineTo(px+cs/2,py+cs*.2);g.stroke();
    g.strokeStyle=occ?'#fff':CL.red;g.lineWidth=Math.max(1.5,cs*.1);g.beginPath();g.arc(px+cs*.66,py+cs*.28,cs*.17,Math.PI,Math.PI*2.6);g.stroke();
    break;}
  case 'G':{
    const j=gI[key(x,y)],p=KNOW?KNOW.gp[j]/GEN_NEED:0,done=p>=1,sh=KNOW?KNOW.sh[j]:0;
    g.fillStyle='#222b27';g.fillRect(px+cs*.1,py+cs*.1,cs*.8,cs*.8);
    g.strokeStyle=done?CL.green:sh?'#7fd7ff':CL.amber;g.lineWidth=2;g.strokeRect(px+cs*.1,py+cs*.1,cs*.8,cs*.8);
    g.fillStyle=done?CL.green:sh?'#4fa9d8':CL.amber;g.fillRect(px+cs*.2,py+cs*.8-cs*.6*p,cs*.6,cs*.6*p);
    if(cs>=10&&!sh){g.fillStyle='rgba(0,0,0,.65)';g.beginPath();g.moveTo(px+cs*.55,py+cs*.22);g.lineTo(px+cs*.36,py+cs*.54);g.lineTo(px+cs*.5,py+cs*.54);g.lineTo(px+cs*.44,py+cs*.78);g.lineTo(px+cs*.66,py+cs*.46);g.lineTo(px+cs*.52,py+cs*.46);g.closePath();g.fill();}
    if(sh&&!done){
      const ty=py+cs*.8-cs*.6*Math.min(1,sh/GEN_NEED);
      g.strokeStyle='#fff';g.lineWidth=Math.max(1.5,cs*.08);g.beginPath();g.moveTo(px+cs*.12,ty);g.lineTo(px+cs*.88,ty);g.stroke();
      g.fillStyle='#fff';g.beginPath();g.moveTo(px+cs*.06,ty-cs*.06);g.lineTo(px+cs*.16,ty);g.lineTo(px+cs*.06,ty+cs*.06);g.closePath();g.fill();
      g.fillStyle='rgba(127,215,255,'+(.12+.1*(FR%3))+')';g.fillRect(px-cs*.15,py-cs*.15,cs*1.3,cs*1.3);
      g.strokeStyle='#e6fbff';g.shadowColor='#4fd0ff';g.shadowBlur=Math.max(4,cs*.4);g.lineWidth=Math.max(1.2,cs*.09);g.lineCap='round';
      for(let n=0;n<3;n++){
        const r=((x*31+y*17+n*7+FR*(n+3))*2654435761>>>0)/4294967296;
        let ax=px+cs*(.1+.8*((n*.37+r)%1)),ay=py+cs*(.1+.8*(((n*.61)+r*1.7)%1));
        g.beginPath();g.moveTo(ax,ay);
        for(let m=0;m<4;m++){ax+=cs*(.18*Math.sin(FR*1.3+m+n)+.04);ay+=cs*(.14*Math.cos(FR*1.7+m*2+n));g.lineTo(ax,ay);}
        g.stroke();
      }
      g.lineCap='butt';g.shadowBlur=0;
      if(cs>=10){g.fillStyle='#fff';g.font='700 '+Math.max(7,Math.round(cs*.3))+'px "Chakra Petch",monospace';g.textAlign='center';g.textBaseline='bottom';g.shadowColor='#000';g.shadowBlur=3;g.fillText(String(KNOW.gp[j]),px+cs*.5,py+cs*.98);g.shadowBlur=0;}
    }
    break;}
  case 'C':{
    const op=KNOW&&KNOW.ch[cI[key(x,y)]];
    g.globalAlpha=op?.45:1;
    g.fillStyle=CL.wood;g.fillRect(px+cs*.15,py+cs*.32,cs*.7,cs*.46);
    g.fillStyle=CL.woodDk;g.fillRect(px+cs*.15,py+cs*.32,cs*.7,cs*.14);
    g.fillStyle=CL.amber;g.fillRect(px+cs*.45,py+cs*.4,cs*.1,cs*.16);
    g.globalAlpha=1;
    break;}
  case 'E':{
    const open=exst===2;
    g.fillStyle=open?'#14402e':'#3a1a1d';g.fillRect(px,py,cs,cs);
    g.strokeStyle=open?CL.green:CL.red;g.lineWidth=Math.max(1.5,cs*.12);
    for(let i=-cs;i<cs*2;i+=cs*.34){g.beginPath();g.moveTo(px+i,py+cs);g.lineTo(px+i+cs,py);g.stroke();}
    break;}
  }
}
function drawSprite(g,spr,cx,cyBottom,cs,down,min){
  const w=Math.max(min||9,cs*.9),h=w*14/12;
  g.save();
  if(down){g.translate(cx,cyBottom-w*.5);g.rotate(Math.PI/2);g.drawImage(spr,-w/2,-h/2,w,h);}
  else g.drawImage(spr,cx-w/2,cyBottom-h,w,h);
  g.restore();
}
function drawSurv(g,s,cs,me){
  let cx=(s.x+.5)*cs,cb=(s.y+.95)*cs;
  const carry=s.hp==='carry';
  if(carry){cx+=cs*.3;cb-=cs*.3;}
  const sc=carry?cs*.6:cs;
  g.fillStyle=SCOL[s.i];g.globalAlpha=.9;
  g.beginPath();g.ellipse(cx,cb-sc*.02,sc*.46,sc*.2,0,0,7);g.fill();g.globalAlpha=1;
  if(s.hp==='hook'||s.hp==='carry'||s.hp==='down'){g.strokeStyle=CL.red;g.lineWidth=2;g.beginPath();g.ellipse(cx,cb-sc*.02,sc*.5,sc*.24,0,0,7);g.stroke();}
  if(s.rev>0){g.strokeStyle=CL.amber;g.lineWidth=2;g.setLineDash([3,2]);g.beginPath();g.ellipse(cx,cb-sc*.02,sc*.6,sc*.3,0,0,7);g.stroke();g.setLineDash([]);}
  if(s.hid>=0){g.globalAlpha=.65;}
  drawSprite(g,survSprite(s.key,s.hp==='hurt'||s.hp==='down'||s.hp==='hook'),cx,cb-sc*.04,s.hid>=0?cs*.7:sc,s.hp==='down');
  g.globalAlpha=1;
  if(me){
    g.fillStyle='#fff';g.beginPath();const ty=cb-cs*1.2;g.moveTo(cx-cs*.22,ty-cs*.28);g.lineTo(cx+cs*.22,ty-cs*.28);g.lineTo(cx,ty);g.closePath();g.fill();
  }
  if(s.hp==='hook'&&cs>=10){g.fillStyle='#fff';g.fillRect(cx+cs*.2,cb-cs*1.1,cs*.45,cs*.4);g.fillStyle=CL.red;g.font='700 '+Math.max(8,Math.round(cs*.34))+'px "Chakra Petch",monospace';g.textAlign='center';g.textBaseline='middle';g.fillText(String(s.hl),cx+cs*.42,cb-cs*.9);}
}
function drawKiller(g,cs,me){
  const k=G.K,cx=(k.x+.5)*cs,cb=(k.y+.95)*cs;
  g.fillStyle=CL.red;g.globalAlpha=.9;g.beginPath();g.ellipse(cx,cb-cs*.02,cs*.5,cs*.22,0,0,7);g.fill();g.globalAlpha=1;
  drawSprite(g,killSprite(k.key),cx,cb-cs*.04,cs*1.05,false,10);
  if(k.stun){g.fillStyle='#fff';g.font='700 '+Math.max(9,Math.round(cs*.5))+'px "Chakra Petch",monospace';g.textAlign='center';g.textBaseline='middle';g.fillText('z z',cx,cb-cs*1.1);}
  if(me){g.fillStyle='#fff';const ty=cb-cs*1.3;g.beginPath();g.moveTo(cx-cs*.22,ty-cs*.28);g.lineTo(cx+cs*.22,ty-cs*.28);g.lineTo(cx,ty);g.closePath();g.fill();}
}

/* ---------- หน้าเกม ---------- */
function fitCS(){
  const bb=$('boardbox'),cw=(bb&&bb.clientWidth)||700;
  const ch=Math.max(320,window.innerHeight*(window.innerWidth<1000?.5:.82));
  return Math.max(6,Math.floor(Math.min(cw/(W+1.9),ch/(H+1.9))));
}
function setBoxHeight(){const bb=$('boardbox');if(bb)bb.style.maxHeight=Math.max(320,window.innerHeight*(window.innerWidth<1000?.52:.84))+'px';}
function setZoom(n,keepCenter,cx,cy){
  n=Math.max(6,Math.min(56,Math.round(n)));
  if(n===CS)return;
  const bb=$('boardbox');
  let ux=0,uy=0,ox=0,oy=0,ok=bb&&keepCenter!==false;
  if(ok){
    const r=bb.getBoundingClientRect();
    ox=cx===undefined?bb.clientWidth/2:cx-r.left;oy=cy===undefined?bb.clientHeight/2:cy-r.top;
    const M=margin(CS);
    ux=(bb.scrollLeft+ox-M)/CS;uy=(bb.scrollTop+oy-M)/CS;
  }
  CS=n;manualZoom=true;
  drawBoard();
  if(ok){const M=margin(CS);bb.scrollLeft=M+ux*CS-ox;bb.scrollTop=M+uy*CS-oy;}
}
function buildGame(el){
  el.innerHTML=`<div class="gwrap"><div class="gmain"><div class="hint" id="hint"></div><div class="hud" id="hud"></div><div class="team" id="team"></div>
  <div class="bw"><div class="boardbox" id="boardbox"><canvas id="cv" aria-label="กระดานเกม"></canvas></div>
</div>
  <div class="legend"><span>พิกัดแบบหมากรุก เช่น C12</span><span>แตะช่องเหลืองเพื่อเดิน</span><span>ถ่างนิ้ว/Ctrl+ล้อเมาส์เพื่อซูม · ลากเพื่อเลื่อนแผนที่</span></div></div>
  <aside class="gside"><div class="panel" id="panel"></div><div class="panel"><h3>บันทึกเหตุการณ์</h3><ol id="log"></ol></div></aside></div>`;
  setBoxHeight();
  CS=manualZoom?CS:fitCS();
  needCenter=manualZoom;
  const cv=$('cv'),pts=new Map();let p0=0,c0=0;
  cv.onclick=e=>{
    if(moved)return;
    const r=cv.getBoundingClientRect(),M=margin(CS);
    const x=Math.floor((e.clientX-r.left-M)/CS),y=Math.floor((e.clientY-r.top-M)/CS);
    if(x>=0&&y>=0&&x<W&&y<H)onCell(x,y);
  };
  const bb=$('boardbox');cv.style.touchAction='none';
  let drag=null,moved=false;
  cv.addEventListener('pointerdown',e=>{
    pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
    try{cv.setPointerCapture(e.pointerId);}catch(_){}
    if(pts.size===1){drag={x:e.clientX,y:e.clientY,sl:bb.scrollLeft,st:bb.scrollTop};moved=false;}
    if(pts.size===2){const [a,b2]=[...pts.values()];p0=Math.hypot(a.x-b2.x,a.y-b2.y);c0=CS;drag=null;moved=true;}
  });
  cv.addEventListener('pointermove',e=>{
    if(!pts.has(e.pointerId))return;
    pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
    if(pts.size===2&&p0>0){const [a,b2]=[...pts.values()];setZoom(c0*Math.hypot(a.x-b2.x,a.y-b2.y)/p0,true,(a.x+b2.x)/2,(a.y+b2.y)/2);}
    else if(drag&&pts.size===1){
      const dx=e.clientX-drag.x,dy=e.clientY-drag.y;
      if(moved||Math.hypot(dx,dy)>6){moved=true;bb.scrollLeft=drag.sl-dx;bb.scrollTop=drag.st-dy;}
    }
  });
  const up=e=>{pts.delete(e.pointerId);if(pts.size<2)p0=0;if(pts.size===0)drag=null;setTimeout(()=>{if(pts.size===0)moved=false;},0);};
  cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',up);
  window.onkeydown=e=>{if(page!=='game'||/INPUT|SELECT|TEXTAREA/.test((e.target||{}).tagName||''))return;if(e.key==='+'||e.key==='=')setZoom(CS*1.2);else if(e.key==='-')setZoom(CS/1.2);else if(e.key==='0'){manualZoom=false;CS=0;setZoom(fitCS(),false);}};
  cv.addEventListener('wheel',e=>{if(e.ctrlKey||e.metaKey){e.preventDefault();setZoom(CS*(e.deltaY<0?1.12:1/1.12),true,e.clientX,e.clientY);}},{passive:false});
  $('panel').onclick=e=>{
    const b=e.target.closest('[data-a]');if(!b||b.disabled)return;
    const [a,...r]=b.dataset.a.split(':');
    SFX.play('click');act(a,...r.map(Number));
  };
  lastRollId=G&&G.roll?G.roll.id:0;
  renderGame();
}
function onCell(x,y){
  if(!G||G.ph==='END'||NET.seat<0)return;
  const k=key(x,y),seat=NET.seat,t=MAP[y][x];
  if(seat===0){
    if(G.ph!=='K'||!G.K.rolled)return;
    if(t==='H'&&G.K.carry>=0&&md(G.K,{x,y})===1)return act('hang',hI[k]);
    if(t==='L'&&G.K.carry<0&&md(G.K,{x,y})===1)return act('open',lI[k]);
    if(t==='G'&&md(G.K,{x,y})===1&&!G.sh[gI[k]])return act('dmg',gI[k]);
    if((t==='D'||t==='B')&&G.dr[dI[k]]==='c'&&md(G.K,{x,y})<=1)return act('brkdoor',dI[k]);
    if(t==='P'&&palSt(x,y)==='d'&&md(G.K,{x,y})<=1)return act('brk',pI[k]);
    const sv=G.S.find(s=>(s.hp==='ok'||s.hp==='hurt'||s.hp==='down')&&s.hid<0&&s.x===x&&s.y===y&&killerSees(s)&&md(s,G.K)===1);
    if(sv&&G.K.carry<0)return act(sv.hp==='down'?'pickup':'attack',sv.i);
    const d=kReach().dist.get(k);
    if(d>0)act('move',x,y);
  }else{
    if(t==='E'&&G.gate&&md(G.S[seat-1],{x,y})<=1&&G.xs.indexOf(exSide(x,y))>=0&&!G.xo[exSide(x,y)]){act('opengate');return;}
    const d=sReach(seat-1).dist.get(k);
    if(d>0)act('move',x,y);
  }
}
function setHTML(el,h){if(el&&el._h!==h){el._h=h;el.innerHTML=h;return true;}return false;}
function die(v,lo){return `<span class="die${lo?' lo':''}">${v}</span>`;}

  },70);

function survivorButtons(s){
  const b=[],i=s.i;
  if(s.hid>=0)return [['unhide','ออกจากตู้ล็อคเกอร์',1],['end','อยู่ในตู้ต่อ (จบเทิร์น)']];
  if(!s.rolled)return [['roll','ทอยลูกเต๋า',1]];
  const gn=nearList(s,(x,y)=>MAP[y][x]==='G'&&G.gp[gI[key(x,y)]]<GEN_NEED).length;
  if(gn&&s.pts>=1){const gg=nearList(s,(x,y)=>MAP[y][x]==='G'&&G.gp[gI[key(x,y)]]<GEN_NEED)[0],shk=G.sh[gI[key(gg.x,gg.y)]];b.push(['repair',(shk?'แก้ช็อต · ':'')+'ปั่นไฟ +'+(s.pts+(s.key==='mech'?2:0)+(s.item==='tool'?4:0))+(shk?' (ต้องถึง '+shk+')':''),1]);}
  const pn=nearList(s,(x,y)=>MAP[y][x]==='P'&&palSt(x,y)==='u')[0];

  if(!s.item&&s.pts>=2&&nearList(s,(x,y)=>MAP[y][x]==='C'&&!G.ch[cI[key(x,y)]]).length)b.push(['chest','เปิดกล่อง (2)']);
  const rc=s.key==='savior'?0:1;
  if(s.pts>=rc&&G.S.some(t=>t.i!==i&&t.hp==='hook'&&md(s,t)<=1))b.push(['rescue','ช่วยลงจากตะขอ ('+rc+')']);
  if(s.pts>=3&&G.S.some(t=>t.i!==i&&t.hp==='down'&&md(s,t)<=1))b.push(['revive','พยุงเพื่อนขึ้น (3)']);
  if(s.key==='med'){
    if(s.pts>=2&&G.S.some(t=>t.i!==i&&t.hp==='hurt'&&md(s,t)<=1))b.push(['heal','รักษาเพื่อน (2)']);
    if(s.pts>=3&&s.hp==='hurt')b.push(['healself','รักษาตัวเอง (3)']);
  }
  if(s.item==='flash'&&s.pts>=1&&md(s,G.K)<=3)b.push(['flash','ส่องไฟฉายใส่ผู้ล่า (1)']);
  if(s.item==='kit'&&s.pts>=1&&(s.hp==='hurt'||G.S.some(t=>t.i!==i&&t.hp==='hurt'&&md(s,t)<=1)))b.push(['kit','ใช้ชุดปฐมพยาบาล (1)']);
  if(s.pts>=1&&nearList(s,(x,y)=>MAP[y][x]==='L'&&G.lk[lI[key(x,y)]]===-1).length)b.push(['hide','ซ่อนในตู้ล็อคเกอร์ (1)']);
  if(G.gate&&s.pts>=1&&nearList(s,(x,y)=>MAP[y][x]==='E'&&G.xs.indexOf(exSide(x,y))>=0&&!G.xo[exSide(x,y)]).length)b.push(['opengate','เปิดประตูทางออก (ใช้ '+s.pts+' แต้ม · ต้องรวม '+EXIT_NEED+')',1]);
  if(s.key==='run'&&!s.sp)b.push(['sprint','สปรินต์ +3']);
  b.push(['end','จบเทิร์น']);
  return b;
}
function killerButtons(){
  const k=G.K,b=[];
  if(!k.rolled)return [['roll','ทอยลูกเต๋า',1]];
  if(k.carry<0&&k.pts>=1){
    for(const s of G.S){
      if(s.hid>=0||md(s,k)!==1||!killerSees(s))continue;
      if(s.hp==='down')b.push(['pickup:'+s.i,'อุ้ม '+SCH[s.key].n+' (ฟรี)',1]);
      else if(s.hp==='ok'||s.hp==='hurt')b.push(['attack:'+s.i,'ฟาด '+SCH[s.key].n,1]);
    }
  }
  if(k.carry>=0&&k.pts>=1)HOOKS.forEach((h,j)=>{if(G.hk[j]===-1&&md(h,k)===1)b.push(['hang:'+j,'แขวนตะขอ '+coord(h.x,h.y)+' (1)',1]);});
  GENS.forEach((o,j)=>{if(md(o,k)===1&&G.gp[j]>0&&G.gp[j]<GEN_NEED&&!G.sh[j]&&k.pts>=2&&k.carry<0)b.push(['dmg:'+j,'กระทืบเครื่องปั่นไฟ '+coord(o.x,o.y)+' (2)']);});
  DOORS.forEach((o,j)=>{const n=brkNeed(MAP[o.y][o.x]);if(md(o,k)<=1&&G.dr[j]==='c'&&k.pts>=n&&k.carry<0)b.push(['brkdoor:'+j,(n===3?'พังแผงไม้ ':'พังประตูไม้ ')+coord(o.x,o.y)+' ('+n+')']);});
  PALS.forEach((p,j)=>{if(G.pal[j]==='d'&&md(p,k)<=1&&k.pts>=KCH[k.key].brk)b.push(['brk:'+j,'ทุบพาเล็ต '+coord(p.x,p.y)+' ('+KCH[k.key].brk+')']);});
  if(k.carry<0&&k.pts>=1)LOCKERS.forEach((l,j)=>{if(md(l,k)===1)b.push(['open:'+j,'เปิดตู้ล็อคเกอร์ '+coord(l.x,l.y)+' (1)']);});
  if(G.noise&&k.warp===0&&k.carry<0&&k.pts>=1)b.push(['warp','วาร์ปไปเครื่องที่ดัง (1)']);
  b.push(['end','จบเทิร์น']);
  return b;
}

function firebaseConfigured(){

    FIREBASE_CONFIG.projectId && !FIREBASE_CONFIG.projectId.startsWith('ใส่_') &&

async function roomApi(){
  ROOM_API_ERROR='';
  if(!firebaseConfigured()){ROOM_API_ERROR='ยังไม่ได้ตั้งค่า FIREBASE_CONFIG ในไฟล์ HTML';return null;}
  try{
    const app= firebase.apps.length ? firebase.app() : firebase.initializeApp(FIREBASE_CONFIG);
    const auth=firebase.auth(app);
    if(!auth.currentUser)await auth.signInAnonymously();
    return makeFirebaseRoomApi(firebase.database(app),auth);
  }catch(e){console.error('Firebase initialization failed',e);ROOM_API_ERROR=(e&&e.code)||'Firebase เชื่อมต่อไม่สำเร็จ';return null;}
}
function makeFirebaseRoomApi(db,auth){
  return {
    async join(roomName,isHost=false){
      const roomRef=db.ref('rooms/'+roomName);
      const hostRef=roomRef.child('hostUid');
      const uid=auth.currentUser.uid;
      if(isHost){
        const tx=await hostRef.transaction(v=>v===null?uid:v);
        if(!tx.committed || tx.snapshot.val()!==uid){const e=new Error('Room code already exists');e.code='room-exists';throw e;}
      }
      const playersRef=roomRef.child('players');
      const peerId=uid+'_'+playersRef.push().key;
      const myRef=playersRef.child(peerId);
      const joinedAt=Date.now();
      let presenceData={nm:'ผู้เล่น',seat:null,ch:null,host:!!isHost};
      const cache=new Map(),peerListeners=new Set(),eventListeners={state:new Set(),act:new Set()};
      let closed=false;
      const peers=()=>Array.from(cache.values());
      const peerObj=(id,v)=>({peer:id,kind:'viewer',presence:v&&v.presence||{},sameTab:id===peerId});
      await myRef.set({uid,presence:presenceData,joinedAt});
      await myRef.onDisconnect().remove();
      const playersHandler=snap=>{
        if(closed)return;
        const next=new Map();
        snap.forEach(ch=>next.set(ch.key,peerObj(ch.key,ch.val())));
        const joined=[],left=[];
        for(const [id,p] of next)if(!cache.has(id))joined.push(p);
        for(const [id,p] of cache)if(!next.has(id))left.push(p);
        cache.clear();for(const [id,p] of next)cache.set(id,p);
        if(joined.length||left.length)for(const fn of peerListeners)fn({joined,left});
      };
      playersRef.on('value',playersHandler);
      const stateRef=roomRef.child('state');
      const stateHandler=snap=>{
        const v=snap.val();if(!v||!v.data)return;
        const msg={peer:v.peer||'',data:v.data,sameTab:(v.peer===peerId)};
        for(const fn of eventListeners.state)fn(msg);
      };
      stateRef.on('value',stateHandler);
      const actsRef=roomRef.child('acts');
      const actsHandler=snap=>{
        const v=snap.val();if(!v||!v.data||!v.peer)return;
        // Ignore old actions replayed when a listener first connects.
        if(!v.at||v.at<joinedAt)return;
        const msg={peer:v.peer,data:v.data,sameTab:v.peer===peerId};
        for(const fn of eventListeners.act)fn(msg);
      };
      actsRef.on('child_added',actsHandler);
      return {
        peers,
        async presence(data){
          if(closed)return;
          presenceData={...presenceData,...data};
          await myRef.child('presence').update(data);
        },
        onPeers(fn){peerListeners.add(fn);return ()=>peerListeners.delete(fn);},
        on(event,fn){if(!eventListeners[event])throw new Error('Unknown room event');eventListeners[event].add(fn);return ()=>eventListeners[event].delete(fn);},
        emit(event,data){
          if(closed)return Promise.reject(new Error('Room closed'));
          if(event==='state')return stateRef.set({peer:peerId,data,at:Date.now()});
          if(event==='act')return actsRef.push({peer:peerId,peerUid:uid,data,at:Date.now()});
          return Promise.reject(new Error('Unknown room event'));
        },
        async leave(){
          if(closed)return;closed=true;
          playersRef.off('value',playersHandler);stateRef.off('value',stateHandler);actsRef.off('child_added',actsHandler);
          await myRef.onDisconnect().cancel().catch(()=>{});
          await myRef.remove().catch(()=>{});
          peerListeners.clear();eventListeners.state.clear();eventListeners.act.clear();cache.clear();
        }
      };
    }
  };
}

function onPeers(ch){
  if(page==='lobby')renderLobby();
  if(NET.mode==='host'&&G&&page==='game'){
    for(const p of ch.left){
      for(const k of Object.keys(NET.owner)){
        if(NET.owner[k]===p.peer){
          delete NET.owner[k];
          if(+k===0)G.K.ctl='a';else G.S[+k-1].ctl='a';
          lg((+k===0?'ผู้ล่า':SCH[G.S[+k-1].key].n)+' หลุดจากห้อง บอทเล่นแทน','h');
        }
      }
    }
    if(ch.left.length||ch.joined.length){commit();}
  }
  if(NET.mode==='client'&&page==='game'&&!hostPeer()){leaveAll();NET.lobbyMsg='โฮสต์ออกจากห้องแล้ว';go('online');}
}
function hostStart(){
  if(!NET.room)return;
  const own=owners(),me=myPeer();
  const mineSeat=Object.keys(own).find(k=>own[k].peer===me);
  if(mineSeat===undefined){const e=$('em');if(e)e.textContent='เลือกที่นั่งของคุณก่อนเริ่มเกม';return;}
  const owner={},used=new Set(),schars=[null,null,null,null];
  for(let k=0;k<5;k++)if(own[k])owner[k]=own[k].peer;
  for(let k=1;k<=4;k++){const c=own[k]&&own[k].presence.ch;if(c&&SCH[c]&&!used.has(c)){used.add(c);schars[k-1]=c;}}
  for(let i=0;i<4;i++)if(!schars[i]){const pool=BASIC.filter(b=>!used.has(b));const c=pool.length?pick(pool):pick(Object.keys(SCH).filter(c=>!used.has(c)));used.add(c);schars[i]=c;}
  const kc=own[0]&&own[0].presence.ch;
  const ctl=[0,1,2,3,4].map(k=>own[k]?'h':'a');
  newGame({schars,kchar:KCH[kc]?kc:pick(Object.keys(KCH)),ctl,timer:optTimer,map:optMap});
  NET.mode='host';NET.owner=owner;NET.seat=+mineSeat;
  setHook(()=>{renderGame();bcast();});
  manualZoom=false;
  if(page!=='game')go('game');else{$('modal').hidden=true;$('modal').dataset.gid='';renderGame();}
  bcast();drive();
}
function bcast(){
  if(!NET.room||NET.mode!=='host'||!G)return;
  const rem=G.timer?Math.max(0,Math.round((G.dl-Date.now())/1000)):0;
  let lgs=getLog().slice(-8),msg;
  for(;;){
    msg={g:G,o:NET.owner,l:lgs,rem};
    if(new TextEncoder().encode(JSON.stringify(msg)).length<3900||!lgs.length)break;
    lgs=lgs.slice(1);
  }
  NET.room.emit('state',msg).catch(()=>{});
}
function onState(m){
  if(NET.mode!=='client'||m.sameTab||m.peer!==hostPeer())return;
  const d=m.data;
  if(!d||!d.g||!d.g.S||!d.g.K)return;
  const newGid=!G||G.gid!==d.g.gid;
  setG(d.g);setLog(Array.isArray(d.l)?d.l:[]);
  NET.owner=d.o||{};NET.rem=d.rem||0;NET.remAt=Date.now();
  const me=myPeer();
  const k=Object.keys(NET.owner).find(k=>NET.owner[k]===me);
  NET.seat=k===undefined?-1:+k;
  if(page!=='game'){manualZoom=false;go('game');}
  else{if(newGid){manualZoom=false;CS=0;setZoom(fitCS(),false);}renderGame();}
}
function onActMsg(m){
  if(NET.mode!=='host'||m.sameTab||!G)return;
  const d=m.data||{},seat=d.seat;
  if(!Number.isInteger(seat)||seat<0||seat>4||NET.owner[seat]!==m.peer)return;
  const args=Array.isArray(d.args)?d.args.slice(0,3):[];
  if(runAct(seat,String(d.a),args))commit();
}
setInterval(()=>{
  if(page==='game'&&G&&G.timer&&G.ph!=='END'&&NET.mode==='host'){
    if(Date.now()>G.dl+300){
      if(G.ph==='S'){for(const s of G.S)if(s.ctl==='h'&&can(s)){if(s.hp==='carry')sStruggle(s.i);else sEnd(s.i);}}
      else if(G.ph==='K'&&G.K.ctl==='h')kEnd();
      commit();
    }else renderHud();
  }else if(page==='game'&&G&&G.timer&&G.ph!=='END')renderHud();
},1000);

setInterval(()=>{if(page==='game'&&G&&ANYSHOCK&&G.ph!=='END'&&!document.hidden)drawBoard();},170);
go('home');

</script>
